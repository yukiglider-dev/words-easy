<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>
<style>
:root{
  --bg:#ffd6e7;
  --card:#ffffff;
  --btn:#eeeeee;
}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
  padding-top:40px;
}
.app{
  width:420px;
  background:var(--card);
  border-radius:16px;
  padding:20px;
}
button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:var(--btn);
}
.correct{background:#8bc34a;color:#fff;}
.wrong{background:#f44336;color:#fff;}
.hidden{display:none;}
.reading{font-style:italic;margin-top:8px;}
.dict-row{border-bottom:1px solid #ddd;padding:6px 0;}
.top{display:flex;justify-content:space-between;align-items:center;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <b>Words Easy</b>
    <button onclick="toggleTheme()">🌈</button>
  </div>

  <h2 id="word"></h2>
  <button onclick="toggleReading()">Показать чтение</button>
  <div id="reading" class="reading hidden"></div>

  <div id="answers"></div>

  <button onclick="showDict()">Словарь</button>
  <div id="dict" class="hidden"></div>
</div>

<script>
const words=[
 {en:'here',ru:'здесь',read:'хиэ',ok:0,streak:0,learned:false},
 {en:'go',ru:'идти',read:'гоу',ok:0,streak:0,learned:false},
 {en:'I am',ru:'я есть',read:'ай эм',ok:0,streak:0,learned:false},
 {en:'big',ru:'большой',read:'биг',ok:0,streak:0,learned:false}
];
let current=null;

const wordEl=document.getElementById('word');
const readingEl=document.getElementById('reading');
const answersEl=document.getElementById('answers');
const dictEl=document.getElementById('dict');

function pickWord(){
  current=words[Math.floor(Math.random()*words.length)];
  render();
}

function render(){
  wordEl.textContent=current.en;
  readingEl.textContent=current.read;
  readingEl.classList.add('hidden');
  answersEl.innerHTML='';

  let options=[current.ru];
  while(options.length<4){
    const r=words[Math.floor(Math.random()*words.length)].ru;
    if(!options.includes(r)) options.push(r);
  }
  options.sort(()=>Math.random()-0.5);

  options.forEach(opt=>{
    const b=document.createElement('button');
    b.textContent=opt;
    b.onclick=()=>check(b,opt);
    answersEl.appendChild(b);
  });
}

function check(btn,text){
  if(text===current.ru){
    btn.classList.add('correct');
    current.ok++; current.streak++;
    if(current.streak>=3) current.learned=true;
  }else{
    btn.classList.add('wrong');
    current.streak=0;
  }
  setTimeout(pickWord,800);
}

function toggleReading(){
  readingEl.classList.toggle('hidden');
}

function showDict(){
  dictEl.classList.toggle('hidden');
  dictEl.innerHTML='';
  words.forEach(w=>{
    const d=document.createElement('div');
    d.className='dict-row';
    d.textContent=`${w.en} — ${w.ru} — ${w.read} ✔${w.ok} ${w.learned?'⭐':''}`;
    dictEl.appendChild(d);
  });
}

let pink=true;
function toggleTheme(){
  pink=!pink;
  document.documentElement.style.setProperty('--bg',pink?'#ffd6e7':'#cce8ff');
}

pickWord();
</script>
</body>
</html>
