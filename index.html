<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Words Easy</title>

<style>
:root{
  --bg:#f6e6ef;
  --card:#fff;
  --primary:#e75480;
}
[data-theme="blue"]{
  --bg:#e6f2ff;
  --primary:#4aa3df;
}
*{box-sizing:border-box;font-family:system-ui}
body{
  margin:0;
  background:var(--bg);
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:420px;
  padding:10px;
}
header{
  display:flex;
  justify-content:space-between;
}
.tabs{
  display:flex;
  gap:5px;
  margin:10px 0;
}
.tabs button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:10px;
}
.tabs button.active{
  background:var(--primary);
  color:white;
}
.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}
.answers button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:12px;
  border:none;
}
.green{background:#8bc34a;color:white}
.red{background:#f44336;color:white}
.small{opacity:.7;font-size:14px}
</style>
</head>

<body>
<div class="app">
<header>
  <b>Words Easy</b>
  <span onclick="toggleTheme()" style="cursor:pointer">🎨</span>
</header>

<div class="tabs">
  <button onclick="openTab('test')">Тест</button>
  <button onclick="openTab('cards')">Карточки</button>
  <button onclick="openTab('repeat')">Повтор</button>
  <button onclick="openTab('input')">Ввод</button>
  <button onclick="openTab('dict')">Словарь</button>
</div>

<div id="content"></div>
</div>

<script>
const baseWords=[
 {en:"here",ru:"здесь",tr:"хиэ"},
 {en:"there",ru:"там",tr:"зэа"},
 {en:"eat",ru:"есть",tr:"ит"},
 {en:"drink",ru:"пить",tr:"дринк"},
 {en:"sleep",ru:"спать",tr:"слип"}
];

let words = JSON.parse(localStorage.getItem("words")) ||
  baseWords.map(w=>({...w,ok:0,fail:0,streak:0,learned:false}));

let currentTab = "test";
let currentWord = null;

function save(){
  localStorage.setItem("words", JSON.stringify(words));
}

function activeWords(){
  return words.filter(w=>!w.learned);
}

function pickWord(){
  const list = activeWords();
  if(!list.length) return null;
  return list.sort((a,b)=>(b.fail-b.ok)-(a.fail-a.ok))[0];
}

function openTab(t){
  currentTab=t;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  [...document.querySelectorAll(".tabs button")]
    .find(b=>b.textContent.toLowerCase().includes(t))
    .classList.add("active");
  render();
}

function render(){
  const c=document.getElementById("content");
  currentWord = pickWord();

  if(currentTab==="test"){
    if(!currentWord){
      c.innerHTML="<div class='card'>Все слова выучены ⭐</div>";
      return;
    }
    const opts=[currentWord.ru,
      ...activeWords().filter(w=>w!==currentWord)
      .sort(()=>.5-Math.random()).slice(0,3).map(w=>w.ru)
    ].sort(()=>.5-Math.random());

    c.innerHTML=`
    <div class="card">
      <h2>${currentWord.en}</h2>
      <button onclick="toggleTr(this)">Показать чтение</button>
      <div class="small" style="display:none">${currentWord.tr}</div>
      <div class="answers">
        ${opts.map(o=>`<button onclick="answer(this,'${o}')">${o}</button>`).join("")}
      </div>
    </div>`;
  }

  if(currentTab==="dict"){
    c.innerHTML=`<div class="card">
      ${words.map((w,i)=>`${i+1}. ${w.en} — ${w.ru}${w.learned?" ⭐":""}`).join("<br>")}
    </div>`;
  }
}

function answer(btn,ru){
  const buttons = btn.parentElement.querySelectorAll("button");
  buttons.forEach(b=>b.disabled=true);

  if(ru===currentWord.ru){
    btn.classList.add("green");
    currentWord.ok++;
    currentWord.streak++;
    if(currentWord.streak>=3) currentWord.learned=true;
  }else{
    btn.classList.add("red");
    currentWord.fail++;
    currentWord.streak=0;
  }
  save();
  setTimeout(render,700);
}

function toggleTr(b){
  const d=b.nextElementSibling;
  d.style.display=d.style.display==="none"?"block":"none";
}

function toggleTheme(){
  document.body.dataset.theme =
    document.body.dataset.theme==="blue"?"":"blue";
}

openTab("test");
</script>
</body>
</html>
