<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Words Easy</title>

<style>
/* === ТВОИ СТИЛИ — БЕЗ ИЗМЕНЕНИЙ === */
:root {
  --bg:#f9fbfd;--surface:#fff;--text:#1f3042;--muted:#5c6b7a;
  --primary:#58a6ff;--success:#34c759;--error:#ff3b30;
  --accent-1:#e6f2ff;--accent-2:#e9ffe6;--accent-3:#ffe9e9;
  --border:#dde6ef;--shadow:0 8px 24px rgba(31,48,66,.08)
}
[data-theme="dark"]{
  --bg:#0f1722;--surface:#152233;--text:#eaf1f9;--muted:#b3c0cc;
  --border:#233244;--shadow:0 8px 24px rgba(0,0,0,.35)
}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
.app{max-width:1100px;margin:0 auto;padding:16px}
.header{position:relative;text-align:center;margin-bottom:12px}
.header-mini{position:absolute;top:0;right:0;display:flex;gap:8px}
.mini-counter,.mini-theme{
  font-size:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:4px 8px;box-shadow:var(--shadow)
}
.mini-theme{cursor:pointer}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.tab-btn{padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:#fff}
.tab-btn.active{background:var(--primary);color:#fff}
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;
box-shadow:var(--shadow);padding:16px;min-height:220px}
.card{border:1px solid var(--border);border-radius:16px;padding:24px;
box-shadow:var(--shadow);text-align:center}
.options{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.option{padding:10px;border-radius:12px;border:1px solid var(--border);cursor:pointer}
.option.correct{background:var(--accent-2)}
.option.wrong{background:var(--accent-3)}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;justify-content:center;margin-top:12px}
</style>
</head>

<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <h1>Words Easy</h1>
    <div class="header-mini">
      <div class="mini-counter" id="miniCounter">— / —</div>
      <button class="mini-theme" id="miniTheme">🌙</button>
    </div>
  </div>

  <!-- TABS + PANEL -->
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>

</div>

<script>
/* === ДАННЫЕ (БЕЗ ИЗМЕНЕНИЙ) === */
const words = [
 {en:'understand',ru:'понимать',tr:'андэстэнд'},
 {en:'describe',ru:'описывать',tr:'дискрайб'},
 {en:'enough',ru:'достаточно',tr:'инаф'},
 {en:'they need',ru:'им нужно',tr:'зэй нид'}
].map(w=>({...w,streak:0,errors:0}));

/* === ВКЛАДКИ === */
const tabs=[
 {id:'test',label:'Тест'},
 {id:'cards',label:'Карточки'}
];
let activeTab='test';
const tabsEl=document.getElementById('tabs');
const panelEl=document.getElementById('panel');

function renderTabs(){
 tabsEl.innerHTML=tabs.map(t=>
  `<button class="tab-btn ${t.id===activeTab?'active':''}" data-tab="${t.id}">${t.label}</button>`
 ).join('');
 tabsEl.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{activeTab=b.dataset.tab;renderPanel();}
 });
}

/* === ПРОГРЕСС === */
function updateProgress(){
 document.getElementById('miniCounter').textContent=`${words.filter(w=>w.streak<3).length} / ${words.length}`;
}

/* === ТЕСТ === */
let testIndex=0;
function renderTest(){
 const w=words[testIndex%words.length];
 const options=[w.ru,...words.filter(x=>x!==w).map(x=>x.ru)].slice(0,4).sort(()=>Math.random()-.5);

 panelEl.innerHTML=`
 <div class="card">
   <div id="testWord" style="font-size:22px;font-weight:700;cursor:pointer">${w.en}</div>
   <div id="testTr" class="muted" style="display:none;margin-top:6px">/${w.tr}/</div>
 </div>
 <div class="options">
   ${options.map(o=>`<div class="option" data-v="${o}">${o}</div>`).join('')}
 </div>
 `;

 document.getElementById('testWord').onclick=()=>{
  const tr=document.getElementById('testTr');
  tr.style.display=tr.style.display==='none'?'block':'none';
 };

 panelEl.querySelectorAll('.option').forEach(o=>{
  o.onclick=()=>{
   if(o.dataset.v===w.ru){o.classList.add('correct');w.streak++}
   else{o.classList.add('wrong');w.errors++;w.streak=0}
   updateProgress();
   setTimeout(()=>{testIndex++;renderTest()},600);
  };
 });
}

/* === КАРТОЧКИ (ВОЗВРАЩЕНЫ КАК БЫЛИ) === */
let cardIndex=0;
function renderCards(){
 const w=words[cardIndex%words.length];
 panelEl.innerHTML=`
 <div class="card">
  <div style="font-size:22px;font-weight:700">${w.en}</div>
  <div class="muted" style="margin-top:8px">${w.ru}</div>
 </div>
 <div class="row">
  <button id="dontKnow">Не знаю</button>
  <button id="know">Знаю</button>
 </div>
 `;
 document.getElementById('dontKnow').onclick=()=>{
  w.errors++;w.streak=0;cardIndex++;updateProgress();renderCards();
 };
 document.getElementById('know').onclick=()=>{
  w.streak++;cardIndex++;updateProgress();renderCards();
 };
}

/* === РЕНДЕР === */
function renderPanel(){
 renderTabs();
 updateProgress();
 if(activeTab==='test')renderTest();
 if(activeTab==='cards')renderCards();
}

document.getElementById('miniTheme').onclick=()=>{
 document.documentElement.dataset.theme=
 document.documentElement.dataset.theme==='light'?'dark':'light';
};

renderPanel();
</script>
</body>
</html>
