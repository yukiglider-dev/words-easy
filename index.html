<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Words Easy</title>
  <style>
    :root {
      --bg: #f9fbfd;
      --surface: #ffffff;
      --text: #1f3042;
      --muted: #5c6b7a;
      --primary: #58a6ff;
      --success: #34c759;
      --error: #ff3b30;
      --accent-1: #e6f2ff;
      --accent-2: #e9ffe6;
      --accent-3: #ffe9e9;
      --border: #dde6ef;
      --card-radius: 14px;
      --btn-radius: 12px;
      --shadow: 0 8px 24px rgba(31,48,66,0.08);
    }
    [data-theme="dark"] {
      --bg: #0f1722;
      --surface: #152233;
      --text: #eaf1f9;
      --muted: #b3c0cc;
      --success: #35d27f;
      --error: #ff6b5e;
      --accent-1: #152a40;
      --accent-2: #163024;
      --accent-3: #3a1f1f;
      --border: #233244;
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, sans-serif;
      margin: 0;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    .header { text-align: center; margin-bottom: 12px; }
    .brand-title { font-weight: 800; font-size: 26px; }

    /* ===== ДОБАВЛЕНО: MINI UI ===== */
    .mini-ui {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 999;
    }
    .mini-counter {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: var(--muted);
      font-weight: 600;
    }
    .mini-theme {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      box-shadow: var(--shadow);
      font-size: 14px;
    }
    /* ===== КОНЕЦ ДОБАВЛЕНИЯ ===== */

    /* остальной CSS — БЕЗ ИЗМЕНЕНИЙ */
    /* ... */
  </style>
</head>
<body>

  <!-- ===== ДОБАВЛЕНО: мини-счётчик + тумблер ===== -->
  <div class="mini-ui">
    <div class="mini-counter" id="miniCounter">— / —</div>
    <button class="mini-theme" id="miniTheme" title="Сменить тему">🌙</button>
  </div>
  <!-- ===== КОНЕЦ ДОБАВЛЕНИЯ ===== -->

  <div class="app">
    <div class="header">
      <div class="brand-title">Words Easy</div>
      <div class="progress" id="progressBar">
        <div class="progress-item">
          <div class="progress-label">Осталось к изучению</div>
          <div class="progress-value" id="remainingCount">—</div>
        </div>
        <div class="progress-item">
          <div class="progress-label">Всего слов</div>
          <div class="progress-value" id="totalCount">—</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="toggleTranscription">Показать транскрипцию</button>
        <button class="btn" id="themeSwitch">Переключить тему</button>
        <button class="btn error" id="resetAll">Полный сброс</button>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>

<script>
  /* ТВОЙ JS — БЕЗ УДАЛЕНИЙ */

  function updateProgress() {
    const total = words.length;
    const remaining = words.filter(w => !isLearned(w)).length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('remainingCount').textContent = remaining;

    /* ===== ДОБАВЛЕНО ===== */
    const mini = document.getElementById('miniCounter');
    if (mini) mini.textContent = `${total - remaining} / ${total}`;
    /* ===== КОНЕЦ ===== */
  }

  /* ===== ДОБАВЛЕНО: мини-тумблер темы ===== */
  const miniTheme = document.getElementById('miniTheme');
  if (miniTheme) {
    miniTheme.onclick = () => {
      settings.theme = settings.theme === 'light' ? 'dark' : 'light';
      saveSettings();
    };
  }
  /* ===== КОНЕЦ ===== */

</script>
</body>
</html>
