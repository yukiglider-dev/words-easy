<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Words Easy</title>

<style>
/* === СТИЛИ БЕЗ ИЗМЕНЕНИЙ === */
:root {
  --bg:#f9fbfd;--surface:#fff;--text:#1f3042;--muted:#5c6b7a;
  --primary:#58a6ff;--success:#34c759;--error:#ff3b30;
  --accent-1:#e6f2ff;--accent-2:#e9ffe6;--accent-3:#ffe9e9;
  --border:#dde6ef;--shadow:0 8px 24px rgba(31,48,66,.08)
}
[data-theme="dark"]{
  --bg:#0f1722;--surface:#152233;--text:#eaf1f9;--muted:#b3c0cc;
  --border:#233244;--shadow:0 8px 24px rgba(0,0,0,.35)
}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
.app{max-width:1100px;margin:auto;padding:16px}

.header{position:relative;text-align:center}
.brand-title{font-size:26px;font-weight:800}

.header-mini{position:absolute;top:0;right:0;display:flex;gap:8px}
.mini-counter,.mini-theme{
  font-size:12px;background:var(--surface);
  border:1px solid var(--border);
  border-radius:999px;padding:4px 8px;
  box-shadow:var(--shadow)
}
.mini-theme{cursor:pointer}

.tabs{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap}
.tab-btn{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.tab-btn.active{background:var(--primary);color:#fff;border-color:transparent}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:16px;
  min-height:220px
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div class="brand-title">Words Easy</div>
    <div class="header-mini">
      <div class="mini-counter" id="miniCounter">— / —</div>
      <button class="mini-theme" id="miniTheme">🌙</button>
    </div>
  </div>

  <!-- ✅ ВАЖНО: ВОЗВРАЩЕНЫ ЯКОРЯ -->
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>

</div>

<script>
/* === НАСТРОЙКИ === */
const STORAGE_KEY='words_easy_final_v1';
const SETTINGS_KEY='words_easy_settings_final_v1';

let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY))||{showTr:false,theme:'light'};
document.documentElement.setAttribute('data-theme',settings.theme);

document.getElementById('miniTheme').onclick=()=>{
  settings.theme=settings.theme==='light'?'dark':'light';
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
  document.documentElement.setAttribute('data-theme',settings.theme);
};

/* === СЛОВА (БЕЗ ИЗМЕНЕНИЙ) === */
const initialWords=[{en:'here',ru:'здесь',tr:'хиа'}].map((w,i)=>({...w,id:i+1,streak:0,errors:0,manual:false}));
let words=JSON.parse(localStorage.getItem(STORAGE_KEY))||initialWords;

function saveState(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(words));
  updateMiniCounter();
}

/* === ВКЛАДКИ === */
const tabs=[
{id:'test',label:'Тест'},
{id:'cards',label:'Карточки'},
{id:'repeat',label:'Повтор'},
{id:'input',label:'Ввод'},
{id:'dict',label:'Словарь'},
{id:'match',label:'Сопоставление'},
];
let activeTab='test';

const tabsEl=document.getElementById('tabs');
const panelEl=document.getElementById('panel');

function renderTabs(){
  tabsEl.innerHTML=tabs.map(t=>`
    <button class="tab-btn ${t.id===activeTab?'active':''}" data-tab="${t.id}">${t.label}</button>
  `).join('');
  tabsEl.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{activeTab=b.dataset.tab;renderPanel()}
  });
}

/* === СЧЕТЧИК === */
function updateMiniCounter(){
  const total=words.length;
  const rem=words.filter(w=>w.streak<3&&!w.manual).length;
  document.getElementById('miniCounter').textContent=`${rem} / ${total}`;
}

/* === ПАНЕЛЬ === */
function renderPanel(){
  renderTabs();
  updateMiniCounter();
  panelEl.innerHTML=`<div style="text-align:center;color:var(--muted)">Раздел: ${activeTab}</div>`;
}

/* === ЗАПУСК === */
renderPanel();
</script>

</body>
</html>
