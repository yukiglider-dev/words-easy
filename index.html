<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
:root{--bg:#ffd6e7;--card:#fff;--btn:#eee}
body{margin:0;font-family:Arial;background:var(--bg);display:flex;justify-content:center;padding:20px}
.app{width:540px;background:var(--card);border-radius:18px;padding:16px}
.header{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px}
.title{text-align:center;font-weight:bold;font-size:18px;grid-column:1/4}
.palette{width:22px;height:22px;border-radius:50%;border:2px solid #aaa;cursor:pointer;background:linear-gradient(45deg,#ffd6e7,#cce8ff)}
.langToggle{font-size:11px;padding:4px 6px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--btn);border:none;cursor:pointer;font-size:13px}
.tab.active{background:#cce8ff;font-weight:bold}
.hidden{display:none}
button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:12px;cursor:pointer;background:var(--btn)}
.correct{background:#8bc34a;color:#fff}
.wrong{background:#f44336;color:#fff}
.center{text-align:center}

.read{font-style:italic;color:#666;font-size:14px;margin:6px 0}

.cardWrap{perspective:1000px}
.card{
  border:1px solid #ddd;
  border-radius:16px;
  padding:40px;
  text-align:center;
  font-size:24px;
  cursor:pointer;
  min-height:120px;
  user-select:none;
  transition:transform .6s;
  transform-style:preserve-3d;
}
.card.flipped{transform:rotateY(180deg)}

.controls{display:flex;gap:10px;margin-top:10px}

.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border-bottom:1px solid #ddd;padding:6px;text-align:left}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <div></div>
  <div class="langToggle" onclick="toggleLang()" id="langBtn">EN</div>
  <div class="palette" onclick="toggleTheme()"></div>
  <div class="title">Words Easy</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="openTab('test',this)">Тест</button>
  <button class="tab" onclick="openTab('cards',this)">Карточки</button>
  <button class="tab" onclick="openTab('repeat',this)">Повтор</button>
  <button class="tab" onclick="openTab('input',this)">Ввод</button>
  <button class="tab" onclick="openTab('dict',this)">Словарь</button>
</div>

<!-- ТЕСТ -->
<div id="test" class="center">
  <h2 id="word"></h2>
  <div id="reading" class="read hidden"></div>
  <button onclick="toggleReading()" id="readBtn">Показать чтение</button>
  <div id="answers"></div>
</div>

<!-- КАРТОЧКИ -->
<div id="cards" class="hidden center">
  <div class="cardWrap">
    <div id="card" class="card" onclick="flipCard()"></div>
  </div>
  <div class="controls hidden" id="cardBtns">
    <button class="correct" onclick="cardYes()">Знаю</button>
    <button class="wrong" onclick="cardNo()">Не знаю</button>
  </div>
</div>

<!-- ПОВТОР -->
<div id="repeat" class="hidden center">
  <h3 id="repeatWord"></h3>
  <button class="correct" onclick="repeatYes()">Знаю</button>
  <button class="wrong" onclick="repeatNo()">Не знаю</button>
</div>

<!-- ВВОД -->
<div id="input" class="hidden">
  <h3 id="inputRu"></h3>
  <div id="inputReading" class="read hidden"></div>
  <button onclick="toggleReading()">Показать чтение</button>
  <input id="inputEn" placeholder="Введи английское слово"
    onkeydown="if(event.key==='Enter')checkInput()"
    style="width:100%;padding:10px;border-radius:10px;border:1px solid #ccc">
  <button onclick="checkInput()">Проверить</button>
</div>

<!-- СЛОВАРЬ -->
<div id="dict" class="hidden"></div>

</div>

<script>
const raw = [
"analyse|анализировать|энэлайз",
"apologise|извиняться|эполоджайз",
"arrive|прибывать|эрайв",
"ask|спрашивать|аск",
"at school|в школе|эт скул",
"begin|начинать|бигин",
"busy|занятый|бизи",
"buy|покупать|бай",
"cheap|дёшево|чип",
"collect|коллекционировать|колэкт",
"confuse|путать|кэнфьюз",
"continue|продолжать|континью",
"cosy|уютный|коузи",
"creative|творческий|криэйтив",
"describe|описывать|дискрáйб",
"drink|пить|дринк",
"eat|есть|ит",
"enough|достаточно|инаф",
"expensive|дорого|икспэнсив",
"explain|объяснять|иксплэйн",
"finish|заканчивать|финиш",
"forget|забывать|фэгэт",
"forgive|прощать|фэгив",
"get back|добираться обратно|гэт бэк",
"get here|добираться сюда|гэт хиэ",
"get home|добираться домой|гэт хоум",
"get there|добираться туда|гэт зэа",
"get to|добираться до|гэт ту",
"hardworking|трудолюбивый|хардворкинг",
"he likes|ему нравится|хи лайкс",
"he needs|ему нужно|хи нидз",
"he’s rich|он богатый|хиз рич",
"here|здесь|хиэ",
"how many|сколько|хау мэни",
"how much|сколько|хау мач",
"how often|как часто|хау офн",
"how regularly|как регулярно|хау рэгьюлэли",
"I like|мне нравится|ай лайк",
"I need|мне нужно|ай нид",
"I’m busy|я занят|айм бизи",
"impossible|невозможно|импосибл",
"interrupt|перебивать|интэрапт",
"it’s cosy|это уютно|итс коузи",
"it’s enough|этого достаточно|итс инаф",
"it’s impossible|это невозможно|итс импосибл",
"it’s possible|это возможно|итс посибл",
"know|знать|ноу",
"patient|терпеливый|пэйшэнт",
"play|играть|плэй",
"poor|бедный|пуа",
"possible|возможно|посибл",
"punctual|пунктуальный|панкчуал",
"read|читать|рид",
"rich|богатый|рич",
"she likes|ей нравится|ши лайкс",
"she needs|ей нужно|ши нидз",
"she’s poor|она бедная|шиз пуа",
"sleep|спать|слиип",
"start|начинать|старт",
"strong|сильный|стронг",
"study|учиться|стади",
"take|брать|тэйк",
"there|там|зэа",
"they like|им нравится|зэй лайк",
"they need|им нужно|зэй нид",
"they’re right|они правы|зэй райт",
"think|думать|синк",
"understand|понимать|андэстэнд",
"use|пользоваться|юз",
"wait|ждать|вэйт",
"weak|слабый|уик",
"we like|нам нравится|уи лайк",
"we need|нам нужно|уи нид",
"we’re right|мы правы|уи райт",
"what|что|вот",
"when|когда|уэн",
"where|где / куда|уэа",
"who|кто / кого|ху",
"why|почему|вай",
"work|работать|вёрк",
"write|писать|райт",
"you like|тебе / вам нравится|ю лайк",
"you need|тебе / вам нужно|ю нид",
"you’re right|ты / вы правы|йо райт"
];

let words = JSON.parse(localStorage.getItem('words')) ||
raw.map(s=>{
  const[a,b,c]=s.split('|');
  return{en:a,ru:b,read:c,ok:0,err:0,streak:0,learned:false}
});

let pool=[...words],errors=[],current;
let showRead=false,cardSide=0,lang='en';

const w=word, a=answers, r=reading, rb=repeatWord,
card=document.getElementById('card'),
cardBtns=document.getElementById('cardBtns');

function save(){localStorage.setItem('words',JSON.stringify(words))}

function pick(){
  const hard=words.filter(x=>x.err>0&&!x.learned);
  pool=hard.length?hard:words.filter(x=>!x.learned);
  current=pool[Math.floor(Math.random()*pool.length)];
  showRead=false;
  r.classList.add('hidden');
  readBtn.textContent='Показать чтение';
  renderTest(); renderCard(); renderInput();
}

function renderTest(){
  w.textContent=current.en;
  a.innerHTML='';
  let opts=[current.ru];
  while(opts.length<4){
    let x=words[Math.floor(Math.random()*words.length)].ru;
    if(!opts.includes(x))opts.push(x);
  }
  opts.sort(()=>Math.random()-0.5).forEach(t=>{
    let b=document.createElement('button');
    b.textContent=t;
    b.onclick=()=>{
      if(t===current.ru){
        current.ok++; current.streak++;
        if(current.streak>=3)current.learned=true;
      }else{current.err++; current.streak=0;}
      save(); setTimeout(pick,300);
    };
    a.appendChild(b);
  });
}

function toggleReading(){
  showRead=!showRead;
  r.textContent=current.read;
  r.classList.toggle('hidden',!showRead);
  inputReading.textContent=current.read;
  inputReading.classList.toggle('hidden',!showRead);
  readBtn.textContent=showRead?'Скрыть чтение':'Показать чтение';
}

function renderCard(){
  card.classList.remove('flipped');
  cardSide=0;
  card.textContent=lang==='en'?current.en:current.ru;
  cardBtns.classList.add('hidden');
}

function flipCard(){
  cardSide^=1;
  card.classList.toggle('flipped');
  card.textContent=cardSide?(lang==='en'?current.ru:current.en):(lang==='en'?current.en:current.ru);
  cardBtns.classList.remove('hidden');
}

function cardYes(){current.learned=true;save();pick()}
function cardNo(){current.err++;save();pick()}

function renderInput(){
  inputRu.textContent=current.ru;
  inputEn.value='';
}

function checkInput(){
  if(inputEn.value.toLowerCase()===current.en.toLowerCase()){
    current.ok++; current.streak++;
    if(current.streak>=3)current.learned=true;
  }else{current.err++; current.streak=0;}
  save(); pick();
}

function renderDict(){
  dict.innerHTML='<table class="table"><tr><th>#</th><th>EN</th><th>RU</th><th>Чтение</th><th>⭐</th></tr></table>';
  const t=dict.querySelector('table');
  words.sort((a,b)=>a.en.localeCompare(b.en)).forEach((w,i)=>{
    t.innerHTML+=`<tr>
      <td>${i+1}</td><td>${w.en}</td><td>${w.ru}</td>
      <td>${w.read}</td><td>${w.learned?'⭐':''}</td></tr>`;
  });
}

function openTab(id,b){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['test','cards','repeat','input','dict'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='dict')renderDict();
  if(id==='repeat')renderRepeat();
}

function renderRepeat(){
  const list=words.filter(x=>x.err>0);
  rb.textContent=list.length?list[Math.floor(Math.random()*list.length)].en:'Нет слов для повтора';
}

function repeatYes(){pick()}
function repeatNo(){current.err++;save();pick()}

function toggleLang(){lang=lang==='en'?'ru':'en';langBtn.textContent=lang.toUpperCase();renderCard()}
let pink=true;function toggleTheme(){pink=!pink;document.documentElement.style.setProperty('--bg',pink?'#ffd6e7':'#cce8ff')}

pick();
</script>
</body>
</html>
