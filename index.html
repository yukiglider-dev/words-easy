
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
:root{--bg:#ffd6e7;--card:#fff;--btn:#eee}
body{margin:0;font-family:Arial;background:var(--bg);display:flex;justify-content:center;padding:20px}
.app{width:540px;background:var(--card);border-radius:18px;padding:16px}

.header{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px}
.title{text-align:center;font-weight:bold;font-size:18px;grid-column:1/4}

.palette{width:22px;height:22px;border-radius:50%;border:2px solid #aaa;cursor:pointer;
background:linear-gradient(45deg,#ffd6e7,#cce8ff)}

.langToggle{font-size:11px;padding:4px 6px;border-radius:8px;border:1px solid #ccc;
background:#fff;cursor:pointer}

.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--btn);border:none;cursor:pointer;font-size:13px}
.tab.active{background:#cce8ff;font-weight:bold}

.hidden{display:none}
button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:12px;cursor:pointer;background:var(--btn)}
.correct{background:#8bc34a;color:#fff}
.wrong{background:#f44336;color:#fff}

.cardWrap{perspective:1000px}
.card{
border:1px solid #ddd;border-radius:16px;
min-height:120px;
display:flex;align-items:center;justify-content:center;
font-size:26px;cursor:pointer;
transition:transform .6s;
transform-style:preserve-3d;
}
.card.flip{transform:rotateY(180deg)}

.side{
position:absolute;width:100%;backface-visibility:hidden;
display:flex;align-items:center;justify-content:center;
padding:30px;
}
.back{transform:rotateY(180deg)}

.controls{display:flex;gap:10px}

.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border-bottom:1px solid #ddd;padding:6px;text-align:left}
.center{text-align:center}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <div></div>
  <div class="langToggle" id="langBtn" onclick="toggleCardLang()">EN</div>
  <div class="palette" onclick="toggleTheme()"></div>
  <div class="title">Words Easy</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="openTab('test',this)">Тест</button>
  <button class="tab" onclick="openTab('cards',this)">Карточки</button>
  <button class="tab" onclick="openTab('repeat',this)">Повтор</button>
  <button class="tab" onclick="openTab('input',this)">Ввод</button>
  <button class="tab" onclick="openTab('dict',this)">Словарь</button>
</div>

<!-- ТЕСТ -->
<div id="test" class="center">
  <h2 id="testWord"></h2>
  <div id="answers"></div>
</div>

<!-- КАРТОЧКИ -->
<div id="cards" class="hidden center">
  <div class="cardWrap" onclick="flipCard()">
    <div id="card" class="card">
      <div class="side front" id="front"></div>
      <div class="side back" id="back"></div>
    </div>
  </div>
  <div class="controls">
    <button class="correct" onclick="cardYes()">Знаю</button>
    <button class="wrong" onclick="cardNo()">Не знаю</button>
  </div>
</div>

<!-- ПОВТОР -->
<div id="repeat" class="hidden center">
  <h3 id="repeatWord"></h3>
  <button class="correct" onclick="repeatYes()">Знаю</button>
  <button class="wrong" onclick="repeatNo()">Не знаю</button>
</div>

<!-- ВВОД -->
<div id="input" class="hidden">
  <h3 id="inputRu"></h3>
  <input id="inputEn" placeholder="Введи английское слово"
  onkeydown="if(event.key==='Enter')checkInput()"
  style="width:100%;padding:10px;border-radius:10px;border:1px solid #ccc">
  <button onclick="checkInput()">Проверить</button>
</div>

<!-- СЛОВАРЬ -->
<div id="dict" class="hidden"></div>

</div>

<script>
const raw = [
"analyse|анализировать|энэлайз",
"apologise|извиняться|эполоджайз",
"arrive|прибывать|эрайв",
"ask|спрашивать|аск",
"at school|в школе|эт скул",
"begin|начинать|бигин",
"busy|занятый|бизи",
"buy|покупать|бай",
"cheap|дёшево|чип",
"collect|коллекционировать|колэкт",
"confuse|путать|кэнфьюз",
"continue|продолжать|континью",
"cosy|уютный|коузи",
"creative|творческий|криэйтив",
"describe|описывать|дискрáйб",
"drink|пить|дринк",
"eat|есть|ит",
"enough|достаточно|инаф",
"expensive|дорого|икспэнсив",
"explain|объяснять|иксплэйн",
"finish|заканчивать|финиш",
"forget|забывать|фэгэт",
"forgive|прощать|фэгив",
"get back|добираться обратно|гэт бэк",
"get here|добираться сюда|гэт хиэ",
"get home|добираться домой|гэт хоум",
"get there|добираться туда|гэт зэа",
"get to|добираться до|гэт ту",
"hardworking|трудолюбивый|хардворкинг",
"he likes|ему нравится|хи лайкс",
"he needs|ему нужно|хи нидз",
"he’s rich|он богатый|хиз рич",
"here|здесь|хиэ",
"how many|сколько|хау мэни",
"how much|сколько|хау мач",
"how often|как часто|хау офн",
"how regularly|как регулярно|хау рэгьюлэли",
"I like|мне нравится|ай лайк",
"I need|мне нужно|ай нид",
"I’m busy|я занят|айм бизи",
"impossible|невозможно|импосибл",
"interrupt|перебивать|интэрапт",
"it’s cosy|это уютно|итс коузи",
"it’s enough|этого достаточно|итс инаф",
"it’s impossible|это невозможно|итс импосибл",
"it’s possible|это возможно|итс посибл",
"know|знать|ноу",
"patient|терпеливый|пэйшэнт",
"play|играть|плэй",
"poor|бедный|пуа",
"possible|возможно|посибл",
"punctual|пунктуальный|панкчуал",
"read|читать|рид",
"rich|богатый|рич",
"she likes|ей нравится|ши лайкс",
"she needs|ей нужно|ши нидз",
"she’s poor|она бедная|шиз пуа",
"sleep|спать|слиип",
"start|начинать|старт",
"strong|сильный|стронг",
"study|учиться|стади",
"take|брать|тэйк",
"there|там|зэа",
"they like|им нравится|зэй лайк",
"they need|им нужно|зэй нид",
"they’re right|они правы|зэй райт",
"think|думать|синк",
"understand|понимать|андэстэнд",
"use|пользоваться|юз",
"wait|ждать|вэйт",
"weak|слабый|уик",
"we like|нам нравится|уи лайк",
"we need|нам нужно|уи нид",
"we’re right|мы правы|уи райт",
"what|что|вот",
"when|когда|уэн",
"where|где / куда|уэа",
"who|кто / кого|ху",
"why|почему|вай",
"work|работать|вёрк",
"write|писать|райт",
"you like|тебе / вам нравится|ю лайк",
"you need|тебе / вам нужно|ю нид",
"you’re right|ты / вы правы|йо райт"
];


const words=raw.map(s=>{
const[a,b,c]=s.split("|");
return{en:a,ru:b,read:c,ok:0}
}).sort((a,b)=>a.en.localeCompare(b.en));

let pool=[...words],errors=[],current,cardLang="en",flipped=false;

const testWord=document.getElementById("testWord");
const answers=document.getElementById("answers");
const front=document.getElementById("front");
const back=document.getElementById("back");
const card=document.getElementById("card");
const ir=document.getElementById("inputRu");
const ie=document.getElementById("inputEn");
const d=document.getElementById("dict");
const rb=document.getElementById("repeatWord");
const langBtn=document.getElementById("langBtn");

function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}

function pick(){
current=rnd(pool);
renderTest();
renderCard();
renderInput();
}

function renderTest(){
testWord.textContent=current.en;
answers.innerHTML="";
let opts=[current.ru];
while(opts.length<4){
let x=rnd(words).ru;
if(!opts.includes(x))opts.push(x);
}
opts.sort(()=>Math.random()-0.5).forEach(t=>{
let b=document.createElement("button");
b.textContent=t;
b.onclick=()=>{
if(t===current.ru){current.ok++}else{errors.push(current)}
pick();
};
answers.appendChild(b);
});
}

function renderCard(){
flipped=false;
card.classList.remove("flip");
front.textContent=cardLang==="en"?current.en:current.ru;
back.textContent=cardLang==="en"?current.ru:current.en;
}

function flipCard(){
flipped=!flipped;
card.classList.toggle("flip",flipped);
}

function cardYes(){pool=pool.filter(x=>x!==current);pick()}
function cardNo(){errors.push(current);pick()}

function toggleCardLang(){
cardLang=cardLang==="en"?"ru":"en";
langBtn.textContent=cardLang.toUpperCase();
renderCard();
}

function renderInput(){ir.textContent=current.ru;ie.value=""}
function checkInput(){
ie.value.toLowerCase()===current.en.toLowerCase()?current.ok++:errors.push(current);
pick();
}

function renderDict(){
let html="<table class='table'><tr><th>#</th><th>English</th><th>Русский</th><th>Транскрипция</th></tr>";
words.forEach((w,i)=>{
html+=`<tr><td>${i+1}</td><td>${w.en}</td><td>${w.ru}</td><td>${w.read}</td></tr>`;
});
html+="</table>";
d.innerHTML=html;
}

function openTab(id,btn){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
btn.classList.add("active");
["test","cards","repeat","input","dict"].forEach(x=>document.getElementById(x).classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
if(id==="dict")renderDict();
if(id==="repeat")renderRepeat();
}

function renderRepeat(){
rb.textContent=errors.length?rnd(errors).en:"Нет слов для повтора";
}

function repeatYes(){errors.shift();pick()}
function repeatNo(){pick()}

let pink=true;
function toggleTheme(){
pink=!pink;
document.documentElement.style.setProperty("--bg",pink?"#ffd6e7":"#cce8ff");
}

pick();
</script>
</body>
</html>
