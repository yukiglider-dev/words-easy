:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --card: #ffffff;

  --primary: #5da9ff;
  --success: #22c55e;
  --error: #ef4444;

  --border: rgba(0,0,0,0.08);
  --shadow: 0 12px 30px rgba(0,0,0,0.08);

  --card-radius: 18px;
  --btn-radius: 14px;
  --input-radius: 14px;
}


[data-theme="dark"] {
  --bg: radial-gradient(
    1200px 600px at top,
    #16243a 0%,
    #0f1722 55%,

  );

  --surface: #152233;

  --text: #eaf1f9;

  --primary: #5da9ff;
  --success: #35d27f;

  --accent-1: #1b2f4a;

  --border: #233244;
  --shadow: 0 12px 36px rgba(0,0,0,0.45);
}



html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell,

}


    .app {

      padding: 16px;
    }

    .header {

    .brand-title {

      font-size: 26px;
    }

    .progress {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      padding: 12px 16px;
      margin: 10px auto;
      max-width: 900px;
    }

    .progress-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-label { color: var(--muted); font-size: 13px; }
    .progress-value { font-weight: 700; font-size: 16px; }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }
    button, .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--btn-radius);
      cursor: pointer;
      transition: transform 0.05s ease, background 0.2s ease, border-color 0.2s ease;
      box-shadow: var(--shadow);
      font-weight: 600;
    }
    button:hover, .btn:hover { transform: translateY(-1px); }
    button.primary { background: var(--primary); color: #fff; border-color: transparent; }
    button.success { background: var(--success); color: #fff; border-color: transparent; }
    button.error { background: var(--error); color: #fff; border-color: transparent; }
.container {
  background: var(--surface);

  box-shadow: var(--shadow);
  border: 1px solid var(--border);

      border: 1px solid var(--border);
      color: var(--text);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }

    .panel {

   .card {

  min-height: 120px;

  place-items: center;
  text-align: center;
  position: relative;
  width: 100%;

}

.card .empty {
  align-content: center;
}

   .test-transcription {

    /* Тест: одна колонка — 4 строки */
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .option {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      text-align: center;
      box-shadow: var(--shadow);
      user-select: none;
    }
    .option.correct { background: var(--accent-2); border-color: var(--success); }
    .option.wrong { background: var(--accent-3); border-color: var(--error); }
    .option.selected { outline: 2px solid var(--primary); }

    /* Карточки: flip */
    .flip {
      perspective: 800px;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }
    .flip-inner {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }
    .flipped .flip-inner { transform: rotateY(180deg); }
    .flip-face {
      position: absolute;
      width: 100%;
      backface-visibility: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: var(--shadow);
      min-height: 140px;
      display: grid;
      place-items: center;
    }
    .flip-back { transform: rotateY(180deg); background: var(--accent-1); }

    /* Сопоставление: две колонки списков */
    .match-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field { display: flex; gap: 8px; align-items: center; }
    input[type="text"], select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      width: 100%;
    }

    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px; text-align: left; }
    th.center, td.center { text-align: center; }
    tr.learned-row { background: rgba(52,199,89,0.10); }

    .pill {
      font-size: 12px;
      color: var(--muted);
      background: var(--accent-1);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
    }
    .empty { text-align: center; color: var(--muted); padding: 20px; }
    
    @media (max-width: 640px) {
      .match-columns { grid-template-columns: 1fr; }
      .progress { flex-direction: column; align-items: center; }

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);

  // если localStorage пуст — просто берём initialWords
  if (!raw) return initialWords.slice();

  try {
    const saved = JSON.parse(raw);

    // карта сохранённых слов
    const savedMap = new Map(
      saved.map(w => [w.en + '|' + w.ru, w])
    );

    // 1. обновляем initialWords сохранёнными данными
    const merged = initialWords.map(w => {
      const key = w.en + '|' + w.ru;
      return savedMap.has(key)
        ? { ...w, ...savedMap.get(key) }
        : w;
    });

    // 2. добавляем слова, которых НЕТ в initialWords (ручной ввод)
    saved.forEach(w => {
      const key = w.en + '|' + w.ru;
      if (!merged.some(x => x.en + '|' + x.ru === key)) {
        merged.push(w);
      }
    });

    return merged;
  } catch (e) {
    console.error('Ошибка загрузки слов:', e);
    return initialWords.slice();
  }
}

    function isLearned(w) { return w.streak >= 3 || w.manual; }
    function getUnlearned() { return words.filter(w => !isLearned(w)); }

 function updateProgress() {
  const total = words.length;
  const remaining = words.filter(w => !isLearned(w)).length;

  const mini = document.getElementById('miniCounter');
  if (mini) mini.textContent = `${total - remaining} / ${total}`;
}

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRandom(arr, n, excludeItem) {
      const filtered = excludeItem !== undefined ? arr.filter(x => x !== excludeItem) : arr.slice();
      return shuffle(filtered).slice(0, n);
    }

    function nextOf(list, indexRef) {
      if (!list.length) return null;
      indexRef.value = (indexRef.value + 1) % list.length;
      return list[indexRef.value];
    }

function renderDict() {
  const tbody = document.getElementById("dict-body");
  if (!tbody) return;

  let list = words.slice();

  if (dictQuery.trim()) {
    const q = dictQuery.toLowerCase();
    list = list.filter(w =>
      w.en.toLowerCase().includes(q) ||
      w.ru.toLowerCase().includes(q) ||
      (w.tr || '').toLowerCase().includes(q)
    );
  }

  if (dictFilter === 'learned') {
    list = list.filter(w => isLearned(w));
  }
  if (dictFilter === 'not_learned') {
    list = list.filter(w => !isLearned(w));
  }

  tbody.innerHTML = list.length
    ? list.map((w, i) => `
      <tr class="${isLearned(w) ? 'learned-row' : ''}">
        <td class="center">${i + 1}</td>
        <td>${w.en}</td>
        <td>${w.ru}</td>
        <td>${w.tr ? `/${w.tr}/` : ''}</td>
        <td class="center">${w.streak}</td>
        <td class="center">${w.errors}</td>
        <td class="center">
          <input
            type="checkbox"
            class="dictManual"
            data-id="${w.id}"
            ${w.manual ? 'checked' : ''}
          >
        </td>
        <td class="center">
          <button class="btn error btn-del" data-id="${w.id}">✕</button>
        </td>
      </tr>
    `).join('')
    : `<tr><td colspan="8" class="center muted">Ничего не найдено</td></tr>`;

  bindDictActions();
}


function bindDictActions() {
  document.querySelectorAll('.dictManual').forEach(ch => {
    ch.onchange = () => {
      const w = words.find(x => x.id === Number(ch.dataset.id));
      if (w) w.manual = ch.checked;
      saveState();
      renderDict();
    };
  });

  document.querySelectorAll('.btn-del').forEach(btn => {
    btn.onclick = () => {
      const id = Number(btn.dataset.id);
      const w = words.find(x => x.id === id);
      if (!w) return;

      if (!confirm(`Удалить слово "${w.en}"?`)) return;

      words = words.filter(x => x.id !== id);
      saveState();
      renderDict();
    };
  });
}



    // ---------- Tab: Match ----------
    let matchSet = [];
    let matchPicked = null;

    function makeMatchSet(size = 4) {
      const pool = getUnlearned();
      const base = (pool.length ? pool : words);
      const chosen = pickRandom(base, Math.min(size, base.length));
      matchSet = chosen.map(w => ({ id: w.id, en: w.en, ru: w.ru }));
    }

    function renderMatch() {
      if (!matchSet.length) makeMatchSet(4);
      if (!matchSet.length) { panelEl.innerHTML = `<div class="empty">Слова недоступны для сопоставления.</div>`; return; }

      const ens = shuffle(matchSet.map(m => ({ type: 'en', id: m.id, text: m.en })));
      const rus = shuffle(matchSet.map(m => ({ type: 'ru', id: m.id, text: m.ru })));

      panelEl.innerHTML = `
        <div class="match-columns">
          <div>
            <div class="muted" style="margin-bottom:8px; text-align:center">Английские</div>
            <div class="grid" id="matchEn">
              ${ens.map(e => `<div class="option" data-id="${e.id}" data-type="en">${e.text}</div>`).join('')}
            </div>
          </div>
          <div>
            <div class="muted" style="margin-bottom:8px; text-align:center">Русские</div>
            <div class="grid" id="matchRu">
              ${rus.map(r => `<div class="option" data-id="${r.id}" data-type="ru">${r.text}</div>`).join('')}
            </div>
          </div>
        </div>
      `;

      const all = panelEl.querySelectorAll('.option');
      all.forEach(el => {
        el.onclick = () => {
          const id = Number(el.dataset.id);
          const type = el.dataset.type;
          if (!matchPicked) {
            if (type !== 'en') return; // сначала выбираем английское слово
            matchPicked = id;
            el.classList.add('selected');
          } else {
            if (type !== 'ru') return;
            const pairId = id;
            const correct = pairId === matchPicked;
            const enEl = panelEl.querySelector(`.option[data-type="en"][data-id="${matchPicked}"]`);
            const ruEl = el;
            if (correct) {
              enEl.classList.add('correct');
              ruEl.classList.add('correct');
              const w = words.find(x => x.id === matchPicked);
              if (w) w.streak += 1;
              // удалить пару сразу
              matchSet = matchSet.filter(m => m.id !== matchPicked);
              saveState();
            } else {
              enEl.classList.add('wrong');
              ruEl.classList.add('wrong');
              const w = words.find(x => x.id === matchPicked);
              if (w) { w.errors += 1; w.streak = 0; }
              saveState();
            }
            matchPicked = null;
            setTimeout(() => {
              if (!matchSet.length) { makeMatchSet(4); }
              renderMatch();
            }, 500);
          }
        };
      });
    }
