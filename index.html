<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
:root{--bg:#ffd6e7;--card:#fff;--btn:#eee}
body{margin:0;font-family:Arial;background:var(--bg);display:flex;justify-content:center;padding:20px}
.app{width:540px;background:var(--card);border-radius:18px;padding:16px}
.header{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px}
.title{text-align:center;font-weight:bold;font-size:18px;grid-column:1/4}
.palette{width:22px;height:22px;border-radius:50%;border:2px solid #aaa;cursor:pointer;background:linear-gradient(45deg,#ffd6e7,#cce8ff)}
.langToggle{font-size:11px;padding:4px 6px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}

.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--btn);border:none;cursor:pointer;font-size:13px}
.tab.active{background:#cce8ff;font-weight:bold}
.hidden{display:none}

button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:12px;cursor:pointer;background:var(--btn)}
.correct{background:#8bc34a;color:#fff}
.wrong{background:#f44336;color:#fff}

.cardWrap{perspective:1000px}
.card{
  border:1px solid #ddd;border-radius:16px;
  padding:40px;text-align:center;font-size:24px;
  cursor:pointer;min-height:120px;
  transform-style:preserve-3d;
  transition:transform .6s;
}
.card.flipped{transform:rotateY(180deg)}

.cardFace{
  position:absolute;width:100%;backface-visibility:hidden;
}
.cardBack{transform:rotateY(180deg)}

.controls{display:flex;gap:10px;margin-top:16px}

.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border-bottom:1px solid #ddd;padding:6px;text-align:left}
.center{text-align:center}

.context{font-size:13px;color:#666;margin-top:8px;font-style:italic}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <div></div>
  <div class="langToggle" onclick="toggleCardLang()" id="langBtn">EN</div>
  <div class="palette" onclick="toggleTheme()"></div>
  <div class="title">Words Easy</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="openTab('test',this)">Тест</button>
  <button class="tab" onclick="openTab('cards',this)">Карточки</button>
  <button class="tab" onclick="openTab('repeat',this)">Повтор</button>
  <button class="tab" onclick="openTab('input',this)">Ввод</button>
  <button class="tab" onclick="openTab('dict',this)">Словарь</button>
</div>

<!-- ТЕСТ -->
<div id="test" class="center">
  <h2 id="word"></h2>
  <div id="answers"></div>
</div>

<!-- КАРТОЧКИ -->
<div id="cards" class="hidden center">
  <div class="cardWrap">
    <div id="card" class="card" onclick="flipCard()">
      <div id="front" class="cardFace"></div>
      <div id="back" class="cardFace cardBack"></div>
    </div>
  </div>
  <div id="context" class="context"></div>
  <div class="controls">
    <button class="correct" onclick="cardYes()">Да</button>
    <button class="wrong" onclick="cardNo()">Нет</button>
  </div>
</div>

<!-- ПОВТОР -->
<div id="repeat" class="hidden center">
  <h3 id="repeatWord"></h3>
  <button class="correct" onclick="repeatYes()">Знаю</button>
  <button class="wrong" onclick="repeatNo()">Не знаю</button>
</div>

<!-- ВВОД -->
<div id="input" class="hidden">
  <h3 id="inputRu"></h3>
  <input id="inputEn" placeholder="Введи английское слово"
    onkeydown="if(event.key==='Enter')checkInput()"
    style="width:100%;padding:10px;border-radius:10px;border:1px solid #ccc">
  <button onclick="checkInput()">Проверить</button>
</div>

<!-- СЛОВАРЬ -->
<div id="dict" class="hidden"></div>

</div>

<script>
/* ===== ДАННЫЕ ===== */
const raw=[
'here|здесь|хиэ|Here I am.',
'there|там|зэа|He is there.'
];

let words = raw.map(s=>{
  const[a,b,c,d]=s.split('|');
  return {en:a,ru:b,read:c,example:d||'',ok:0,errors:0,learned:false};
});

function saveProgress(){localStorage.setItem('wordsEasy',JSON.stringify(words))}
function loadProgress(){
  const s=localStorage.getItem('wordsEasy');
  if(s) words=JSON.parse(s);
}
loadProgress();

let pool=words.filter(w=>!w.learned),errors=[],current,side=0,cardLang='en';

/* ===== УМНЫЙ ВЫБОР ===== */
function getNextWord(){
  const hard=words.filter(w=>w.errors>0&&!w.learned);
  return hard.length?hard[Math.floor(Math.random()*hard.length)]
                    :pool[Math.floor(Math.random()*pool.length)];
}

/* ===== КАРТОЧКИ ===== */
const card=document.getElementById('card'),
front=document.getElementById('front'),
back=document.getElementById('back'),
ctx=document.getElementById('context');

function renderCard(){
  current=getNextWord();
  side=0;
  card.classList.remove('flipped');
  front.textContent=cardLang==='en'?current.en:current.ru;
  back.textContent=cardLang==='en'?current.ru:current.en;
  ctx.textContent=current.example;
}

function flipCard(){card.classList.toggle('flipped')}

function cardYes(){
  current.ok++;
  if(current.ok>=3) current.learned=true;
  saveProgress();
  renderCard();
}

function cardNo(){
  current.errors++;
  saveProgress();
  renderCard();
}

/* ===== СЛОВАРЬ ===== */
function renderDict(){
  let html='<table class="table"><tr><th>#</th><th>EN</th><th>RU</th><th>✔</th></tr>';
  words.sort((a,b)=>a.en.localeCompare(b.en))
    .forEach((w,i)=>{
      html+=`<tr><td>${i+1}</td><td>${w.en}</td><td>${w.ru}</td><td>${w.ok}</td></tr>`;
    });
  html+='</table>';
  document.getElementById('dict').innerHTML=html;
}

/* ===== ПРОЧЕЕ ===== */
function toggleCardLang(){
  cardLang=cardLang==='en'?'ru':'en';
  document.getElementById('langBtn').textContent=cardLang.toUpperCase();
  renderCard();
}

function openTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['test','cards','repeat','input','dict']
    .forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='dict')renderDict();
  if(id==='cards')renderCard();
}

let pink=true;
function toggleTheme(){
  pink=!pink;
  document.documentElement.style.setProperty('--bg',pink?'#ffd6e7':'#cce8ff');
}

renderCard();
</script>
</body>
</html>
