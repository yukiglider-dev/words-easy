<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
body{
  margin:0;
  padding:20px;
  font-family:Arial;
  background:#eee;
}
.app{
  max-width:520px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:16px;
}
button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.correct{background:#4caf50;color:#fff}
.wrong{background:#f44336;color:#fff}
.hidden{display:none}
.center{text-align:center}
.reading{font-style:italic;color:#666}
.example{margin:8px 0;font-size:15px}
</style>
</head>

<body>
<div class="app">

<h2 class="center">Words Easy</h2>

<button onclick="openTab('test')">Тест</button>
<button onclick="openTab('cards')">Карточки</button>

<hr>

<!-- TEST -->
<div id="test" class="center">
  <h2 id="word"></h2>
  <div id="reading" class="reading"></div>
  <div id="example" class="example"></div>
  <div id="answers"></div>
</div>

<!-- CARDS -->
<div id="cards" class="center hidden">
  <div id="card" style="font-size:26px;margin:20px"></div>
  <button onclick="flipCard()">Перевернуть</button>
  <button onclick="nextCard()">Следующее</button>
</div>

</div>

<script>
/* ================= ДАННЫЕ ================= */
const raw = [
"work|работать|вёрк|I work every day.",
"study|учиться|стади|I study English.",
"eat|есть|ит|I eat breakfast.",
"drink|пить|дринк|I drink water.",
"sleep|спать|слиип|I want to sleep.",
"read|читать|рид|I read books.",
"write|писать|райт|I write messages.",
"play|играть|плэй|I play football.",
"buy|покупать|бай|I buy food.",
"think|думать|синк|I think about it."
];

/* ============ ПРОГРЕСС ============ */
let saved = JSON.parse(localStorage.getItem('words') || 'null');

let words = raw.map((s,i)=>{
  const [en,ru,read,ex] = s.split('|');
  return saved?.[i] || {en,ru,read,ex,streak:0};
});

function save(){
  localStorage.setItem('words',JSON.stringify(words));
}

/* ============ ЛОГИКА ============ */
let currentIndex = 0;
let flipped = false;

function available(){
  return words.filter(w=>w.streak<3);
}

function pickWord(){
  const pool = available();
  if(!pool.length){
    alert('🎉 Все слова выучены');
    return null;
  }
  const w = pool[Math.floor(Math.random()*pool.length)];
  return words.indexOf(w);
}

/* ============ TEST ============ */
function renderTest(){
  const i = pickWord();
  if(i===null) return;
  currentIndex = i;
  const w = words[i];

  document.getElementById('word').textContent = w.en;
  document.getElementById('reading').textContent = w.read;
  document.getElementById('example').textContent = w.ex;

  const answers = document.getElementById('answers');
  answers.innerHTML='';

  let opts=[w.ru];
  while(opts.length<4){
    let r = words[Math.floor(Math.random()*words.length)].ru;
    if(!opts.includes(r)) opts.push(r);
  }
  opts.sort(()=>Math.random()-0.5);

  opts.forEach(t=>{
    const b=document.createElement('button');
    b.textContent=t;
    b.onclick=()=>{
      if(t===w.ru){
        b.className='correct';
        w.streak++;
      }else{
        b.className='wrong';
        w.streak=0;
      }
      save();
      setTimeout(renderTest,600);
    };
    answers.appendChild(b);
  });
}

/* ============ CARDS ============ */
function renderCard(){
  const w = words[currentIndex];
  document.getElementById('card').textContent =
    flipped ? `${w.ru}\n${w.ex}` : w.en;
}

function flipCard(){
  flipped=!flipped;
  renderCard();
}

function nextCard(){
  const i = pickWord();
  if(i===null) return;
  currentIndex=i;
  flipped=false;
  renderCard();
}

/* ============ UI ============ */
function openTab(tab){
  document.getElementById('test').classList.toggle('hidden',tab!=='test');
  document.getElementById('cards').classList.toggle('hidden',tab!=='cards');

  if(tab==='test') renderTest();
  else{
    currentIndex=pickWord();
    renderCard();
  }
}

/* старт */
renderTest();
</script>
</body>
</html>
