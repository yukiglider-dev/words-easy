<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Words Easy</title>

<style>
:root{
  --bg:#f9fbfd;--surface:#fff;--text:#1f3042;--muted:#6b7a88;
  --primary:#58a6ff;--border:#dde6ef;--shadow:0 8px 24px rgba(0,0,0,.08)
}
[data-theme="dark"]{
  --bg:#0f1722;--surface:#152233;--text:#eaf1f9;--muted:#a9b6c3;
  --border:#233244;--shadow:0 8px 24px rgba(0,0,0,.35)
}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
.app{max-width:1100px;margin:auto;padding:16px}

/* HEADER */
.header{position:relative;text-align:center;margin-bottom:10px}
.brand-title{font-size:26px;font-weight:800}

/* mini top right */
.top-right{
  position:absolute;right:0;top:0;
  display:flex;gap:10px;align-items:center
}
.counter{font-size:12px;color:var(--muted)}
.theme-toggle{
  cursor:pointer;border:1px solid var(--border);
  background:var(--surface);border-radius:20px;
  padding:4px 8px;font-size:12px
}

/* tabs */
.tabs{display:flex;justify-content:center;gap:8px;margin:12px 0}
.tab-btn{
  width:120px;padding:8px 0;
  border:1px solid var(--border);
  background:var(--surface);border-radius:10px;
  font-weight:600;cursor:pointer
}
.tab-btn.active{background:var(--primary);color:#fff;border:none}

/* panel */
.panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:16px;box-shadow:var(--shadow)
}

/* card */
.card{
  text-align:center;padding:24px;border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow)
}
.en-word{
  font-size:24px;font-weight:700;
  cursor:pointer
}
.tr{
  margin-top:6px;
  font-size:14px;
  color:var(--muted);
  display:none
}
.tr.show{display:block}

/* options */
.options{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.option{
  padding:10px;border:1px solid var(--border);
  border-radius:12px;cursor:pointer;
  box-shadow:var(--shadow)
}
.option.correct{background:#e9ffe6}
.option.wrong{background:#ffe9e9}

.empty{text-align:center;color:var(--muted);padding:20px}
</style>
</head>

<body>
<div class="app">
  <div class="header">
    <div class="brand-title">Words Easy</div>

    <div class="top-right">
      <div class="counter" id="miniCounter">— / —</div>
      <div class="theme-toggle" id="themeToggle">☀️</div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>

<script>
const words=[
 {en:'here',ru:'здесь',tr:'хиа',streak:0},
 {en:'there',ru:'там',tr:'зэа',streak:0},
 {en:'understand',ru:'понимать',tr:'андэстэнд',streak:0},
 {en:'eat',ru:'есть',tr:'ит',streak:0}
]

let activeTab='test'
let current=null

const tabs=[
 {id:'test',label:'Тест'},
 {id:'cards',label:'Карточки'},
 {id:'repeat',label:'Повтор'},
 {id:'input',label:'Ввод'},
 {id:'dict',label:'Словарь'},
 {id:'match',label:'Сопоставление'}
]

const panel=document.getElementById('panel')
const tabsEl=document.getElementById('tabs')

function updateCounter(){
 const total=words.length
 const rest=words.filter(w=>w.streak<3).length
 document.getElementById('miniCounter').textContent=`${rest} / ${total}`
}

function renderTabs(){
 tabsEl.innerHTML=tabs.map(t=>
  `<button class="tab-btn ${t.id===activeTab?'active':''}" data-id="${t.id}">${t.label}</button>`
 ).join('')
 tabsEl.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{activeTab=b.dataset.id;render()}
 })
}

function renderTest(){
 const pool=words.filter(w=>w.streak<3)
 if(!pool.length){panel.innerHTML='<div class="empty">Все слова выучены 🎉</div>';return}
 current=pool[Math.floor(Math.random()*pool.length)]
 const opts=[current.ru,...words.filter(w=>w!==current).map(w=>w.ru)].slice(0,4).sort(()=>Math.random()-0.5)

 panel.innerHTML=`
  <div class="card">
    <div class="en-word" id="enWord">${current.en}</div>
    <div class="tr" id="tr">/${current.tr}/</div>
  </div>
  <div class="options">
    ${opts.map(o=>`<div class="option">${o}</div>`).join('')}
  </div>
 `
 document.getElementById('enWord').onclick=()=>{
  document.getElementById('tr').classList.toggle('show')
 }
 panel.querySelectorAll('.option').forEach(o=>{
  o.onclick=()=>{
   if(o.textContent===current.ru){
    o.classList.add('correct');current.streak++
   }else{
    o.classList.add('wrong');current.streak=0
   }
   updateCounter()
   setTimeout(renderTest,600)
  }
 })
}

function render(){
 renderTabs()
 updateCounter()
 if(activeTab==='test')renderTest()
 else panel.innerHTML='<div class="empty">В разработке</div>'
}

document.getElementById('themeToggle').onclick=()=>{
 const html=document.documentElement
 const dark=html.getAttribute('data-theme')==='dark'
 html.setAttribute('data-theme',dark?'light':'dark')
 document.getElementById('themeToggle').textContent=dark?'☀️':'🌙'
}

render()
</script>
</body>
</html>
