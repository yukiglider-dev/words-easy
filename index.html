<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
:root{--bg:#ffd6e7;--card:#fff;--btn:#eee}
body{margin:0;font-family:Arial;background:var(--bg);display:flex;justify-content:center;padding:20px}
.app{width:540px;background:var(--card);border-radius:18px;padding:16px}
.header{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px}
.title{text-align:center;font-weight:bold;font-size:18px;grid-column:1/4}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--btn);border:none;cursor:pointer}
.tab.active{background:#cce8ff;font-weight:bold}
.hidden{display:none}
button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:12px;cursor:pointer;background:var(--btn)}
.correct{background:#8bc34a;color:#fff}
.wrong{background:#f44336;color:#fff}
.center{text-align:center}
.reading{font-style:italic;color:#666;margin:6px 0}
</style>
</head>

<body>
<div class="app">

<div class="tabs">
  <button class="tab active">Тест</button>
</div>

<div id="test" class="center">
  <h2 id="word"></h2>
  <div id="reading" class="reading hidden"></div>
  <button id="readBtn" onclick="toggleReading()">Показать чтение</button>
  <div id="answers"></div>
</div>

</div>

<script>
const raw = [
"analyse|анализировать|энэлайз",
"apologise|извиняться|эполоджайз",
"arrive|прибывать|эрайв",
"ask|спрашивать|аск"
];

const words = raw.map(s=>{
  const[a,b,c]=s.split('|');
  return {en:a,ru:b,read:c,streak:0,errors:0};
});

let pool=[...words], errors=[], current;

const w=document.getElementById('word');
const a=document.getElementById('answers');
const r=document.getElementById('reading');
const rb=document.getElementById('readBtn');

function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}

function pick(){
  if(!pool.length){
    w.textContent='🎉 Все слова выучены!';
    a.innerHTML='';
    r.classList.add('hidden');
    rb.classList.add('hidden');
    return;
  }
  current=rnd(pool);
  r.textContent=current.read;
  r.classList.add('hidden');
  rb.textContent='Показать чтение';
  renderTest();
}

function renderTest(){
  w.textContent=current.en;
  a.innerHTML='';

  let opts=[current.ru];
  while(opts.length<4){
    let x=rnd(words).ru;
    if(!opts.includes(x)) opts.push(x);
  }

  opts.sort(()=>Math.random()-0.5).forEach(text=>{
    const btn=document.createElement('button');
    btn.textContent=text;

    btn.onclick=()=>{
      [...a.children].forEach(b=>b.disabled=true);

      if(text===current.ru){
        btn.classList.add('correct');
        current.streak++;

        if(current.streak>=3){
          pool = pool.filter(w=>w!==current);
        }
      }else{
        btn.classList.add('wrong');
        current.streak=0;
        current.errors++;
        errors.push(current);
      }

      setTimeout(pick,700);
    };

    a.appendChild(btn);
  });
}

function toggleReading(){
  r.classList.toggle('hidden');
  rb.textContent=r.classList.contains('hidden')
    ?'Показать чтение'
    :'Скрыть чтение';
}

pick();
</script>
</body>
</html>
