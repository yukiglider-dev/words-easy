<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>
<style>
:root{--bg:#ffd6e7;--card:#fff;--btn:#eee;--green:#b6e7b6}
body{margin:0;font-family:Arial;background:var(--bg);display:flex;justify-content:center;padding:20px}
.app{width:520px;background:var(--card);border-radius:18px;padding:16px}
.header{display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.title{text-align:center;font-weight:bold;font-size:18px}
.palette{width:26px;height:26px;border-radius:50%;border:2px solid #aaa;cursor:pointer;background:linear-gradient(45deg,#ffd6e7,#cce8ff)}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--btn);border:none;cursor:pointer;font-size:13px}
.tab.active{background:#cce8ff;font-weight:bold}
.hidden{display:none}
button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:12px;cursor:pointer;background:var(--btn)}
.correct{background:#8bc34a;color:#fff}
.wrong{background:#f44336;color:#fff}
.card{border:1px solid #ddd;border-radius:16px;padding:40px;text-align:center;font-size:24px;cursor:pointer;min-height:80px}
.controls{display:flex;gap:10px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border-bottom:1px solid #ddd;padding:6px;text-align:left}
.learned{background:var(--green)}
.switch{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div></div>
    <div class="title">Words Easy</div>
    <div class="palette" onclick="toggleTheme()"></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="openTab('test',this)">Тест</button>
    <button class="tab" onclick="openTab('cards',this)">Карточки</button>
    <button class="tab" onclick="openTab('input',this)">Ввод</button>
    <button class="tab" onclick="openTab('dict',this)">Словарь</button>
  </div>

  <!-- ТЕСТ -->
  <div id="test">
    <h2 id="word"></h2>
    <div id="answers"></div>
  </div>

  <!-- КАРТОЧКИ -->
  <div id="cards" class="hidden">
    <div class="switch">
      <button onclick="setCardLang('en')">EN</button>
      <button onclick="setCardLang('ru')">RU</button>
    </div>
    <div id="card" class="card" onclick="flipCard()"></div>
    <div id="cardBtns" class="controls hidden">
      <button class="correct" onclick="cardYes()">Да</button>
      <button class="wrong" onclick="cardNo()">Нет</button>
    </div>
  </div>

  <!-- ВВОД -->
  <div id="input" class="hidden">
    <h3 id="inputRu"></h3>
    <input id="inputEn" placeholder="Введи английское слово" onkeydown="if(event.key==='Enter')checkInput()" style="width:100%;padding:10px;border-radius:10px;border:1px solid #ccc">
    <button onclick="checkInput()">Проверить</button>
  </div>

  <!-- СЛОВАРЬ -->
  <div id="dict" class="hidden"></div>
</div>

<script>
const raw=[
'here|здесь|хиэ','there|там|зэа','at school|в школе|эт скул','understand|понимать|андэстэнд','know|знать|ноу','eat|есть|ит','drink|пить|дринк','sleep|спать|слиип','ask|спрашивать|аск','read|читать|рид','write|писать|райт','describe|описывать|дискрáйб','analyse|анализировать|энэлайз','think|думать|синк','wait|ждать|вэйт','buy|покупать|бай','play|играть|плэй','want|хотеть|вонт','explain|объяснять|иксплэйн','study|учиться|стади','work|работать|вёрк','take|брать|тэйк','arrive|прибывать|эрайв','interrupt|перебивать|интэрапт','I need|мне нужно|ай нид','you need|тебе нужно|ю нид','we need|нам нужно|уи нид','they need|им нужно|зэй нид','he needs|ему нужно|хи нидз','she needs|ей нужно|ши нидз','I like|мне нравится|ай лайк','you like|тебе нравится|ю лайк','we like|нам нравится|уи лайк','they like|им нравится|зэй лайк','he likes|ему нравится|хи лайкс','she likes|ей нравится|ши лайкс'
];

const words=raw.map(s=>{const[a,b,c]=s.split('|');return{en:a,ru:b,read:c,ok:0,learned:false}});
let pool=[...words],errors=[],current,side='front',cardLang='en';

const w=document.getElementById('word'),a=document.getElementById('answers'),c=document.getElementById('card'),cb=document.getElementById('cardBtns'),ir=document.getElementById('inputRu'),ie=document.getElementById('inputEn'),d=document.getElementById('dict');

function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}
function pick(){current=rnd(errors.length?errors:pool);renderTest();renderCard();renderInput()}

function renderTest(){
  w.textContent=current.en;
  a.innerHTML='';
  let opts=[current.ru];
  while(opts.length<4){let x=rnd(words).ru;if(!opts.includes(x))opts.push(x)}
  opts.sort(()=>Math.random()-0.5).forEach(t=>{
    let b=document.createElement('button');b.textContent=t;
    b.onclick=()=>{
      if(t===current.ru){b.className='correct';current.ok++;if(current.ok>=3){current.learned=true;pool=pool.filter(x=>x!==current)} }
      else{b.className='wrong';errors.push(current)}
      setTimeout(pick,700)
    };
    a.appendChild(b)
  })
}

function renderCard(){side='front';cb.classList.add('hidden');c.textContent=cardLang==='en'?current.en:current.ru}
function flipCard(){
  if(side==='front'){c.textContent=cardLang==='en'?current.ru:current.en;side='back';cb.classList.remove('hidden')}
}
function cardYes(){current.learned=true;pool=pool.filter(x=>x!==current);cb.classList.add('hidden');pick()}
function cardNo(){errors.push(current);cb.classList.add('hidden');pick()}
function setCardLang(l){cardLang=l;renderCard()}

function renderInput(){ir.textContent=current.ru;ie.value=''}
function checkInput(){
  if(ie.value.toLowerCase()===current.en.toLowerCase()){current.ok++;if(current.ok>=3){current.learned=true;pool=pool.filter(x=>x!==current)}}
  else errors.push(current);
  pick()
}

function renderDict(){
  d.innerHTML='<table class="table"><tr><th>English</th><th>Русский</th><th>✔</th></tr></table>';
  const t=d.querySelector('table');
  words.forEach(w=>{
    let tr=document.createElement('tr');if(w.learned)tr.classList.add('learned');
    tr.innerHTML=`<td>${w.en}</td><td>${w.ru}</td><td>${w.ok}</td>`;t.appendChild(tr)
  })
}

function openTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');
  ['test','cards','input','dict'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='dict')renderDict()
}

let pink=true;function toggleTheme(){pink=!pink;document.documentElement.style.setProperty('--bg',pink?'#ffd6e7':'#cce8ff')}

pick();
</script>
</body>
</html>
