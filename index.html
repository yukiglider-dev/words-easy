<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
:root{--bg:#ffd6e7;--card:#fff;--btn:#eee}
body{margin:0;font-family:Arial;background:var(--bg);display:flex;justify-content:center;padding:20px}
.app{width:540px;background:var(--card);border-radius:18px;padding:16px}

.header{display:grid;grid-template-columns:1fr auto auto;align-items:center}
.title{text-align:center;font-weight:bold;font-size:18px;grid-column:1/4}
.palette{width:22px;height:22px;border-radius:50%;border:2px solid #aaa;cursor:pointer}
.langToggle{font-size:11px;padding:4px 6px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}

.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--btn);border:none;cursor:pointer}
.tab.active{background:#cce8ff;font-weight:bold}

.hidden{display:none}
button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:12px;cursor:pointer}
.correct{background:#8bc34a;color:#fff}
.wrong{background:#f44336;color:#fff}

.cardWrap{perspective:1000px}
.card{
  position:relative;
  border:1px solid #ddd;
  border-radius:16px;
  padding:40px;
  min-height:120px;
  font-size:24px;
  text-align:center;
  cursor:pointer;
  transform-style:preserve-3d;
  transition:transform .6s ease;
}
.card.flipped{transform:rotateY(180deg)}

.face{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  backface-visibility:hidden;
}
.back{transform:rotateY(180deg)}

.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid #ddd;padding:6px}
.read{font-size:13px;color:#666}
.center{text-align:center}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <div></div>
  <div class="langToggle" onclick="toggleLang()" id="langBtn">EN</div>
  <div class="palette" onclick="toggleTheme()"></div>
  <div class="title">Words Easy</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="openTab('test',this)">Тест</button>
  <button class="tab" onclick="openTab('cards',this)">Карточки</button>
  <button class="tab" onclick="openTab('input',this)">Ввод</button>
  <button class="tab" onclick="openTab('dict',this)">Словарь</button>
</div>

<div id="test" class="center">
  <h2 id="testWord"></h2>
  <div id="answers"></div>
</div>

<div id="cards" class="hidden center">
  <div class="cardWrap">
    <div class="card" id="card" onclick="flipCard()">
      <div class="face" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>
</div>

<div id="input" class="hidden center">
  <h3 id="inputRu"></h3>
  <input id="inputEn" placeholder="English word">
  <button onclick="checkInput()">Проверить</button>
</div>

<div id="dict" class="hidden"></div>

</div>

<script>
let words = [
  {en:'here',ru:'здесь',read:'хиэ',ok:0},
  {en:'there',ru:'там',read:'зэа',ok:0},
  {en:'eat',ru:'есть',read:'ит',ok:0}
];

let current=null;
let lang='en';
let flipped=false;

function rnd(){return words[Math.floor(Math.random()*words.length)]}

function pick(){
  current=rnd();
  renderTest();
  renderCard();
  renderInput();
}

function renderTest(){
  testWord.textContent=current.en;
  answers.innerHTML='';
  let opts=[current.ru];
  while(opts.length<4){
    let r=rnd().ru;
    if(!opts.includes(r))opts.push(r);
  }
  opts.sort(()=>Math.random()-0.5).forEach(o=>{
    let b=document.createElement('button');
    b.textContent=o;
    b.onclick=()=>{if(o===current.ru)current.ok++; pick();}
    answers.appendChild(b);
  });
}

function renderCard(){
  flipped=false;
  card.classList.remove('flipped');
  front.textContent=lang==='en'?current.en:current.ru;
  back.textContent=lang==='en'?current.ru:current.en;
}

function flipCard(){
  flipped=!flipped;
  card.classList.toggle('flipped');
}

function renderInput(){
  inputRu.textContent=current.ru;
  inputEn.value='';
}

function checkInput(){
  if(inputEn.value.trim().toLowerCase()===current.en) current.ok++;
  pick();
}

function renderDict(){
  let html='<table class="table"><tr><th>#</th><th>EN</th><th>RU</th><th>Чтение</th><th>✔</th></tr>';
  words.sort((a,b)=>a.en.localeCompare(b.en))
    .forEach((w,i)=>{
      html+=`<tr><td>${i+1}</td><td>${w.en}</td><td>${w.ru}</td><td class="read">${w.read}</td><td>${w.ok}</td></tr>`;
    });
  html+='</table>';
  dict.innerHTML=html;
}

function openTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['test','cards','input','dict'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='dict')renderDict();
}

function toggleLang(){
  lang=lang==='en'?'ru':'en';
  langBtn.textContent=lang.toUpperCase();
  renderCard();
}

function toggleTheme(){
  document.documentElement.style.setProperty('--bg',
    getComputedStyle(document.documentElement).getPropertyValue('--bg')==='#ffd6e7'
    ?'#cce8ff':'#ffd6e7');
}

pick();
</script>
</body>
</html>
