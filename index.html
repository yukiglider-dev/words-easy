<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #cceeff;
  padding: 20px;
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 15px;
}

select, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 14px;
  border: none;
  font-size: 16px;
}

button {
  background: white;
  cursor: pointer;
}

.answers button {
  display: block;
  margin-top: 8px;
}

.correct {
  background: #7CFC98;
}

.wrong {
  background: #FF7F7F;
}

.card {
  background: rgba(255,255,255,0.85);
  padding: 15px;
  border-radius: 16px;
  margin-top: 12px;
}

#reading {
  text-align: center;
  font-style: italic;
  margin-top: 10px;
}

.hidden {
  display: none;
}

.word-row {
  border-bottom: 1px solid #aaa;
  padding: 6px 0;
}
</style>
</head>

<body>

<h1>📘 Words Easy</h1>

<select id="mode">
  <option value="en-ru">ENG → RU</option>
  <option value="ru-en">RU → ENG</option>
</select>

<div class="card">
  <h3 id="question"></h3>
  <div class="answers" id="answers"></div>
  <button onclick="showReading()">👂 Показать чтение</button>
  <p id="reading"></p>
</div>

<button onclick="toggleDictionary()">📖 Словарь</button>

<div id="dictionary" class="card hidden"></div>

<script>
const words = {
  "I": { ru:"я", read:"ай" },
  "you": { ru:"ты / вы", read:"ю" },
  "we": { ru:"мы", read:"ви" },
  "they": { ru:"они", read:"зэй" },
  "he": { ru:"он", read:"хи" },
  "she": { ru:"она", read:"ши" },
  "it": { ru:"это", read:"ит" },

  "understand": { ru:"понимать", read:"андэстэнд" },
  "know": { ru:"знать", read:"ноу" },
  "eat": { ru:"есть", read:"ит" },
  "drink": { ru:"пить", read:"дринк" },
  "sleep": { ru:"спать", read:"слип" },

  "busy": { ru:"занятый", read:"бизи" },
  "rich": { ru:"богатый", read:"рич" },
  "poor": { ru:"бедный", read:"пуа" },

  "I need": { ru:"мне нужно", read:"ай нид" },
  "we like": { ru:"нам нравится", read:"ви лайк" },
  "you're right": { ru:"ты прав", read:"йо райт" }
};

let stats = {};
let errors = [];

Object.keys(words).forEach(w => {
  stats[w] = { ok:0, bad:0 };
});

let currentWord = "";
let correctAnswer = "";
let locked = false;

function nextQuestion() {
  locked = false;
  reading.innerText = "";

  const list = errors.length ? errors : Object.keys(words);
  currentWord = list[Math.floor(Math.random() * list.length)];
  const mode = modeSelect.value;

  let answersPool;

  if (mode === "en-ru") {
    question.innerText = "Переведи: " + currentWord;
    correctAnswer = words[currentWord].ru;
    answersPool = Object.values(words).map(w => w.ru);
  } else {
    question.innerText = "Переведи: " + words[currentWord].ru;
    correctAnswer = currentWord;
    answersPool = Object.keys(words);
  }

  let variants = answersPool
    .filter(a => a !== correctAnswer)
    .sort(() => Math.random() - 0.5)
    .slice(0, 3);

  variants.push(correctAnswer);
  variants.sort(() => Math.random() - 0.5);

  answersDiv.innerHTML = "";
  variants.forEach(v => {
    const btn = document.createElement("button");
    btn.innerText = v;
    btn.onclick = () => checkAnswer(btn, v);
    answersDiv.appendChild(btn);
  });
}

function checkAnswer(btn, ans) {
  if (locked) return;
  locked = true;

  if (ans === correctAnswer) {
    btn.classList.add("correct");
    stats[currentWord].ok++;
    errors = errors.filter(w => w !== currentWord);
  } else {
    btn.classList.add("wrong");
    stats[currentWord].bad++;
    if (!errors.includes(currentWord)) errors.push(currentWord);

    [...answersDiv.children].forEach(b => {
      if (b.innerText === correctAnswer) {
        b.classList.add("correct");
      }
    });
  }

  setTimeout(nextQuestion, 1200);
}

function showReading() {
  reading.innerText = "Чтение: " + words[currentWord].read;
}

function toggleDictionary() {
  dictionary.classList.toggle("hidden");
  dictionary.innerHTML = Object.keys(words).map(w =>
    `<div class="word-row">
      <b>${w}</b> — ${words[w].ru} (${words[w].read})  
      ✅ ${stats[w].ok} ❌ ${stats[w].bad}
    </div>`
  ).join("");
}

const question = document.getElementById("question");
const answersDiv = document.getElementById("answers");
const reading = document.getElementById("reading");
const dictionary = document.getElementById("dictionary");
const modeSelect = document.getElementById("mode");

nextQuestion();
</script>

</body>
</html>
