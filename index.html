<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Words Easy</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f5faff;
}

header {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #fff;
}

button {
  border: none;
  background: #8fc7ff;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}

button.active {
  background: #4da3ff;
}

main {
  padding: 16px;
}

section {
  display: none;
}

section.active {
  display: block;
}

/* карточка */
.card {
  width: 260px;
  height: 160px;
  margin: 40px auto;
  perspective: 1000px;
}

.card-inner {
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 10px 20px rgba(0,0,0,.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  backface-visibility: hidden;
}

.card-back {
  transform: rotateY(180deg);
}

.center {
  text-align: center;
}

/* таблица */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 6px;
  border-bottom: 1px solid #ddd;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <button onclick="showTab('test')" class="active">Тест</button>
  <button onclick="showTab('cards')">Карточки</button>
  <button onclick="showTab('repeat')">Повтор</button>
  <button onclick="showTab('input')">Ввод</button>
  <button onclick="showTab('dict')">Словарь</button>
</header>

<main>
  <section id="test" class="active"></section>
  <section id="cards"></section>
  <section id="repeat"></section>
  <section id="input"></section>
  <section id="dict"></section>
</main>

<script>
/* ================= СЛОВА ================= */
const baseWords = [
  {en:"here", ru:"здесь", tr:"хиэ"},
  {en:"there", ru:"там", tr:"зэа"},
  {en:"at school", ru:"в школе", tr:"эт скул"},

  {en:"understand", ru:"понимать", tr:"андерстэнд"},
  {en:"know", ru:"знать", tr:"ноу"},
  {en:"eat", ru:"есть", tr:"ит"},
  {en:"drink", ru:"пить", tr:"дринк"},
  {en:"sleep", ru:"спать", tr:"слип"},
  {en:"ask", ru:"спрашивать", tr:"аск"},
  {en:"read", ru:"читать", tr:"рид"},
  {en:"write", ru:"писать", tr:"райт"},
  {en:"describe", ru:"описывать", tr:"дискрайб"},
  {en:"analyse", ru:"анализировать", tr:"энэлайз"},
  {en:"think", ru:"думать", tr:"синк"},
  {en:"wait", ru:"ждать", tr:"уэйт"},
  {en:"buy", ru:"покупать", tr:"бай"},
  {en:"play", ru:"играть", tr:"плэй"},
  {en:"want", ru:"хотеть", tr:"уонт"},
  {en:"explain", ru:"объяснять", tr:"иксплэйн"},
  {en:"study", ru:"учиться", tr:"стади"},
  {en:"work", ru:"работать", tr:"уорк"},
  {en:"take", ru:"брать", tr:"тэйк"},
  {en:"arrive", ru:"прибывать", tr:"эрайв"},
  {en:"interrupt", ru:"перебивать", tr:"интерапт"},

  {en:"busy", ru:"занятый", tr:"бизи"},
  {en:"cosy", ru:"уютный", tr:"коузи"},
  {en:"enough", ru:"достаточно", tr:"инаф"},
  {en:"rich", ru:"богатый", tr:"рич"},
  {en:"poor", ru:"бедный", tr:"пуа"},
  {en:"possible", ru:"возможно", tr:"посэбл"},
  {en:"impossible", ru:"невозможно", tr:"импосэбл"},

  {en:"expensive", ru:"дорого", tr:"икспэнсив"},
  {en:"cheap", ru:"дёшево", tr:"чип"},
  {en:"strong", ru:"сильный", tr:"стронг"},
  {en:"weak", ru:"слабый", tr:"уик"},
  {en:"creative", ru:"творческий", tr:"криэйтив"},
  {en:"hardworking", ru:"трудолюбивый", tr:"хардворкинг"},
  {en:"patient", ru:"терпеливый", tr:"пэйшент"},
  {en:"punctual", ru:"пунктуальный", tr:"панктуал"}
];

let words = JSON.parse(localStorage.getItem("words")) ||
  baseWords.map(w => ({...w, correct:0, wrong:0}));

function save() {
  localStorage.setItem("words", JSON.stringify(words));
}

function showTab(id) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll("header button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  render();
}

function priority() {
  return [...words].sort((a,b)=> (b.wrong-a.wrong)||(a.correct-b.correct));
}

/* ================= ТЕСТ ================= */
function renderTest() {
  const w = priority()[0];
  const opts = [w.ru];
  while (opts.length < 4) {
    const r = words[Math.floor(Math.random()*words.length)].ru;
    if (!opts.includes(r)) opts.push(r);
  }
  opts.sort(()=>Math.random()-0.5);

  test.innerHTML = `
    <div class="center">
      <h2>${w.en}</h2>
      ${opts.map(o=>`<button onclick="answer('${o}','${w.en}')">${o}</button>`).join("<br>")}
    </div>`;
}

function answer(a,en) {
  const w = words.find(x=>x.en===en);
  a===w.ru ? w.correct++ : w.wrong++;
  save(); render();
}

/* ================= КАРТОЧКИ ================= */
let flipped=false;
function renderCards() {
  const w = priority()[0];
  cards.innerHTML = `
    <div class="card ${flipped?'flipped':''}" onclick="flip()">
      <div class="card-inner">
        <div class="card-face">${w.en}</div>
        <div class="card-face card-back">${w.ru}</div>
      </div>
    </div>
    ${flipped ? `
    <div class="center">
      <button onclick="know(true)">Знаю</button>
      <button onclick="know(false)">Не знаю</button>
    </div>` : ""}`;
}

function flip(){flipped=!flipped;render();}
function know(ok){
  const w=priority()[0];
  ok?w.correct++:w.wrong++;
  flipped=false;save();render();
}

/* ================= ПОВТОР ================= */
function renderRepeat() {
  const w = priority().find(w=>w.wrong>0);
  repeat.innerHTML = w ? `
    <div class="center">
      <h2>${w.en}</h2>
      <button onclick="rep(true)">Знаю</button>
      <button onclick="rep(false)">Не знаю</button>
    </div>` :
    "<p class='center'>Сложных слов нет 🎉</p>";
}
function rep(ok){
  const w=priority().find(w=>w.wrong>0);
  ok?w.correct++:w.wrong++;
  save();render();
}

/* ================= ВВОД ================= */
function renderInput() {
  const w=priority()[0];
  input.innerHTML=`
    <div class="center">
      <h3>${w.ru}</h3>
      <input id="i">
      <button onclick="chk('${w.en}')">OK</button>
    </div>`;
}
function chk(en){
  const w=words.find(x=>x.en===en);
  i.value.trim().toLowerCase()===en?w.correct++:w.wrong++;
  save();render();
}

/* ================= СЛОВАРЬ ================= */
function renderDict() {
  dict.innerHTML=`
  <table>
    <tr><th>#</th><th>English</th><th>Русский</th><th>Транскрипция</th></tr>
    ${[...words].sort((a,b)=>a.en.localeCompare(b.en))
      .map((w,i)=>`
      <tr>
        <td>${i+1}</td>
        <td>${w.en}</td>
        <td>${w.ru}</td>
        <td>${w.tr}</td>
      </tr>`).join("")}
  </table>`;
}

function render(){
  renderTest();
  renderCards();
  renderRepeat();
  renderInput();
  renderDict();
}

render();
</script>
</body>
</html>
