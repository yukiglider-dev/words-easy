function bindDictActions() {

  document.querySelectorAll('.dictManual').forEach(ch => {
    ch.onchange = () => {

      const id = Number(ch.dataset.id);
      const w = words.find(x => x.id === id);
      if (!w) return;

      if (ch.checked) {
        w.manual = true;
        w.streak = 3;
        w.needRepeat = false;
      } else {
        w.manual = false;
        w.streak = 0;
      }

      saveState();
      renderDict();
    };
  });

  document.querySelectorAll('.btn-del').forEach(btn => {
    btn.onclick = () => {

      const id = Number(btn.dataset.id);
      const w = words.find(x => x.id === id);

      if (!w) return;

      if (!confirm(`Удалить слово "${w.en}"?`)) return;

      words = words.filter(x => x.id !== id);

      saveState();
      renderDict();
    };
  });

}


function recalcIrregulars() {
  let changed = false;

  irregulars.forEach(v => {
    const shouldLearn = v.streak >= 3 || v.manual;
    if (shouldLearn !== v.learned) {
      v.learned = shouldLearn;
      changed = true;
    }
  });

  if (changed) {
    saveIrregulars();
  }

  updateProgress();
}

      w.ru.toLowerCase().includes(q) ||

    );

  }

</td>

    : `<tr><td colspan="7" class="center muted">Ничего не найдено</td></tr>`;
}


    // ---------- Tab: Match ----------
    let matchSet = [];
    let matchPicked = null;

    function makeMatchSet(size = 4) {
      const pool = getUnlearned();
      const base = (pool.length ? pool : words);
      const chosen = pickRandom(base, Math.min(size, base.length));
      matchSet = chosen.map(w => ({ id: w.id, en: w.en, ru: w.ru }));
    }

    function renderMatch() {
      if (!matchSet.length) makeMatchSet(4);
      if (!matchSet.length) { panelEl.innerHTML = `<div class="empty">Слова недоступны для сопоставления.</div>`; return; }

      const ens = shuffle(matchSet.map(m => ({ type: 'en', id: m.id, text: m.en })));
      const rus = shuffle(matchSet.map(m => ({ type: 'ru', id: m.id, text: m.ru })));

      panelEl.innerHTML = `
        <div class="match-columns">
          <div>
            <div class="muted" style="margin-bottom:8px; text-align:center">Английские</div>
            <div class="grid" id="matchEn">
              ${ens.map(e => `<div class="option" data-id="${e.id}" data-type="en">${e.text}</div>`).join('')}
            </div>
          </div>
          <div>
            <div class="muted" style="margin-bottom:8px; text-align:center">Русские</div>
            <div class="grid" id="matchRu">
              ${rus.map(r => `<div class="option" data-id="${r.id}" data-type="ru">${r.text}</div>`).join('')}
            </div>
          </div>
        </div>
      `;

      const all = panelEl.querySelectorAll('.option');
      all.forEach(el => {
        el.onclick = () => {
          const id = Number(el.dataset.id);
          const type = el.dataset.type;
          if (!matchPicked) {
            if (type !== 'en') return; // сначала выбираем английское слово
            matchPicked = id;
            el.classList.add('selected');
          } else {
            if (type !== 'ru') return;
            const pairId = id;
            const correct = pairId === matchPicked;
            const enEl = panelEl.querySelector(`.option[data-type="en"][data-id="${matchPicked}"]`);
            const ruEl = el;
            if (correct) {
              enEl.classList.add('correct');
              ruEl.classList.add('correct');
              const w = words.find(x => x.id === matchPicked);
              if (w) w.streak += 1;
              // удалить пару сразу
              matchSet = matchSet.filter(m => m.id !== matchPicked);
              saveState();
            } else {
              enEl.classList.add('wrong');
              ruEl.classList.add('wrong');
              const w = words.find(x => x.id === matchPicked);
              if (w) { w.errors += 1; w.streak = 0; }
              saveState();
            }
            matchPicked = null;
            setTimeout(() => {
              if (!matchSet.length) { makeMatchSet(4); }
              renderMatch();
            }, 500);
          }
        };
      });
    }

    // ---------- Mount ----------

        case 'match': renderMatch(); break;
          case 'irregulars': renderIrregulars(); break;
          case 'ir-assembly': renderIrAssembly(); break;
      }
    }

document.getElementById('confirmAddWord').onclick = () => {
  const en = document.getElementById('modalEn').value.trim();
  const ru = document.getElementById('modalRu').value.trim();
  const tr = document.getElementById('modalTr').value.trim();

  if (!en || !ru) {
    alert('Введите английское слово и перевод');
    return;
  }

  if (words.some(w =>
    w.en.toLowerCase() === en.toLowerCase() &&
    w.ru.toLowerCase() === ru.toLowerCase()
  )) {
    alert('Такое слово уже существует');
    return;
  }

  words.push({
    id: words.length ? Math.max(...words.map(w => w.id)) + 1 : 1,
    en,
    ru,
    tr,
    streak: 0,
    errors: 0,
    manual: false
  });

  saveState();
  closeAddModal();
  renderDict();

  document.getElementById('modalEn').value = '';
  document.getElementById('modalRu').value = '';
  document.getElementById('modalTr').value = '';
};

function renderIrregulars() {
  // сохраняем состояние
  window.irQuery = window.irQuery ?? '';
  window.irFilter = window.irFilter ?? 'all';

  // ===== РАЗМЕТКА (ОДИН РАЗ) =====
  panel.innerHTML = `
    <div class="row" style="gap:12px; flex-wrap:wrap; align-items:center">

      <input
        id="irSearch"
        class="input"
        style="flex:2; min-width:220px"

      <select id="irFilter" class="input" style="flex:1; min-width:160px">

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>№</th>
            <th>Base</th>
            <th>Past</th>
            <th>PP</th>
            <th>Перевод</th>
            <th class="center">Серия</th>
            <th class="center">Ошибки</th>
            <th class="center">Выучено</th>
            <th class="center">Удалить</th>
          </tr>
        </thead>
        <tbody id="irTbody"></tbody>
      </table>
    </div>
  `;

  document.getElementById('irFilter').value = window.irFilter;

  // ===== ОТРИСОВКА ТАБЛИЦЫ =====
  function updateTable() {
    let list = irregulars.slice();

    // поиск
    if (window.irQuery.trim()) {
      const q = window.irQuery.toLowerCase();
      list = list.filter(v =>
        v.base.toLowerCase().includes(q) ||
        v.past.toLowerCase().includes(q) ||
        v.pp.toLowerCase().includes(q) ||
        v.ru.toLowerCase().includes(q)
      );
    }

    // фильтр
    if (window.irFilter === 'learned') {
      list = list.filter(v => v.learned);
    }
    if (window.irFilter === 'unlearned') {
      list = list.filter(v => !v.learned);
    }

    // сортировка
    list.sort((a, b) => a.base.localeCompare(b.base, 'en'));

    const tbody = document.getElementById('irTbody');

    tbody.innerHTML = list.length
      ? list.map((v, i) => `
          <tr class="${v.learned ? 'learned-row' : ''}">
            <td>${i + 1}</td>
            <td>${v.base}</td>
            <td>${v.past}</td>
            <td>${v.pp}</td>
            <td>${v.ru}</td>
            <td class="center">${v.streak ?? 0}</td>
            <td class="center">${v.errors ?? 0}</td>
            <td class="center">
              <input type="checkbox" data-id="${v.id}" ${v.learned ? 'checked' : ''}>
            </td>
            <td class="center">
              <button class="btn error btn-del" data-id="${v.id}">✕</button>
            </td>
          </tr>
        `).join('')
      : `<tr><td colspan="9" class="center muted">Ничего не найдено</td></tr>`;

    // чекбоксы
    tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.onchange = () => {
        const item = irregulars.find(v => v.id == cb.dataset.id);
        item.learned = cb.checked;
        saveIrregulars();
        updateTable();
      };
    });

    // удаление
    tbody.querySelectorAll('.btn-del').forEach(btn => {
      btn.onclick = () => {
        if (!confirm('Удалить глагол?')) return;
        irregulars = irregulars.filter(v => v.id != btn.dataset.id);
        saveIrregulars();
        updateTable();
      };
    });
  }

  // ===== СОБЫТИЯ =====
  document.getElementById('irSearch').addEventListener('input', e => {
    window.irQuery = e.target.value;
    updateTable();
  });

  document.getElementById('irFilter').onchange = e => {
    window.irFilter = e.target.value;
    updateTable();
  };

  document.getElementById('markAllIrregulars').onclick = () => {
    irregulars.forEach(v => v.learned = true);
    saveIrregulars();
    updateTable();
  };

  document.getElementById('resetIrregulars').onclick = () => {

    irregulars.push({
      id: Date.now(),
      base, past, pp, ru,
      streak: 0,
      errors: 0,
      learned: false
    });

    saveIrregulars();
    updateTable();
  };

  // первый рендер
  updateTable();
}

function renderIrAssembly() {
  const pool = irregulars.filter(v => !v.learned);

  if (!pool.length) {
    panelEl.innerHTML = `
      <div class="card center">
        <h3>🎉 Все неправильные глаголы выучены!</h3>
      </div>
    `;
    return;
  }

  const current = pool[Math.floor(Math.random() * pool.length)];

  function getOptions(correct, field) {
    const others = irregulars
      .filter(v => v !== current)
      .map(v => v[field])
      .filter(v => v && v !== correct);

    return [...others.sort(() => Math.random() - 0.5).slice(0, 3), correct]
      .sort(() => Math.random() - 0.5);
  }

  const pastOptions = getOptions(current.past, 'past');
  const ppOptions = getOptions(current.pp, 'pp');

  panelEl.innerHTML = `
    <div class="card">
      <div class="center" style="font-size:26px; font-weight:700">
        ${current.base}
      </div>

      <div class="center muted" style="margin-bottom:14px">
        ${current.ru}
      </div>

      <div class="assembly-grid">
        <div>
          <div class="muted center">Past</div>
          <div class="options vertical">
            ${pastOptions.map(v =>
              `<div class="option" data-type="past" data-val="${v}">${v}</div>`
            ).join('')}
          </div>
        </div>

        <div>
          <div class="muted center">PP</div>
          <div class="options vertical">
            ${ppOptions.map(v =>
              `<div class="option" data-type="pp" data-val="${v}">${v}</div>`
            ).join('')}
          </div>
        </div>
      </div>

      <div id="assemblyResult" class="center muted" style="margin-top:12px"></div>
    </div>
  `;

  let selected = { past: null, pp: null };

  document.querySelectorAll('.option').forEach(opt => {
    opt.onclick = () => {
      const type = opt.dataset.type;
      selected[type] = opt.dataset.val;

      document
        .querySelectorAll(`.option[data-type="${type}"]`)
        .forEach(o => o.classList.remove('active'));

      opt.classList.add('active');

      if (selected.past && selected.pp) {
        check();
      }
    };
  });

  function check() {
    const resultEl = document.getElementById('assemblyResult');

    const ok =
      selected.past === current.past &&
      selected.pp === current.pp;

    let timeDurtion = 1500;
    
    if (ok) {
      current.streak = (current.streak || 0) + 1;

      if (current.streak >= 3) {
        current.learned = true;
        current.needRepeat = false; // ✅ УБРАЛИ ИЗ ПОВТОРА
        resultEl.innerHTML = '🎉 Выучено!';
      } else {
              resultEl.innerHTML = `✅ Верно (${current.streak}/3)`;
            }
  } else {
    current.errors = (current.errors || 0) + 1;
    current.streak = 0;
  
    // 🚨 ОТПРАВЛЯЕМ В ПОВТОР
    current.needRepeat = true;
    current.learned = false;
  
    resultEl.innerHTML = `
      ❌ Ошибка<br>
      <span class="muted">Past:</span> <b>${current.past}</b>,
      <span class="muted">PP:</span> <b>${current.pp}</b>
    `;
      timeDurtion = 3000;
}


    saveIrregulars();
    setTimeout(renderIrAssembly, timeDurtion);
  }
}


    renderTabs();
    renderPanel();
  </script>
</body>
</html>
