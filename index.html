<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>
<style>
:root{--bg:#ffd6e7;--card:#fff;--btn:#eee}
body{margin:0;font-family:Arial;background:var(--bg);display:flex;justify-content:center;padding:20px}
.app{width:500px;background:var(--card);border-radius:18px;padding:16px}
.header{display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.title{text-align:center;font-weight:bold;font-size:18px}
.palette{width:26px;height:26px;border-radius:50%;border:2px solid #aaa;cursor:pointer;background:linear-gradient(45deg,#ffd6e7,#cce8ff)}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--btn);border:none;cursor:pointer;font-size:13px}
.tab.active{background:#cce8ff;font-weight:bold}
.hidden{display:none}
button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:12px;cursor:pointer;background:var(--btn)}
.correct{background:#8bc34a;color:#fff}
.wrong{background:#f44336;color:#fff}
.reading{font-style:italic;margin-top:8px}
.card{border:1px solid #ddd;border-radius:16px;padding:40px;text-align:center;font-size:24px;cursor:pointer}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border-bottom:1px solid #ddd;padding:6px;text-align:left}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div></div>
    <div class="title">Words Easy</div>
    <div class="palette" onclick="toggleTheme()"></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="openTab('test',this)">Тест</button>
    <button class="tab" onclick="openTab('cards',this)">Карточки</button>
    <button class="tab" onclick="openTab('input',this)">Ввод</button>
    <button class="tab" onclick="openTab('dict',this)">Словарь</button>
  </div>

  <!-- ТЕСТ -->
  <div id="test">
    <h2 id="word"></h2>
    <button onclick="toggleReading()">Показать чтение</button>
    <div id="reading" class="reading hidden"></div>
    <div id="answers"></div>
  </div>

  <!-- КАРТОЧКИ -->
  <div id="cards" class="hidden">
    <div id="card" class="card" onclick="nextCard()"></div>
    <p style="text-align:center;font-size:13px;color:#666">Нажимай на карточку — будут новые слова</p>
  </div>

  <!-- ВВОД -->
  <div id="input" class="hidden">
    <h3 id="inputRu"></h3>
    <input id="inputEn" placeholder="Введи английское слово" onkeydown="if(event.key==='Enter')checkInput()" style="width:100%;padding:10px;border-radius:10px;border:1px solid #ccc">
    <button onclick="checkInput()">Проверить</button>
  </div>

  <!-- СЛОВАРЬ -->
  <div id="dict" class="hidden"></div>
</div>

<script>
const rawWords=[
'here|здесь|хиэ','there|там|зэа','at school|в школе|эт скул','understand|понимать|андэстэнд','know|знать|ноу','eat|есть|ит','drink|пить|дринк','sleep|спать|слиип','ask|спрашивать|аск','read|читать|рид','write|писать|райт','describe|описывать|дискрáйб','analyse|анализировать|энэлайз','think|думать|синк','wait|ждать|вэйт','buy|покупать|бай','play|играть|плэй','want|хотеть|вонт','explain|объяснять|иксплэйн','study|учиться|стади','work|работать|вёрк','take|брать|тэйк','arrive|прибывать|эрайв','interrupt|перебивать|интэрапт','I need|мне нужно|ай нид','you need|тебе нужно|ю нид','we need|нам нужно|уи нид','they need|им нужно|зэй нид','he needs|ему нужно|хи нидз','she needs|ей нужно|ши нидз','I like|мне нравится|ай лайк','you like|тебе нравится|ю лайк','we like|нам нравится|уи лайк','they like|им нравится|зэй лайк','he likes|ему нравится|хи лайкс','she likes|ей нравится|ши лайкс','use|пользоваться|юз','collect|коллекционировать|колэкт','confuse|путать|кэнфьюз','apologise|извиняться|эполоджайз','forgive|прощать|фэгив','forget|забывать|фэгэт','start|начинать|старт','begin|начинать|бигин','continue|продолжать|континью','finish|заканчивать|финиш','busy|занятый|бизи','cosy|уютный|коузи','enough|достаточно|инаф','rich|богатый|рич','poor|бедный|пуа','possible|возможно|посибл','impossible|невозможно|импосибл','I’m busy|я занят|айм бизи','it’s cosy|это уютно|итс коузи','it’s enough|этого достаточно|итс инаф','he’s rich|он богатый|хиз рич','she’s poor|она бедная|шиз пуа','it’s possible|это возможно|итс посибл','it’s impossible|это невозможно|итс импосибл','you’re right|ты прав|йо райт','we’re right|мы правы|уи райт','they’re right|они правы|зэй райт','why|почему|вай','who|кто|ху','where|где|уэа','what|что|вот','when|когда|уэн','how often|как часто|хау офн','how regularly|как регулярно|хау рэгьюлэли','how many|сколько|хау мэни','how much|сколько|хау мач','get to|добираться до|гэт ту','get home|добираться домой|гэт хоум','get there|добираться туда|гэт зэа','get here|добираться сюда|гэт хиэ','get back|добираться обратно|гэт бэк','expensive|дорого|икспэнсив','cheap|дёшево|чип','strong|сильный|стронг','weak|слабый|уик','creative|творческий|криэйтив','hardworking|трудолюбивый|хардворкинг','patient|терпеливый|пэйшэнт','punctual|пунктуальный|панкчуал'
];

const words=rawWords.map(s=>{const[a,b,c]=s.split('|');return{en:a,ru:b,read:c}});
let current;

const w=document.getElementById('word'),r=document.getElementById('reading'),a=document.getElementById('answers'),c=document.getElementById('card'),ir=document.getElementById('inputRu'),ie=document.getElementById('inputEn'),d=document.getElementById('dict');

function randomWord(){return words[Math.floor(Math.random()*words.length)]}

function pick(){current=randomWord();renderTest();renderCard();renderInput()}

function renderTest(){
  w.textContent=current.en;
  r.textContent=current.read;
  r.classList.add('hidden');
  a.innerHTML='';
  let opts=[current.ru];
  while(opts.length<4){let x=randomWord().ru;if(!opts.includes(x))opts.push(x)}
  opts.sort(()=>Math.random()-0.5).forEach(t=>{
    let b=document.createElement('button');b.textContent=t;
    b.onclick=()=>{b.className=t===current.ru?'correct':'wrong';setTimeout(pick,600)};
    a.appendChild(b)
  })
}

function renderCard(){c.textContent=current.en}
function nextCard(){current=randomWord();c.textContent=current.en}

function renderInput(){ir.textContent=current.ru;ie.value=''}
function checkInput(){alert(ie.value.toLowerCase()===current.en.toLowerCase()?'✅ Верно':'❌ '+current.en);pick()}

function renderDict(){
  d.innerHTML='<table class="table"><tr><th>English</th><th>Русский</th><th>Чтение</th></tr></table>';
  const table=d.querySelector('table');
  words.forEach(w=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${w.en}</td><td>${w.ru}</td><td>${w.read}</td>`;table.appendChild(tr)})
}

function openTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['test','cards','input','dict'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='dict')renderDict()
}

function toggleReading(){r.classList.toggle('hidden')}
let pink=true;function toggleTheme(){pink=!pink;document.documentElement.style.setProperty('--bg',pink?'#ffd6e7':'#cce8ff')}

pick();
</script>
</body>
</html>
