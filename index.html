<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
:root{
  --bg:#ffe6ef;
  --accent:#ff9fc9;
  --card:#ffffff;
  --ok:#b9fbc0;
  --bad:#ffb3b3;
}
body.blue{
  --bg:#dff3ff;
  --accent:#7ecbff;
}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
}
.container{
  max-width:420px;
  margin:0 auto;
  padding:15px;
}
h1{text-align:center}
.toggle{
  position:fixed;
  top:10px;
  right:10px;
}
.toggle button{
  border:none;
  border-radius:50%;
  padding:8px;
  background:var(--accent);
  cursor:pointer;
}
.progress{
  height:10px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
}
.progress div{
  height:100%;
  width:0%;
  background:var(--accent);
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:15px;
  margin-top:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}
select,input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  font-size:16px;
}
button{
  background:var(--accent);
  color:white;
  cursor:pointer;
}
.answers{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:10px;
}
.answers button{
  background:white;
  color:black;
}
.correct{background:var(--ok)!important}
.wrong{background:var(--bad)!important}
.hidden{display:none}
.reading{
  margin-top:8px;
  font-style:italic;
  color:#666;
}
.stat{
  text-align:center;
  margin-top:8px;
  font-size:14px;
}
.dict-row{
  border-bottom:1px solid #eee;
  padding:8px 0;
  font-size:14px;
}
.star{color:gold}
</style>
</head>

<body>

<div class="toggle">
  <button onclick="toggleTheme()">🎨</button>
</div>

<div class="container">
<h1>Words Easy</h1>

<div class="progress"><div id="bar"></div></div>
<div class="stat">🔥 Серия: <span id="streak">0</span></div>

<select id="mode" onchange="nextWord()">
  <option value="test">🎯 Тест</option>
  <option value="input">⌨️ Ввод</option>
  <option value="cards">🃏 Карточки</option>
</select>

<div class="card">
  <h3 id="question"></h3>
  <div id="answers" class="answers"></div>
  <input id="input" class="hidden" placeholder="Напиши перевод">
  <div id="reading" class="reading hidden"></div>
  <button onclick="showReading()">👁 Показать чтение</button>
</div>

<button onclick="toggleDict()">📖 Словарь</button>
<div id="dict" class="card hidden"></div>

</div>

<script>
const words = {
"here":["здесь","хиэ"],"there":["там","зэа"],"at school":["в школе","эт скул"],

"understand":["понимать","андэстэнд"],"know":["знать","ноу"],"eat":["есть","ит"],
"drink":["пить","дринк"],"sleep":["спать","слип"],"ask":["спрашивать","аск"],
"read":["читать","рид"],"write":["писать","райт"],"describe":["описывать","дискрáйб"],
"analyse":["анализировать","энэлайз"],"think":["думать","синк"],"wait":["ждать","вэйт"],
"buy":["покупать","бай"],"play":["играть","плэй"],"want":["хотеть","вонт"],
"explain":["объяснять","иксплэйн"],"study":["учиться","стади"],"work":["работать","вёрк"],
"take":["брать","тэйк"],"arrive":["прибывать","эрайв"],"interrupt":["перебивать","интэрапт"],

"I need":["мне нужно","ай нид"],"you need":["тебе нужно","ю нид"],
"we need":["нам нужно","ви нид"],"they need":["им нужно","зэй нид"],
"he needs":["ему нужно","хи нидз"],"she needs":["ей нужно","ши нидз"],

"I like":["мне нравится","ай лайк"],"you like":["тебе нравится","ю лайк"],
"we like":["нам нравится","ви лайк"],"they like":["им нравится","зэй лайк"],
"he likes":["ему нравится","хи лайкс"],"she likes":["ей нравится","ши лайкс"],

"use":["пользоваться","юз"],"collect":["коллекционировать","кэлэкт"],
"confuse":["путать","конфьюз"],"apologise":["извиняться","эполоджайз"],
"forgive":["прощать","фогив"],"forget":["забывать","фогэт"],

"start":["начинать","старт"],"begin":["начинать","бигин"],
"continue":["продолжать","континью"],"finish":["заканчивать","финиш"],

"busy":["занятый","бизи"],"cosy":["уютный","коузи"],"enough":["достаточно","инаф"],
"rich":["богатый","рич"],"poor":["бедный","пуа"],
"possible":["возможно","поссибл"],"impossible":["невозможно","импоссибл"],

"I'm busy":["я занят","айм бизи"],"it's cosy":["это уютно","итс коузи"],
"it's enough":["этого достаточно","итс инаф"],
"he's rich":["он богат","хиз рич"],"she's poor":["она бедная","шиз пуа"],
"it's possible":["это возможно","итс поссибл"],
"it's impossible":["это невозможно","итс импоссибл"],

"you're right":["ты прав","йо райт"],"we're right":["мы правы","вир райт"],
"they're right":["они правы","зэйр райт"],

"why":["почему","уай"],"who":["кто","ху"],"where":["где","уэа"],
"what":["что","уот"],"when":["когда","уэн"],
"how often":["как часто","хау офэн"],"how regularly":["как регулярно","хау рэгьюлэли"],
"how many":["сколько","хау мэни"],"how much":["сколько","хау мач"],

"get to":["добираться","гет ту"],"get home":["домой","гет хоум"],
"get there":["туда","гет зэа"],"get here":["сюда","гет хиэ"],
"get back":["обратно","гет бэк"],

"expensive":["дорого","икспэнсив"],"cheap":["дёшево","чип"],
"strong":["сильный","стронг"],"weak":["слабый","уик"],
"creative":["творческий","криэйтив"],"hardworking":["трудолюбивый","хардвёркинг"],
"patient":["терпеливый","пэйшент"],"punctual":["пунктуальный","панкчуал"]
};

let stats={}, learned=[], errors=[], current="", streak=0;
Object.keys(words).forEach(w=>stats[w]={ok:0,streak:0});

function nextWord(){
  answers.innerHTML="";
  input.value="";
  input.classList.add("hidden");
  reading.classList.add("hidden");

  let pool = errors.length? errors : Object.keys(words);
  current = pool[Math.floor(Math.random()*pool.length)];
  question.innerText="Переведи: "+current;

  if(mode.value==="test"){
    let opts=[words[current][0]];
    while(opts.length<4){
      let r=Object.keys(words)[Math.floor(Math.random()*Object.keys(words).length)];
      if(!opts.includes(words[r][0])) opts.push(words[r][0]);
    }
    opts.sort(()=>Math.random()-0.5);
    opts.forEach(o=>{
      let b=document.createElement("button");
      b.innerText=o;
      b.onclick=()=>check(o,b);
      answers.appendChild(b);
    });
  }

  if(mode.value==="input"){
    input.classList.remove("hidden");
    input.onkeydown=e=>{
      if(e.key==="Enter") check(input.value);
    }
  }

  if(mode.value==="cards"){
    answers.innerHTML=`<button onclick="answers.innerHTML='<div>${words[current][0]}</div>'">Показать перевод</button>`;
  }

  updateUI();
}

function showReading(){
  reading.innerText="Чтение: "+words[current][1];
  reading.classList.remove("hidden");
}

function check(val,btn){
  if(val.trim().toLowerCase()===words[current][0]){
    stats[current].ok++; stats[current].streak++; streak++;
    if(stats[current].streak>=3 && !learned.includes(current)) learned.push(current);
    errors=errors.filter(e=>e!==current);
    if(btn) btn.classList.add("correct");
  } else {
    stats[current].streak=0; streak=0;
    if(!errors.includes(current)) errors.push(current);
    if(btn) btn.classList.add("wrong");
  }
  setTimeout(nextWord,900);
}

function toggleDict(){
  dict.classList.toggle("hidden");
  dict.innerHTML=Object.keys(words).map(w=>`
    <div class="dict-row">
      <b>${w}</b><br>
      ${words[w][0]} — <i>${words[w][1]}</i><br>
      ✔ ${stats[w].ok} ${learned.includes(w)?"⭐":""}
    </div>
  `).join("");
}

function updateUI(){
  streakSpan.innerText=streak;
  bar.style.width=(learned.length/Object.keys(words).length*100)+"%";
}
function toggleTheme(){document.body.classList.toggle("blue");}

const streakSpan=document.getElementById("streak");
nextWord();
</script>

</body>
</html>
