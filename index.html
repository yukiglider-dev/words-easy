<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>English Trainer</title>
<style>
body {
  font-family: Arial, sans-serif;
  background:#111;
  color:#fff;
  margin:0;
  padding:20px;
}
button {
  padding:10px 15px;
  margin:5px;
  cursor:pointer;
}
.hidden { display:none; }
.good { background:#2ecc71; }
.bad { background:#e74c3c; }

.card {
  border:1px solid #555;
  padding:30px;
  font-size:26px;
  margin:20px 0;
  text-align:center;
}

.reading {
  opacity:.7;
  margin-top:10px;
}
</style>
</head>
<body>

<h1>English Trainer</h1>

<button onclick="mode='cards';render()">Карточки</button>
<button onclick="mode='test';render()">Тест</button>

<hr>

<div id="cards" class="hidden">
  <div class="card" id="card"></div>
  <button onclick="flip()">Перевернуть</button>
  <button onclick="nextCard()">Дальше</button>
</div>

<div id="test" class="hidden">
  <h2 id="word"></h2>
  <div id="transcription" class="reading"></div>
  <div id="example" class="reading"></div>
  <div id="answers"></div>
</div>

<script>
/* ================== ДАННЫЕ ================== */

const raw = [
"here|здесь|хиэ|I am here now.",
"there|там|зэа|She is there.",
"at school|в школе|эт скул|My sister is at school.",

"understand|понимать|андэстэнд|I understand you.",
"know|знать|ноу|I know this word.",
"eat|есть|ит|I eat breakfast.",
"drink|пить|дринк|I drink water.",
"sleep|спать|слиип|I want to sleep.",
"ask|спрашивать|аск|I ask a question.",
"read|читать|рид|I read books.",
"write|писать|райт|I write every day.",
"describe|описывать|дискрáйб|Describe this picture.",
"analyse|анализировать|энэлайз|We analyse the text.",
"think|думать|синк|I think about it.",
"wait|ждать|вэйт|Please wait.",
"buy|покупать|бай|I buy food.",
"play|играть|плэй|I play football.",
"want|хотеть|вонт|I want coffee.",
"explain|объяснять|иксплэйн|Explain this rule.",
"study|учиться|стади|I study English.",
"work|работать|вёрк|I work hard.",
"take|брать|тэйк|Take this book.",
"arrive|прибывать|эрайв|We arrive early.",
"interrupt|перебивать|интэрапт|Don’t interrupt me.",

"I need|мне нужно|ай нид|I need help.",
"you need|тебе нужно|ю нид|You need practice.",
"we need|нам нужно|уи нид|We need time.",
"they need|им нужно|зэй нид|They need rest.",
"he needs|ему нужно|хи нидз|He needs money.",
"she needs|ей нужно|ши нидз|She needs help.",

"I like|мне нравится|ай лайк|I like music.",
"you like|тебе нравится|ю лайк|You like tea.",
"we like|нам нравится|уи лайк|We like it.",
"they like|им нравится|зэй лайк|They like English.",
"he likes|ему нравится|хи лайкс|He likes coffee.",
"she likes|ей нравится|ши лайкс|She likes books."
];

/* ================== ЛОГИКА ================== */

const saved = JSON.parse(localStorage.getItem('words')||'[]');

let words = raw.map((s,i)=>{
  const [en,ru,read,example]=s.split('|');
  return saved[i] || {en,ru,read,example,streak:0};
});

let mode='cards';
let index=0;
let flipped=false;

const card=document.getElementById('card');
const wordEl=document.getElementById('word');
const trEl=document.getElementById('transcription');
const exEl=document.getElementById('example');
const ansEl=document.getElementById('answers');

function save(){
  localStorage.setItem('words',JSON.stringify(words));
}

function nextIndex(){
  const pool = words.filter(w=>w.streak<3);
  if(!pool.length){
    alert('Все слова выучены 🎉');
    return null;
  }
  return words.indexOf(pool[Math.floor(Math.random()*pool.length)]);
}

/* ================== КАРТОЧКИ ================== */

function renderCard(){
  const w=words[index];
  card.textContent = flipped ? w.example : w.en;
}

function flip(){
  flipped=!flipped;
  renderCard();
}

function nextCard(){
  index = nextIndex();
  if(index!==null){
    flipped=false;
    renderCard();
  }
}

/* ================== ТЕСТ ================== */

function renderTest(){
  index = nextIndex();
  if(index===null) return;

  const w=words[index];
  wordEl.textContent=w.en;
  trEl.textContent=w.read;
  exEl.textContent=w.example;

  ansEl.innerHTML='';
  const opts = [w.ru];

  while(opts.length<4){
    const r=words[Math.floor(Math.random()*words.length)].ru;
    if(!opts.includes(r)) opts.push(r);
  }

  opts.sort(()=>Math.random()-0.5);

  opts.forEach(o=>{
    const b=document.createElement('button');
    b.textContent=o;
    b.onclick=()=>{
      if(o===w.ru){
        b.classList.add('good');
        w.streak++;
      } else {
        b.classList.add('bad');
      }
      save();
      setTimeout(renderTest,700);
    };
    ansEl.appendChild(b);
  });
}

/* ================== РЕНДЕР ================== */

function render(){
  document.getElementById('cards').classList.toggle('hidden',mode!=='cards');
  document.getElementById('test').classList.toggle('hidden',mode!=='test');

  if(mode==='cards'){
    index=nextIndex();
    flipped=false;
    renderCard();
  } else {
    renderTest();
  }
}

render();
</script>

</body>
</html>
