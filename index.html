<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Words Easy — Test</title>

<style>
body{
  margin:0;
  background:#f6e6ef;
  display:flex;
  justify-content:center;
  font-family:system-ui;
}
.app{
  width:100%;
  max-width:400px;
  padding:20px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  text-align:center;
}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
}
.green{background:#8bc34a;color:white}
.red{background:#f44336;color:white}
</style>
</head>

<body>
<div class="app">
  <div id="card" class="card"></div>
</div>

<script>
const baseWords = [
  { en:"here", ru:"здесь" },
  { en:"there", ru:"там" },
  { en:"eat", ru:"есть" },
  { en:"drink", ru:"пить" }
];

let words = JSON.parse(localStorage.getItem("words_test")) ||
  baseWords.map(w => ({...w, ok:0, fail:0, streak:0, learned:false}));

let currentWord = null;

function save(){
  localStorage.setItem("words_test", JSON.stringify(words));
}

function pickWord(){
  const active = words.filter(w => !w.learned);
  if(active.length === 0) return null;
  active.sort((a,b) => (b.fail - b.ok) - (a.fail - a.ok));
  return active[0];
}

function render(){
  const card = document.getElementById("card");
  currentWord = pickWord();

  if(!currentWord){
    card.innerHTML = "Все слова выучены ⭐";
    return;
  }

  const options = [
    currentWord.ru,
    ...words.filter(w=>w!==currentWord)
      .sort(()=>Math.random()-0.5)
      .slice(0,2)
      .map(w=>w.ru)
  ].sort(()=>Math.random()-0.5);

  card.innerHTML = `
    <h2>${currentWord.en}</h2>
    ${options.map(o=>`<button onclick="answer(this,'${o}')">${o}</button>`).join("")}
  `;
}

function answer(btn, ru){
  const buttons = document.querySelectorAll("button");
  buttons.forEach(b=>b.disabled=true);

  if(ru === currentWord.ru){
    btn.classList.add("green");
    currentWord.ok++;
    currentWord.streak++;
    if(currentWord.streak >= 3){
      currentWord.learned = true;
    }
  }else{
    btn.classList.add("red");
    currentWord.fail++;
    currentWord.streak = 0;
  }

  save();
  setTimeout(render, 700);
}

render();
</script>
</body>
</html>
