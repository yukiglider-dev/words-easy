<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>
<style>
:root{--bg:#ffd6e7;--card:#fff;--btn:#eee;--accent:#cce8ff}
body{margin:0;font-family:Arial;background:var(--bg);display:flex;justify-content:center;padding:20px}
.app{width:540px;background:var(--card);border-radius:18px;padding:16px}
.header{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px}
.title{text-align:center;font-weight:bold;font-size:18px;grid-column:1/4}
.palette{width:22px;height:22px;border-radius:50%;border:2px solid #aaa;cursor:pointer;background:linear-gradient(45deg,#ffd6e7,#cce8ff)}
.langToggle{font-size:11px;padding:4px 6px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--btn);border:none;cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);font-weight:bold}
.hidden{display:none}
button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:12px;cursor:pointer;background:var(--btn)}
.correct{background:#8bc34a;color:#fff}
.wrong{background:#f44336;color:#fff}
/* CARD */
.cardWrap{perspective:1000px}
.card{
  position:relative;
  border:1px solid #ddd;
  border-radius:16px;
  padding:40px;
  text-align:center;
  font-size:24px;
  cursor:pointer;
  min-height:100px;
  user-select:none;
  transition:transform .6s;
  transform-style:preserve-3d;
}
.card.flipped{transform:rotateY(180deg)}
.side{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.controls{display:flex;gap:10px;margin-top:10px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border-bottom:1px solid #ddd;padding:6px;text-align:left}
.center{text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div></div>
    <div class="langToggle" onclick="toggleCardLang()" id="langBtn">EN</div>
    <div class="palette" onclick="toggleTheme()"></div>
    <div class="title">Words Easy</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="openTab('cards',this)">Карточки</button>
    <button class="tab" onclick="openTab('repeat',this)">Повтор</button>
    <button class="tab" onclick="openTab('dict',this)">Словарь</button>
  </div>

  <!-- КАРТОЧКИ -->
  <div id="cards" class="center">
    <div class="cardWrap">
      <div id="card" class="card" onclick="flipCard()">
        <div class="side front" id="front"></div>
        <div class="side back" id="back"></div>
      </div>
    </div>
    <div class="controls">
      <button class="correct" onclick="cardYes()">Да</button>
      <button class="wrong" onclick="cardNo()">Нет</button>
    </div>
  </div>

  <!-- ПОВТОР -->
  <div id="repeat" class="hidden center">
    <h3 id="repeatWord"></h3>
    <button class="correct" onclick="repeatYes()">Знаю</button>
    <button class="wrong" onclick="repeatNo()">Не знаю</button>
  </div>

  <!-- СЛОВАРЬ -->
  <div id="dict" class="hidden"></div>
</div>

<script>
const raw=[
'here|здесь|хиэ','there|там|зэа','at school|в школе|эт скул','analyse|анализировать|энэлайз','apologise|извиняться|эполоджайз','arrive|прибывать|эрайв','ask|спрашивать|аск','begin|начинать|бигин','busy|занятый|бизи','buy|покупать|бай','cheap|дёшево|чип','collect|коллекционировать|колэкт','confuse|путать|кэнфьюз','continue|продолжать|континью','cosy|уютный|коузи','creative|творческий|криэйтив','describe|описывать|дискрáйб','drink|пить|дринк','eat|есть|ит','enough|достаточно|инаф','expensive|дорого|икспэнсив','explain|объяснять|иксплэйн','finish|заканчивать|финиш','forget|забывать|фэгэт','forgive|прощать|фэгив','get back|добираться обратно|гэт бэк','get here|добираться сюда|гэт хиэ','get home|добираться домой|гэт хоум','get there|добираться туда|гэт зэа','get to|добираться до|гэт ту','hardworking|трудолюбивый|хардворкинг','he likes|ему нравится|хи лайкс','he needs|ему нужно|хи нидз','he’s rich|он богатый|хиз рич','how many|сколько|хау мэни','how much|сколько|хау мач','how often|как часто|хау офн','how regularly|как регулярно|хау рэгьюлэли','I like|мне нравится|ай лайк','I need|мне нужно|ай нид','I’m busy|я занят|айм бизи','impossible|невозможно|импосибл','interrupt|перебивать|интэрапт','it’s cosy|это уютно|итс коузи','it’s enough|этого достаточно|итс инаф','it’s impossible|это невозможно|итс импосибл','it’s possible|это возможно|итс посибл','know|знать|ноу','patient|терпеливый|пэйшэнт','play|играть|плэй','poor|бедный|пуа','possible|возможно|посибл','punctual|пунктуальный|панкчуал','read|читать|рид','rich|богатый|рич','she likes|ей нравится|ши лайкс','she needs|ей нужно|ши нидз','she’s poor|она бедная|шиз пуа','sleep|спать|слиип','start|начинать|старт','strong|сильный|стронг','study|учиться|стади','take|брать|тэйк','they like|им нравится|зэй лайк','they need|им нужно|зэй нид','they’re right|они правы|зэй райт','think|думать|синк','understand|понимать|андэстэнд','use|пользоваться|юз','wait|ждать|вэйт','weak|слабый|уик','we like|нам нравится|уи лайк','we need|нам нужно|уи нид','we’re right|мы правы|уи райт','what|что|вот','when|когда|уэн','where|где|уэа','who|кто|ху','why|почему|вай','work|работать|вёрк','write|писать|райт','you like|тебе нравится|ю лайк','you need|тебе нужно|ю нид','you’re right|ты прав|йо райт'
];

const saved=JSON.parse(localStorage.getItem('wordsEasy')||'null');
const words=(saved||raw.map(s=>{const[a,b,c]=s.split('|');return{en:a,ru:b,read:c,ok:0,fail:0}}))
.sort((a,b)=>a.en.localeCompare(b.en));

let pool=[...words],errors=[],current,side=0,cardLang='en';
const front=document.getElementById('front'),back=document.getElementById('back'),card=document.getElementById('card');
const d=document.getElementById('dict'),rb=document.getElementById('repeatWord'),langBtn=document.getElementById('langBtn');

function save(){localStorage.setItem('wordsEasy',JSON.stringify(words))}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function pick(){
  pool=words.filter(w=>w.ok<3);
  current=rnd(pool.length?pool:words);
  renderCard();save();
}

function renderCard(){
  side=0;card.classList.remove('flipped');
  front.textContent=cardLang==='en'?current.en:current.ru;
  back.textContent=cardLang==='en'?current.ru:current.en;
}
function flipCard(){side=!side;card.classList.toggle('flipped')}
function cardYes(){current.ok++;pick()}
function cardNo(){current.fail++;errors.push(current);pick()}

function toggleCardLang(){cardLang=cardLang==='en'?'ru':'en';langBtn.textContent=cardLang.toUpperCase();renderCard()}

function renderDict(){
  d.innerHTML='<table class="table"><tr><th>#</th><th>English</th><th>Русский</th><th>Прогресс</th></tr></table>';
  const t=d.querySelector('table');
  words.forEach((w,i)=>{
    let tr=document.createElement('tr');
    tr.innerHTML=`<td>${i+1}</td><td>${w.en}</td><td>${w.ru}</td><td>${w.ok}/3</td>`;
    t.appendChild(tr)
  })
}

function openTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');
  ['cards','repeat','dict'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='dict')renderDict();
  if(id==='repeat')renderRepeat();
}

function renderRepeat(){
  const hard=words.filter(w=>w.fail>0 && w.ok<3);
  if(!hard.length){rb.textContent='Нет слов для повтора';return}
  current=rnd(hard);rb.textContent=current.en;
}
function repeatYes(){current.ok++;current.fail=0;pick()}
function repeatNo(){current.fail++;pick()}

let pink=true;function toggleTheme(){pink=!pink;document.documentElement.style.setProperty('--bg',pink?'#ffd6e7':'#cce8ff')}

pick();
</script>
</body>
</html>
