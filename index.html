<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>
<style>
:root{
  --bg:#ffd6e7;
  --card:#ffffff;
  --btn:#eeeeee;
}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
  padding-top:20px;
}
.app{
  width:460px;
  background:var(--card);
  border-radius:18px;
  padding:16px;
}
.header{
  display:grid;
  grid-template-columns:40px 1fr 40px;
  align-items:center;
}
.title{text-align:center;font-weight:bold;font-size:18px;}
.palette{width:26px;height:26px;border-radius:50%;border:2px solid #aaa;cursor:pointer;}
.tabs{display:flex;gap:6px;margin:12px 0;}
.tab{
  flex:1;
  padding:8px;
  border-radius:10px;
  background:var(--btn);
  border:none;
  cursor:pointer;
  font-size:13px;
}
.tab.active{background:#cce8ff;font-weight:bold;}
.hidden{display:none;}
button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:var(--btn);
}
.correct{background:#8bc34a;color:#fff;}
.wrong{background:#f44336;color:#fff;}
.reading{font-style:italic;margin-top:8px;}
.dict-row{border-bottom:1px solid #ddd;padding:6px 0;font-size:14px;}
.input{width:100%;padding:10px;border-radius:10px;border:1px solid #ccc;font-size:16px;}
.card{border:1px solid #ddd;border-radius:14px;padding:30px;text-align:center;font-size:22px;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div></div>
    <div class="title">Words Easy</div>
    <div class="palette" onclick="toggleTheme()"></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="openTab('test')">Тест</button>
    <button class="tab" onclick="openTab('cards')">Карточки</button>
    <button class="tab" onclick="openTab('input')">Ввод</button>
    <button class="tab" onclick="openTab('errors')">Повторы</button>
    <button class="tab" onclick="openTab('dict')">Словарь</button>
  </div>

  <!-- ТЕСТ -->
  <div id="test">
    <h2 id="word"></h2>
    <button onclick="toggleReading()">Показать чтение</button>
    <div id="reading" class="reading hidden"></div>
    <div id="answers"></div>
  </div>

  <!-- КАРТОЧКИ -->
  <div id="cards" class="hidden">
    <div id="card" class="card" onclick="flipCard()"></div>
  </div>

  <!-- ВВОД -->
  <div id="input" class="hidden">
    <h3 id="inputRu"></h3>
    <input id="inputEn" class="input" placeholder="Введи английское слово" onkeydown="if(event.key==='Enter')checkInput()">
    <button onclick="checkInput()">Проверить</button>
  </div>

  <!-- ОШИБКИ -->
  <div id="errors" class="hidden"></div>

  <!-- СЛОВАРЬ -->
  <div id="dict" class="hidden"></div>
</div>

<script>
const words=[
{en:'here',ru:'здесь',read:'хиэ'},
{en:'there',ru:'там',read:'зэа'},
{en:'at school',ru:'в школе',read:'эт скул'},
{en:'understand',ru:'понимать',read:'андэстэнд'},
{en:'know',ru:'знать',read:'ноу'},
{en:'eat',ru:'есть',read:'ит'},
{en:'drink',ru:'пить',read:'дринк'},
{en:'sleep',ru:'спать',read:'слиип'},
{en:'ask',ru:'спрашивать',read:'аск'},
{en:'read',ru:'читать',read:'рид'},
{en:'write',ru:'писать',read:'райт'},
{en:'play',ru:'играть',read:'плэй'},
{en:'want',ru:'хотеть',read:'вонт'},
{en:'work',ru:'работать',read:'вёрк'},
{en:'buy',ru:'покупать',read:'бай'}
].map(w=>({...w,ok:0,streak:0,learned:false,errors:0}));

let current=null;
let cardSide='en';

const wordEl=document.getElementById('word');
const readingEl=document.getElementById('reading');
const answersEl=document.getElementById('answers');
const dictEl=document.getElementById('dict');
const cardEl=document.getElementById('card');
const inputRu=document.getElementById('inputRu');
const inputEn=document.getElementById('inputEn');
const errorsEl=document.getElementById('errors');

function pickWord(){current=words[Math.floor(Math.random()*words.length)];renderTest();renderCard();renderInput();}

function renderTest(){
  wordEl.textContent=current.en;
  readingEl.textContent=current.read;
  readingEl.classList.add('hidden');
  answersEl.innerHTML='';
  let opts=[current.ru];
  while(opts.length<4){
    const r=words[Math.floor(Math.random()*words.length)].ru;
    if(!opts.includes(r)) opts.push(r);
  }
  opts.sort(()=>Math.random()-0.5);
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.textContent=o;
    b.onclick=()=>checkTest(b,o);
    answersEl.appendChild(b);
  });
}

function checkTest(btn,text){
  if(text===current.ru){btn.classList.add('correct');current.ok++;current.streak++;}
  else{btn.classList.add('wrong');current.streak=0;current.errors++;}
  setTimeout(pickWord,700);
}

function renderCard(){cardSide='en';cardEl.textContent=current.en;}
function flipCard(){cardSide=cardSide==='en'?'ru':'en';cardEl.textContent=cardSide==='en'?current.en:current.ru;}

function renderInput(){inputRu.textContent=current.ru;inputEn.value='';}
function checkInput(){
  if(inputEn.value.trim().toLowerCase()===current.en.toLowerCase()){current.ok++;current.streak++;alert('✅ Верно');}
  else{current.streak=0;current.errors++;alert('❌ Неверно: '+current.en);}
  pickWord();
}

function openTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  ['test','cards','input','errors','dict'].forEach(t=>document.getElementById(t).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='dict')renderDict();
  if(id==='errors')renderErrors();
}

function renderDict(){
  dictEl.innerHTML='';
  words.forEach(w=>{
    const d=document.createElement('div');
    d.className='dict-row';
    d.textContent=`${w.en} — ${w.ru} — ${w.read} ✔${w.ok}`;
    dictEl.appendChild(d);
  });
}

function renderErrors(){
  errorsEl.innerHTML='';
  words.filter(w=>w.errors>0).forEach(w=>{
    const d=document.createElement('div');
    d.className='dict-row';
    d.textContent=`${w.en} — ошибки: ${w.errors}`;
    errorsEl.appendChild(d);
  });
}

function toggleReading(){readingEl.classList.toggle('hidden');}

let pink=true;
function toggleTheme(){pink=!pink;document.documentElement.style.setProperty('--bg',pink?'#ffd6e7':'#cce8ff');}

pickWord();
</script>
</body>
</html>
