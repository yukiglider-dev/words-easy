<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
:root{--bg:#ffd6e7;--card:#fff;--btn:#eee}
body{margin:0;font-family:Arial;background:var(--bg);display:flex;justify-content:center;padding:20px}
.app{width:540px;background:var(--card);border-radius:18px;padding:16px}
.header{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px}
.title{text-align:center;font-weight:bold;font-size:18px;grid-column:1/4}
.palette{width:22px;height:22px;border-radius:50%;border:2px solid #aaa;cursor:pointer;background:linear-gradient(45deg,#ffd6e7,#cce8ff)}
.langToggle{font-size:11px;padding:4px 6px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--btn);border:none;cursor:pointer;font-size:13px}
.tab.active{background:#cce8ff;font-weight:bold}
.hidden{display:none}
button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:12px;cursor:pointer;background:var(--btn)}
.correct{background:#8bc34a;color:#fff}
.wrong{background:#f44336;color:#fff}
.center{text-align:center}

.reading{font-style:italic;color:#666;margin:6px 0;font-size:14px}

.cardWrap{perspective:1000px;display:flex;justify-content:center}
.card{width:100%;max-width:320px;min-height:140px;position:relative;transform-style:preserve-3d;transition:transform .6s ease;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.cardSide{position:absolute;width:100%;height:100%;backface-visibility:hidden;border:1px solid #ddd;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff}
.cardBack{transform:rotateY(180deg)}

.controls{display:flex;gap:10px;margin-top:10px}

.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border-bottom:1px solid #ddd;padding:6px;text-align:left}

.progress{margin:8px 0;font-size:14px;color:#444}
.reset{background:#ff9800;color:#fff}
  /* одинаковая ширина и центрирование для ✔ ✖ Выучено */
.table th:nth-child(4),
.table th:nth-child(5),
.table th:nth-child(6),
.table td:nth-child(4),
.table td:nth-child(5),
.table td:nth-child(6){
  width: 60px;
  text-align: center;
}

/* центрируем чекбокс */
.table td input[type="checkbox"]{
  display: block;
  margin: 0 auto;
}


/* ==== СОПОСТАВЛЕНИЕ ==== */
.matchWrap{display:flex;gap:12px}
.matchCol{flex:1}
.matchBtn{
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  background:#eee;
  cursor:pointer;
}
.matchBtn.active{background:#cce8ff}
.matchBtn.correct{background:#8bc34a;color:#fff}
.matchBtn.wrong{background:#f44336;color:#fff}
  .hidden {
  display: none !important;
  pointer-events: none !important;
}
/* мягкая подсветка выученных слов */
.table tr.learned {
  background: #e8f5e9; /* нежно-зелёный */
}

</style>
</head>

<body>
<div class="app">

<div class="header">
  <div></div>
  <div class="langToggle" onclick="toggleCardLang()">EN</div>
  <div class="palette" onclick="toggleTheme()"></div>
  <div class="title">Words Easy</div>
</div>

<div class="progress" id="progress"></div>
<button class="reset" onclick="resetProgress()">Сбросить прогресс</button>

<div class="tabs">
  <button class="tab active" onclick="openTab('test',this)">Тест</button>
  <button class="tab" onclick="openTab('cards',this)">Карточки</button>
  <button class="tab" onclick="openTab('repeat',this)">Повтор</button>
  <button class="tab" onclick="openTab('input',this)">Ввод</button>
  <button class="tab" onclick="openTab('dict',this)">Словарь</button>
  <button class="tab" onclick="openTab('match',this)">Сопоставление</button>
</div>

<div id="test" class="center">
  <h2 id="word"></h2>
  <div id="reading" class="reading hidden"></div>
  <button onclick="toggleReading()">Показать чтение</button>
  <div id="answers"></div>
</div>

<div id="cards" class="hidden center">
  <div class="cardWrap">
    <div id="card" class="card" onclick="flipCard()">
      <div class="cardSide" id="cardFront"></div>
      <div class="cardSide cardBack" id="cardBack"></div>
    </div>
  </div>
  <div id="cardBtns" class="controls hidden">
    <button class="correct" onclick="()">Знаю</button>
    <button class="wrong" onclick="cardNo()">Не знаю</button>
  </div>
</div>

<div id="repeat" class="hidden center">
  <h3 id="repeatWord"></h3>
  <button class="correct" onclick="repeatYes()">Знаю</button>
  <button class="wrong" onclick="repeatNo()">Не знаю</button>
</div>

<div id="input" class="hidden">

  <h3 id="inputRu"></h3>
  <input id="inputEn" placeholder="Введи английское слово"
    onkeydown="if(event.key==='Enter')checkInput()"
    style="width:100%;padding:10px;border-radius:10px;border:1px solid #ccc">
  <button onclick="checkInput()">Проверить</button>
</div>

<div id="match" class="hidden center">
  <h3>Сопоставь слова</h3>
  <div class="matchWrap">
    <div id="matchEn" class="matchCol"></div>
    <div id="matchRu" class="matchCol"></div>
  </div>
</div>

<div id="dict" class="hidden">
<input
  id="dictSearch"
  placeholder="Поиск (EN / RU / чтение)"
  oninput="renderDict()"
  style="
    width:100%;
    padding:10px;
    margin-bottom:8px;
    border-radius:10px;
    border:1px solid #ccc
  "
>

  <div style="display:flex; gap:6px; margin-bottom:8px">
    <button onclick="setDictFilter('all')">Все</button>
    <button onclick="setDictFilter('unlearned')">Не выученные</button>
    <button onclick="setDictFilter('learned')">Выученные</button>
  </div>

  <button class="correct" onclick="markAllLearned()">
    Отметить всё выученным
  </button>

  <div id="dictTable"></div>
</div>

</div>

<script>
const raw = [
"analyse|анализировать|энэлайз",
"apologise|извиняться|эполоджайз",
"arrive|прибывать|эрайв",
"ask|спрашивать|аск",
"at school|в школе|эт скул",
"begin|начинать|бигин",
"busy|занятый|бизи",
"buy|покупать|бай",
"cheap|дёшево|чип",
"collect|коллекционировать|колэкт",
"confuse|путать|кэнфьюз",
"continue|продолжать|континью",
"cosy|уютный|коузи",
"creative|творческий|криэйтив",
"describe|описывать|дискрáйб",
"drink|пить|дринк",
"eat|есть|ит",
"enough|достаточно|инаф",
"expensive|дорого|икспэнсив",
"explain|объяснять|иксплэйн",
"finish|заканчивать|финиш",
"forget|забывать|фэгэт",
"forgive|прощать|фэгив",
"get back|добираться обратно|гэт бэк",
"get here|добираться сюда|гэт хиэ",
"get home|добираться домой|гэт хоум",
"get there|добираться туда|гэт зэа",
"get to|добираться до|гэт ту",
"hardworking|трудолюбивый|хардворкинг",
"he likes|ему нравится|хи лайкс",
"he needs|ему нужно|хи нидз",
"he’s rich|он богатый|хиз рич",
"here|здесь|хиэ",
"how many|сколько|хау мэни",
"how much|сколько|хау мач",
"how often|как часто|хау офн",
"how regularly|как регулярно|хау рэгьюлэли",
"I like|мне нравится|ай лайк",
"I need|мне нужно|ай нид",
"I’m busy|я занят|айм бизи",
"impossible|невозможно|импосибл",
"interrupt|перебивать|интэрапт",
"it’s cosy|это уютно|итс коузи",
"it’s enough|этого достаточно|итс инаф",
"it’s impossible|это невозможно|итс импосибл",
"it’s possible|это возможно|итс посибл",
"know|знать|ноу",
"patient|терпеливый|пэйшэнт",
"play|играть|плэй",
"poor|бедный|пуа",
"possible|возможно|посибл",
"punctual|пунктуальный|панкчуал",
"read|читать|рид",
"rich|богатый|рич",
"she likes|ей нравится|ши лайкс",
"she needs|ей нужно|ши нидз",
"she’s poor|она бедная|шиз пуа",
"sleep|спать|слиип",
"start|начинать|старт",
"strong|сильный|стронг",
"study|учиться|стади",
"take|брать|тэйк",
"there|там|зэа",
"they like|им нравится|зэй лайк",
"they need|им нужно|зэй нид",
"they’re right|они правы|зэй райт",
"think|думать|синк",
"understand|понимать|андэстэнд",
"use|пользоваться|юз",
"wait|ждать|вэйт",
"weak|слабый|уик",
"we like|нам нравится|уи лайк",
"we need|нам нужно|уи нид",
"we’re right|мы правы|уи райт",
"what|что|вот",
"when|когда|уэн",
"where|где / куда|уэа",
"who|кто / кого|ху",
"why|почему|вай",
"work|работать|вёрк",
"write|писать|райт",
"you like|тебе / вам нравится|ю лайк",
"you need|тебе / вам нужно|ю нид",
"you’re right|ты / вы правы|йо райт"
];

const saved = JSON.parse(localStorage.getItem('words-progress')||'null');
const words = raw.map((s,i)=>{
  const [en,ru,read]=s.split('|');
  const base = { en, ru, read, streak: 0, errors: 0, manualDone: false };
  return saved?.[i] ? { ...base, ...saved[i] } : base;
});


let current=null, cardLang='en';

const w=document.getElementById('word');
const a=document.getElementById('answers');
const r=document.getElementById('reading');
const cf=document.getElementById('cardFront');
const cb=document.getElementById('cardBack');
const card=document.getElementById('card');
const btns=document.getElementById('cardBtns');
const ir=document.getElementById('inputRu');
const ie=document.getElementById('inputEn');
const rw=document.getElementById('repeatWord');
const prog=document.getElementById('progress');

function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}
function save(){localStorage.setItem('words-progress',JSON.stringify(words))}

function updateProgress(){
  const left = words.filter(w => w.streak < 3 && !w.manualDone).length;
  prog.textContent = `Осталось слов: ${left} / ${words.length}`;
}



function pick(){
const pool = words.filter(w => w.streak < 3 && !w.manualDone);

  updateProgress();

  if(!pool.length){
    w.textContent = '🎉 Все слова выучены';
    a.innerHTML = '';
    return;
  }

  current = rnd(pool);
  renderTest();
  renderCard();
  renderInput();
}


function renderTest(){
  w.textContent=current.en;
  r.textContent=current.read;
  r.classList.add('hidden');
  a.innerHTML='';
  let opts=[current.ru];
  while(opts.length<4){
    const x=rnd(words).ru;
    if(!opts.includes(x))opts.push(x);
  }
  opts.sort(()=>Math.random()-0.5).forEach(t=>{
    const b=document.createElement('button');
    b.textContent=t;
    b.onclick=()=>{
      [...a.children].forEach(x=>x.disabled=true);
      if(t===current.ru){b.classList.add('correct');current.streak++}
      else{b.classList.add('wrong');current.streak=0;current.errors++;errors.push(current)}
      save();setTimeout(pick,600);
    };
    a.appendChild(b);
  });
}

function toggleReading(){r.classList.toggle('hidden')}
function renderCard(){card.classList.remove('flipped');cf.textContent=current.en;cb.textContent=current.ru;btns.classList.add('hidden')}
function flipCard(){
  if (document.getElementById('cards').classList.contains('hidden')) return;
  card.classList.toggle('flipped');
  btns.classList.remove('hidden');
}
function cardYes(){
  current.streak++;
  save();
  pick();
  renderCard();   // ← ВАЖНО
}

function cardNo(){
  current.streak = 0;
  current.errors++;
  save();
  pick();
  renderCard();   // ← ВАЖНО
}

function renderInput(){ir.textContent=current.ru;ie.value=''}
function checkInput(){ie.value.toLowerCase()===current.en.toLowerCase()?current.streak++:(current.streak=0,current.errors++);save();pick()}
function renderRepeat(){
  const pool = words.filter(w =>
    w.errors > 0 &&
    w.streak < 3 &&
    !w.manualDone
  );

  if (!pool.length){
    rw.textContent = '🎉 Нет слов для повтора';
    return;
  }

  current = rnd(pool);
  rw.textContent = current.en;
}
function repeatYes(){
  current.streak++;

  // если 1 раза подряд — убираем из повтора
  if (current.streak >= 1) {
    current.errors = 0;
  }

  save();
  renderRepeat();
}


function repeatNo(){
  current.errors++;
  current.streak = 0;
  save();
  renderRepeat();
}

let dictFilter = 'all';
function renderDict(){
const d = document.getElementById('dictTable');
  const q = document
  .getElementById('dictSearch')
  ?.value
  .toLowerCase() || '';
  d.innerHTML = '';

  const t = document.createElement('table');
  t.className = 'table';

  t.innerHTML = `
    <tr>
      <th>№</th>
      <th>EN</th>
      <th>RU</th>
      <th>Чтение</th>
      <th style="text-align:center">✔</th>
      <th style="text-align:center">✖</th>
      <th style="text-align:center">Выучено</th>
    </tr>
  `;

words.forEach((w, i) => {
// фильтр поиска
if (
  q &&
  !(
    w.en.toLowerCase().includes(q) ||
    w.ru.toLowerCase().includes(q) ||
    w.read.toLowerCase().includes(q)
  )
) return;

  if (dictFilter === 'learned' && !w.manualDone && w.streak < 3) return;
  if (dictFilter === 'unlearned' && (w.manualDone || w.streak >= 3)) return;
    const tr = document.createElement('tr');
if (w.manualDone || w.streak >= 3) {
  tr.classList.add('learned');
}

    tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${w.en}</td>
      <td>${w.ru}</td>
      <td><i>${w.read}</i></td>
      <td style="text-align:center">${w.streak}</td>
      <td style="text-align:center">${w.errors}</td>
      <td style="text-align:center">
        <input type="checkbox">
      </td>
    `;

    const checkbox = tr.querySelector('input[type="checkbox"]');
    checkbox.checked = !!w.manualDone;

    checkbox.onclick = () => {
  w.manualDone = checkbox.checked;

  if (w.manualDone) {
    tr.classList.add('learned');
  } else {
    tr.classList.remove('learned');
  }

  save();
  updateProgress();
};


    t.appendChild(tr);
  });

  d.appendChild(t);
}


function openTab(id,b){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['test','cards','repeat','input','dict','match'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='dict')renderDict();
if(id==='repeat')renderRepeat();
  if(id==='match')renderMatch();
}

/* ==== СОПОСТАВЛЕНИЕ ==== */
let matchSelected=null;
function renderMatch(){
  const pool=words.filter(w=>w.streak<3);
  if(pool.length<4)return;
  const set=pool.sort(()=>Math.random()-0.5).slice(0,4);
  const en=document.getElementById('matchEn');
  const ru=document.getElementById('matchRu');
  en.innerHTML='';ru.innerHTML='';matchSelected=null;

  set.forEach(w=>{
    const b=document.createElement('div');
    b.textContent=w.en;b.className='matchBtn';
    b.onclick=()=>{document.querySelectorAll('#matchEn .matchBtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');matchSelected=w};
    en.appendChild(b);
  });

  set.sort(()=>Math.random()-0.5).forEach(w=>{
    const b=document.createElement('div');
    b.textContent=w.ru;b.className='matchBtn';
    b.onclick=()=>{
      if(!matchSelected)return;
      if(w===matchSelected){b.classList.add('correct');matchSelected.streak++;save();setTimeout(renderMatch,600)}
      else{b.classList.add('wrong');matchSelected.streak=0;matchSelected.errors++;save()}
    };
    ru.appendChild(b);
  });
}
  function markAllLearned(){
  if(!confirm('Отметить ВСЕ слова как выученные?')) return;

  words.forEach(w=>{
    w.manualDone = true;
    w.streak = Math.max(w.streak, 3);
  });

  save();
  updateProgress();
  renderDict();
}

function toggleCardLang(){
  cardLang = cardLang === 'en' ? 'ru' : 'en';
  renderCard();
}
function setDictFilter(type){
  dictFilter = type;
  renderDict();
}

function toggleTheme(){
  document.documentElement.style.setProperty('--bg',
    getComputedStyle(document.documentElement).getPropertyValue('--bg')==='#ffd6e7'
    ?'#cce8ff':'#ffd6e7');
}


function resetProgress(){if(confirm('Сбросить прогресс?')){localStorage.removeItem('words-progress');location.reload()}}
  function toggleLearned(i, val){
  words[i].manualDone = val;
  save();
  updateProgress();
}

pick();
</script>
</body>
</html>
