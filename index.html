<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Words Easy</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#f9fbfd; color:#1f3042; }
    .app { max-width:960px; margin:0 auto; padding:16px; }
    .header { text-align:center; margin-bottom:12px; position:relative; }
    .brand-title { font-size:26px; font-weight:800; }
    .corner { position:absolute; top:8px; right:8px; display:flex; gap:10px; align-items:center; }
    .counter { font-size:12px; color:#5c6b7a; }
    .tabs { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:12px 0; }
    .tab-btn { flex:1; min-width:100px; max-width:120px; text-align:center;
      padding:8px 12px; border:1px solid #dde6ef; border-radius:8px; background:#fff; cursor:pointer; }
    .tab-btn.active { background:#58a6ff; color:#fff; }
    .panel { background:#fff; border:1px solid #dde6ef; border-radius:12px; padding:16px; min-height:200px; }
    .card { border:1px solid #dde6ef; border-radius:12px; padding:20px; text-align:center; }
    .muted { color:#5c6b7a; }
    .options { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
    .option { padding:10px; border:1px solid #dde6ef; border-radius:8px; cursor:pointer; }
    .option.correct { background:#e9ffe6; border-color:#34c759; }
    .option.wrong { background:#ffe9e9; border-color:#ff3b30; }
    .grid { display:flex; flex-direction:column; gap:10px; }
    .match-columns { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .field { display:flex; gap:8px; margin-top:12px; }
    input { flex:1; padding:8px; border:1px solid #dde6ef; border-radius:8px; }
    .btn { padding:8px 12px; border-radius:8px; border:1px solid #dde6ef; background:#fff; cursor:pointer; }
    .btn.primary { background:#58a6ff; color:#fff; }
    .btn.success { background:#34c759; color:#fff; }
    .empty { text-align:center; color:#5c6b7a; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand-title">Words Easy</div>
      <div class="corner">
        <div class="counter"><span id="remainingCount">—</span>/<span id="totalCount">—</span></div>
        <label><input type="checkbox" id="themeSwitch"> 🌗</label>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel">Загрузка...</div>
  </div>
    <script>
    const tabs=[{id:'test',label:'Тест'},{id:'cards',label:'Карточки'},{id:'repeat',label:'Повтор'},
                {id:'input',label:'Ввод'},{id:'dict',label:'Словарь'},{id:'match',label:'Сопоставление'}];
    let activeTab='test'; let currentTestWord=null;
    const words=[{id:1,en:'here',ru:'здесь',tr:'хиа',streak:0,errors:0,manual:false},
                 {id:2,en:'think',ru:'думать',tr:'синк',streak:0,errors:0,manual:false},
                 {id:3,en:'read',ru:'читать',tr:'рид',streak:0,errors:0,manual:false},
                 {id:4,en:'play',ru:'играть',tr:'плей',streak:0,errors:0,manual:false}];
    function isLearned(w){return w.streak>=3||w.manual;}
    function getUnlearned(){return words.filter(w=>!isLearned(w));}
    function updateProgress(){document.getElementById('totalCount').textContent=words.length;
      document.getElementById('remainingCount').textContent=getUnlearned().length;}
    function shuffle(a){return a.sort(()=>Math.random()-0.5);}
    function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(t=>
      `<button class="tab-btn${t.id===activeTab?' active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
      document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderPanel();});}
    // --- Тест ---
    function renderTest(){const pool=getUnlearned();if(!pool.length){panel.innerHTML="<div class='empty'>Все слова выучены!</div>";return;}
      if(!currentTestWord)currentTestWord=pool[Math.floor(Math.random()*pool.length)];
      const correct=currentTestWord.ru;const options=shuffle([correct,...shuffle(words.map(w=>w.ru)).slice(0,3)]);
      panel.innerHTML=`<div class="card"><div style="font-size:22px;cursor:pointer" id="word">${currentTestWord.en}</div>
        <div class="muted" id="tr"></div></div><div class="options">${options.map(o=>`<div class="option" data-val="${o}">${o}</div>`).join('')}</div>`;
      document.getElementById('word').onclick=()=>{document.getElementById('tr').textContent=currentTestWord.tr;};
      panel.querySelectorAll('.option').forEach(opt=>opt.onclick=()=>{if(opt.dataset.val===correct){opt.classList.add('correct');currentTestWord.streak++;}
        else{opt.classList.add('wrong');currentTestWord.errors++;currentTestWord.streak=0;}updateProgress();
        setTimeout(()=>{currentTestWord=null;renderTest();},700);});}
    // --- Ввод ---
    let inputIdx=0;function renderInput(){const pool=getUnlearned();if(!pool.length){panel.innerHTML="<div class='empty'>Все слова выучены!</div>";return;}
      const current=pool[inputIdx%pool.length];panel.innerHTML=`<div class="card"><div class="muted">Перевод:</div>
        <div style="font-size:22px">${current.ru}</div></div><div class="field"><input id="inputAnswer" placeholder="Введите английское слово...">
        <button class="btn primary" id="inputCheck">Проверить</button></div><div id="inputFeedback" class="muted"></div>`;
      document.getElementById('inputCheck').onclick=()=>{const val=document.getElementById('inputAnswer').value.trim().toLowerCase();
        if(val===current.en.toLowerCase()){document.getElementById('inputFeedback').textContent="Верно!";current.streak++;}
        else{document.getElementById('inputFeedback').textContent="Неверно. Правильно: "+current.en;current.errors++;current.streak=0;}
        updateProgress();inputIdx++;setTimeout(renderInput,700);};}
    // --- Сопоставление ---
    let matchSet=[];let matchPicked=null;function makeMatchSet(){const pool=getUnlearned();matchSet=shuffle(pool).slice(0,4);}
    function renderMatch(){if(!matchSet.length)makeMatchSet();if(!matchSet.length){panel.innerHTML="<div class='empty'>Нет слов для сопоставления</div>";return;}
      const ens=shuffle(matchSet.map(m=>({type:'en',id:m.id,text:m.en})));const rus=shuffle(matchSet.map(m=>({type:'ru',id:m.id,text:m.ru})));
      panel.innerHTML=`<div class="match-columns"><div><div class="grid">${ens.map(e=>`<div class="option" data-id="${e.id}" data-type="en">${e.text}</div>`).join('')}</div></div>
        <div><div class="grid">${rus.map(r=>`<div class="option" data-id="${r.id}" data-type="ru">${r.text}</div>`).join('')}</div></div></div>`;
          panel.querySelectorAll('.option').forEach(el=>el.onclick=()=>{
        const id=Number(el.dataset.id);
        const type=el.dataset.type;
        if(!matchPicked && type==='en'){
          matchPicked=id;
          el.classList.add('selected');
        } else if(matchPicked && type==='ru'){
          const correct=id===matchPicked;
          const enEl=panel.querySelector(`.option[data-type="en"][data-id="${matchPicked}"]`);
          const ruEl=el;
          if(correct){
            enEl.classList.add('correct');
            ruEl.classList.add('correct');
            const w=words.find(x=>x.id===matchPicked);
            if(w) w.streak++;
            matchSet=matchSet.filter(m=>m.id!==matchPicked);
          } else {
            enEl.classList.add('wrong');
            ruEl.classList.add('wrong');
            const w=words.find(x=>x.id===matchPicked);
            if(w){ w.errors++; w.streak=0; }
          }
          matchPicked=null;
          setTimeout(()=>{ if(!matchSet.length) makeMatchSet(); renderMatch(); },700);
        }
      });
    }

    // --- Словарь (упрощённо) ---
    function renderDict(){
      panel.innerHTML="<div class='card'><b>Словарь</b><br>"+words.map(w=>`${w.en} — ${w.ru}`).join("<br>")+"</div>";
    }

    // --- Карточки и Повтор (упрощённо) ---
    function renderCards(){ panel.innerHTML="<div class='card'>Карточки пока упрощены</div>"; }
    function renderRepeat(){ panel.innerHTML="<div class='card'>Повтор пока упрощён</div>"; }

    // --- Панель ---
    function renderPanel(){
      updateProgress();
      switch(activeTab){
        case 'test': renderTest(); break;
        case 'input': renderInput(); break;
        case 'match': renderMatch(); break;
        case 'dict': renderDict(); break;
        case 'cards': renderCards(); break;
        case 'repeat': renderRepeat(); break;
      }
    }

    // --- Тема ---
    document.getElementById('themeSwitch').onchange=()=>{
      document.body.style.background=document.getElementById('themeSwitch').checked?"#0f1722":"#f9fbfd";
      document.body.style.color=document.getElementById('themeSwitch').checked?"#eaf1f9":"#1f3042";
    };

    // --- Запуск ---
    const panel=document.getElementById('panel');
    renderTabs();
    renderPanel();
    updateProgress();
  </script>
</body>
</html>
