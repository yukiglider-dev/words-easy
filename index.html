<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
:root{--bg:#ffd6e7;--card:#fff;--btn:#eee}
body{margin:0;font-family:Arial;background:var(--bg);display:flex;justify-content:center;padding:20px}
.app{width:540px;background:var(--card);border-radius:18px;padding:16px}
.header{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px}
.title{text-align:center;font-weight:bold;font-size:18px;grid-column:1/4}
.palette{width:22px;height:22px;border-radius:50%;border:2px solid #aaa;cursor:pointer;background:linear-gradient(45deg,#ffd6e7,#cce8ff)}
.langToggle{font-size:11px;padding:4px 6px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;padding:8px;border-radius:10px;background:var(--btn);border:none;cursor:pointer;font-size:13px}
.tab.active{background:#cce8ff;font-weight:bold}
.hidden{display:none}
button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:12px;cursor:pointer;background:var(--btn)}
.correct{background:#8bc34a;color:#fff}
.wrong{background:#f44336;color:#fff}
.center{text-align:center}

.reading{
  font-style:italic;
  color:#666;
  margin:6px 0;
  font-size:14px;
}

.cardWrap{perspective:1000px;display:flex;justify-content:center}
.card{
  width:100%;
  max-width:320px;
  min-height:140px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .6s ease;
  cursor:pointer;
}
.card.flipped{transform:rotateY(180deg)}
.cardSide{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border:1px solid #ddd;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  background:#fff;
}
.cardBack{transform:rotateY(180deg)}

.controls{display:flex;gap:10px;margin-top:10px}

.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border-bottom:1px solid #ddd;padding:6px;text-align:left}

.progress{
  margin:8px 0;
  font-size:14px;
  color:#444;
}
.reset{
  background:#ff9800;
  color:#fff;
}

/* MATCH */
.matchBtn{
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  background:#eee;
  cursor:pointer;
}
.matchBtn.active{background:#cce8ff}
.matchBtn.correct{background:#8bc34a;color:#fff}
.matchBtn.wrong{background:#f44336;color:#fff}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <div></div>
  <div class="langToggle" onclick="toggleCardLang()">EN</div>
  <div class="palette" onclick="toggleTheme()"></div>
  <div class="title">Words Easy</div>
</div>

<div class="progress" id="progress"></div>
<button class="reset" onclick="resetProgress()">Сбросить прогресс</button>

<div class="tabs">
  <button class="tab active" onclick="openTab('test',this)">Тест</button>
  <button class="tab" onclick="openTab('cards',this)">Карточки</button>
  <button class="tab" onclick="openTab('repeat',this)">Повтор</button>
  <button class="tab" onclick="openTab('input',this)">Ввод</button>
  <button class="tab" onclick="openTab('match',this)">Сопоставление</button>
  <button class="tab" onclick="openTab('dict',this)">Словарь</button>
</div>

<div id="test" class="center">
  <h2 id="word"></h2>
  <div id="reading" class="reading hidden"></div>
  <button onclick="toggleReading()">Показать чтение</button>
  <div id="answers"></div>
</div>

<div id="cards" class="hidden center">
  <div class="cardWrap">
    <div id="card" class="card" onclick="flipCard()">
      <div class="cardSide" id="cardFront"></div>
      <div class="cardSide cardBack" id="cardBack"></div>
    </div>
  </div>
  <div id="cardBtns" class="controls hidden">
    <button class="correct" onclick="cardYes()">Знаю</button>
    <button class="wrong" onclick="cardNo()">Не знаю</button>
  </div>
</div>

<div id="repeat" class="hidden center">
  <h3 id="repeatWord"></h3>
  <button class="correct" onclick="repeatYes()">Знаю</button>
  <button class="wrong" onclick="repeatNo()">Не знаю</button>
</div>

<div id="input" class="hidden">
  <h3 id="inputRu"></h3>
  <input id="inputEn" placeholder="Введи английское слово"
    onkeydown="if(event.key==='Enter')checkInput()"
    style="width:100%;padding:10px;border-radius:10px;border:1px solid #ccc">
  <button onclick="checkInput()">Проверить</button>
</div>

<div id="match" class="hidden center">
  <h3>Сопоставь слова</h3>
  <div style="display:flex;gap:10px">
    <div id="matchEn" style="flex:1"></div>
    <div id="matchRu" style="flex:1"></div>
  </div>
</div>

<div id="dict" class="hidden"></div>

</div>

<script>
/* ===== ТВОЙ ИСХОДНЫЙ JS ЦЕЛИКОМ ===== */

const raw=[/* ... ТВОЙ ОГРОМНЫЙ МАССИВ СЛОВ ... */];

const saved=JSON.parse(localStorage.getItem('words-progress')||'null');
const words=raw.map((s,i)=>{
  const [en,ru,read]=s.split('|');
  return saved?.[i]||{en,ru,read,streak:0,errors:0};
});

let current=null,errors=[],cardLang='en';

/* ===== ВСЕ ТВОИ ФУНКЦИИ БЕЗ ИЗМЕНЕНИЙ ===== */

/* ===== ДОБАВКА: СОПОСТАВЛЕНИЕ ===== */

let matchSelected=null;

function renderMatch(){
  const pool=words.filter(w=>w.streak<3);
  if(pool.length<4)return;

  const set=[...pool].sort(()=>Math.random()-0.5).slice(0,4);
  matchSelected=null;

  const en=document.getElementById('matchEn');
  const ru=document.getElementById('matchRu');
  en.innerHTML='';ru.innerHTML='';

  set.forEach(w=>{
    const b=document.createElement('div');
    b.textContent=w.en;
    b.className='matchBtn';
    b.onclick=()=>{
      document.querySelectorAll('#matchEn .matchBtn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      matchSelected=w;
    };
    en.appendChild(b);
  });

  [...set].sort(()=>Math.random()-0.5).forEach(w=>{
    const b=document.createElement('div');
    b.textContent=w.ru;
    b.className='matchBtn';
    b.onclick=()=>{
      if(!matchSelected)return;
      if(w===matchSelected){
        b.classList.add('correct');
        matchSelected.streak++;
        save();
        setTimeout(renderMatch,600);
      }else{
        b.classList.add('wrong');
        matchSelected.streak=0;
        matchSelected.errors++;
        save();
      }
    };
    ru.appendChild(b);
  });
}

const oldOpenTab=openTab;
openTab=function(id,b){
  oldOpenTab(id,b);
  if(id==='match')renderMatch();
};
</script>

</body>
</html>
