<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
:root {
  --bg: #f6f9fc;
  --card: #ffffff;
  --border: #dbe4f0;
  --text: #0f172a;
  --muted: #64748b;
  --accent: #5aa2ff;
  --accent-soft: #e8f1ff;
}

body.dark {
  --bg: #0f172a;
  --card: #020617;
  --border: #1e293b;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --accent: #60a5fa;
  --accent-soft: #0b1220;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: var(--bg);
  color: var(--text);
}

.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

/* HEADER */
.header {
  position: relative;
  text-align: center;
  margin-bottom: 20px;
}

.brand-title {
  font-size: 28px;
  font-weight: 800;
}

.header-mini {
  position: absolute;
  right: 0;
  top: 0;
  display: flex;
  gap: 8px;
}

.mini-counter,
.mini-theme {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 14px;
  cursor: default;
}

.mini-theme {
  cursor: pointer;
}

/* TABS */
.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 16px;
}

.tab {
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  font-weight: 600;
}

.tab.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* PANEL */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  min-height: 300px;
  box-shadow: 0 20px 40px rgba(0,0,0,.06);
}

/* COMMON */
.card {
  text-align: center;
}

.word {
  font-size: 28px;
  font-weight: 800;
  cursor: pointer;
}

.muted {
  color: var(--muted);
  margin-top: 6px;
}

.row {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 16px;
}

button {
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  font-weight: 600;
  cursor: pointer;
}

button.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.option {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}

.options {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(120px,1fr));
  gap: 10px;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div class="brand-title">Words Easy</div>
    <div class="header-mini">
      <div class="mini-counter" id="miniCounter">0 / 0</div>
      <button class="mini-theme" id="miniTheme">🌙</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>

</div>

<script>
/* ---------- DATA ---------- */
let words = JSON.parse(localStorage.getItem('wordsEasyWords')) || [
  { en: 'understand', ru: 'понимать', tr: 'ʌndəˈstænd', errors: 0, streak: 0 },
  { en: 'describe', ru: 'описывать', tr: 'dɪˈskraɪb', errors: 0, streak: 0 },
  { en: 'enough', ru: 'достаточно', tr: 'ɪˈnʌf', errors: 0, streak: 0 }
];

let currentTab = 'test';
let cardIndex = 0;

/* ---------- ELEMENTS ---------- */
const tabsEl = document.getElementById('tabs');
const panelEl = document.getElementById('panel');
const counterEl = document.getElementById('miniCounter');
const themeBtn = document.getElementById('miniTheme');

/* ---------- SAVE ---------- */
function saveState() {
  localStorage.setItem('wordsEasyWords', JSON.stringify(words));
  counterEl.textContent = words.filter(w => w.streak > 0).length + ' / ' + words.length;
}

/* ---------- TABS ---------- */
const tabs = [
  { id: 'test', label: 'Тест' },
  { id: 'cards', label: 'Карточки' },
  { id: 'repeat', label: 'Повтор' },
  { id: 'input', label: 'Ввод' },
  { id: 'dict', label: 'Словарь' },
  { id: 'match', label: 'Сопоставление' }
];

tabs.forEach(t => {
  const el = document.createElement('div');
  el.className = 'tab';
  el.textContent = t.label;
  el.onclick = () => switchTab(t.id);
  el.dataset.id = t.id;
  tabsEl.appendChild(el);
});

/* ---------- SWITCH ---------- */
function switchTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.id === id)
  );

  if (id === 'test') renderTest();
  if (id === 'cards') renderCards();
  if (id === 'repeat') panelEl.innerHTML = '<div class="muted">Повтор</div>';
  if (id === 'input') panelEl.innerHTML = '<div class="muted">Ввод</div>';
  if (id === 'dict') renderDict();
  if (id === 'match') panelEl.innerHTML = '<div class="muted">Сопоставление</div>';
}

/* ---------- TEST ---------- */
function renderTest() {
  if (!words.length) {
    panelEl.innerHTML = '<div class="muted">Нет слов</div>';
    return;
  }

  const current = words[Math.floor(Math.random() * words.length)];
  const options = [...words].sort(() => .5 - Math.random()).slice(0, 4);
  if (!options.includes(current)) options[0] = current;

  panelEl.innerHTML = `
    <div class="card">
      <div class="word" id="testWord">${current.en}</div>
      <div class="muted" id="testTr" style="display:none">/${current.tr}/</div>
    </div>

    <div class="options">
      ${options.map(o => `<div class="option" data-val="${o.ru}">${o.ru}</div>`).join('')}
    </div>
  `;

  document.getElementById('testWord').onclick = () => {
    document.getElementById('testTr').style.display =
      document.getElementById('testTr').style.display === 'none' ? 'block' : 'none';
  };

  document.querySelectorAll('.option').forEach(opt => {
    opt.onclick = () => {
      if (opt.dataset.val === current.ru) current.streak++;
      else current.errors++;
      saveState();
      renderTest();
    };
  });
}

/* ---------- CARDS ---------- */
function renderCards() {
  if (!words.length) {
    panelEl.innerHTML = '<div class="muted">Нет слов</div>';
    return;
  }

  const current = words[cardIndex];

  panelEl.innerHTML = `
    <div class="card">
      <div class="word">${current.en}</div>
      <div class="muted">${current.ru}</div>
    </div>

    <div class="row">
      <button id="dontKnow">Не знаю</button>
      <button id="know" class="primary">Знаю</button>
    </div>
  `;

  document.getElementById('dontKnow').onclick = () => {
    current.errors++;
    current.streak = 0;
    saveState();
    cardIndex = (cardIndex + 1) % words.length;
    renderCards();
  };

  document.getElementById('know').onclick = () => {
    current.streak++;
    saveState();
    cardIndex = (cardIndex + 1) % words.length;
    renderCards();
  };
}

/* ---------- DICT ---------- */
function renderDict() {
  panelEl.innerHTML = words.map(w =>
    `<div class="row" style="justify-content:space-between">
      <div>${w.en} — ${w.ru}</div>
      <div class="muted">${w.streak}</div>
    </div>`
  ).join('');
}

/* ---------- THEME ---------- */
themeBtn.onclick = () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('wordsEasyTheme',
    document.body.classList.contains('dark') ? 'dark' : 'light'
  );
};

if (localStorage.getItem('wordsEasyTheme') === 'dark') {
  document.body.classList.add('dark');
}

/* ---------- INIT ---------- */
saveState();
switchTab('test');
</script>
</body>
</html>
