<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Words Easy</title>

<style>
:root{
  --bg:#f6e6ef;
  --card:#fff;
  --primary:#e75480;
}
[data-theme="blue"]{
  --bg:#e6f2ff;
  --primary:#4aa3df;
}
*{box-sizing:border-box;font-family:system-ui}
body{
  margin:0;
  background:var(--bg);
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:420px;
  padding:10px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.tabs{
  display:flex;
  gap:5px;
  margin:10px 0;
}
.tabs button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:10px;
  background:#ddd;
}
.tabs button.active{
  background:var(--primary);
  color:#fff;
}
.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}
.answers button,.action-btn{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:12px;
  transition:.3s;
}
.green{background:#8bc34a;color:#fff}
.red{background:#f44336;color:#fff}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid #ccc}
.flip{perspective:1000px}
.flip-inner{
  transition:.6s;
  transform-style:preserve-3d;
}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.side{backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.small{font-size:14px;opacity:.7;margin-top:6px}
.example{font-style:italic;margin-top:10px}
</style>
</head>

<body>
<div class="app">
<header>
  <strong>Words Easy</strong>
  <span onclick="toggleTheme()" style="cursor:pointer">🎨</span>
</header>

<div class="tabs">
  <button onclick="tab('test')">Тест</button>
  <button onclick="tab('cards')">Карточки</button>
  <button onclick="tab('repeat')">Повтор</button>
  <button onclick="tab('input')">Ввод</button>
  <button onclick="tab('dict')">Словарь</button>
</div>

<div id="content"></div>
</div>

<script>
const baseWords=[
{en:"here",ru:"здесь",tr:"хиэ",ex:"Come here."},
{en:"there",ru:"там",tr:"зэа",ex:"I live there."},
{en:"eat",ru:"есть",tr:"ит",ex:"I eat breakfast."},
{en:"drink",ru:"пить",tr:"дринк",ex:"Drink water."},
{en:"sleep",ru:"спать",tr:"слип",ex:"I sleep well."},
{en:"read",ru:"читать",tr:"рид",ex:"Read books."},
{en:"write",ru:"писать",tr:"райт",ex:"Write a letter."},
{en:"work",ru:"работать",tr:"вёрк",ex:"I work here."},
{en:"study",ru:"учиться",tr:"стади",ex:"Study English."},
{en:"busy",ru:"занятый",tr:"бизи",ex:"I am busy."}
];

let words=JSON.parse(localStorage.getItem("words"))||
baseWords.map(w=>({...w,ok:0,fail:0,streak:0,learned:false}));

function save(){localStorage.setItem("words",JSON.stringify(words))}

let tabName="test";

function activeWords(){
 return words.filter(w=>!w.learned);
}

function pick(){
 return activeWords()
 .sort((a,b)=>(b.fail-b.ok)-(a.fail-a.ok))[0];
}

function tab(t){
 tabName=t;
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
 [...document.querySelectorAll(".tabs button")]
  .find(b=>b.textContent.toLowerCase().includes(t))
  .classList.add("active");
 render();
}

function render(){
 const c=document.getElementById("content");
 const w=pick();

 if(tabName==="test"){
  if(!w){c.innerHTML="<div class='card'>Все слова выучены ⭐</div>";return}
  const opts=[w.ru,...activeWords().sort(()=>.5-Math.random()).slice(0,3).map(x=>x.ru)]
  .sort(()=>.5-Math.random());

  c.innerHTML=`<div class="card">
    <h2>${w.en}</h2>
    <button onclick="toggleTr(this)">Показать чтение</button>
    <div class="small" style="display:none">${w.tr}</div>
    <div class="answers">
      ${opts.map(o=>`<button onclick="answer(this,'${o}','${w.ru}')">${o}</button>`).join("")}
    </div>
  </div>`;
 }

 if(tabName==="cards"){
  if(!w){c.innerHTML="<div class='card'>Все слова выучены ⭐</div>";return}
  c.innerHTML=`<div class="flip" onclick="this.classList.toggle('flipped')">
    <div class="flip-inner card">
      <div class="side"><h2>${w.en}</h2></div>
      <div class="side back">
        <h2>${w.ru}</h2>
        <div class="example">${w.ex||""}</div>
        <button class="green action-btn" onclick="know(event)">Знаю</button>
        <button class="red action-btn" onclick="dont(event)">Не знаю</button>
      </div>
    </div>
  </div>`;
 }

 if(tabName==="repeat"){
  const hard=activeWords().filter(x=>x.fail>0);
  if(!hard.length){c.innerHTML="<div class='card'>Ошибок нет 🎉</div>";return}
  c.innerHTML=`<div class="card">
    <h2>${hard[0].en}</h2>
    <button class="green" onclick="know()">Знаю</button>
    <button class="red" onclick="dont()">Не знаю</button>
  </div>`;
 }

 if(tabName==="input"){
  if(!w){c.innerHTML="<div class='card'>Все слова выучены ⭐</div>";return}
  c.innerHTML=`<div class="card">
    <h3>${w.ru}</h3>
    <input id="inp" style="width:100%;padding:10px;border-radius:10px">
    <button onclick="check('${w.en}')">Проверить</button>
  </div>`;
 }

 if(tabName==="dict"){
  c.innerHTML=`<div class="card"><table>
    <tr><th>#</th><th>EN</th><th>RU</th><th>Чтение</th></tr>
    ${words.sort((a,b)=>a.en.localeCompare(b.en))
      .map((x,i)=>`<tr>
        <td>${i+1}</td>
        <td>${x.en}${x.learned?" ⭐":""}</td>
        <td>${x.ru}</td>
        <td>${x.tr}</td>
      </tr>`).join("")}
  </table></div>`;
 }
}

function answer(btn,a,r){
 const w=words.find(x=>x.ru===r);
 const buttons=btn.parentElement.querySelectorAll("button");
 buttons.forEach(b=>b.disabled=true);

 if(a===r){
  btn.classList.add("green");
  w.ok++; w.streak++;
  if(w.streak>=3) w.learned=true;
 }else{
  btn.classList.add("red");
  w.fail++; w.streak=0;
 }

 save();
 setTimeout(render,700);
}

function toggleTr(b){
 const d=b.nextElementSibling;
 d.style.display=d.style.display==="none"?"block":"none";
 b.textContent=d.style.display==="none"?"Показать чтение":"Скрыть";
}

function know(e){
 if(e)e.stopPropagation();
 const w=pick();
 w.ok++; w.streak++;
 if(w.streak>=3) w.learned=true;
 save(); render();
}

function dont(e){
 if(e)e.stopPropagation();
 const w=pick();
 w.fail++; w.streak=0;
 save(); render();
}

function check(en){
 const v=document.getElementById("inp").value.trim().toLowerCase();
 const w=words.find(x=>x.en===en);
 if(v===en){
  w.ok++; w.streak++;
  if(w.streak>=3) w.learned=true;
 }else{
  w.fail++; w.streak=0;
 }
 save(); render();
}

function toggleTheme(){
 document.body.dataset.theme=
  document.body.dataset.theme==="blue"?"":"blue";
}

tab("test");
</script>
</body>
</html>
