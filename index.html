<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #cceeff;
    padding: 20px;
    max-width: 500px;
    margin: auto;
  }

  h1 {
    text-align: center;
  }

  select, input, button {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    font-size: 16px;
    border-radius: 12px;
    border: none;
  }

  button {
    cursor: pointer;
    background: white;
    transition: background 0.3s;
  }

  button.correct {
    background: #7CFC98;
  }

  button.wrong {
    background: #FF7F7F;
  }

  .answers button {
    margin-top: 5px;
  }

  #reading {
    text-align: center;
    font-style: italic;
    margin-top: 10px;
  }

  .stats {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>📘 Words Easy</h1>

<select id="mode">
  <option value="en-ru">ENG → RU</option>
  <option value="ru-en">RU → ENG</option>
</select>

<h3 id="question">Загрузка...</h3>
<div class="answers" id="answers"></div>

<button onclick="showReading()">👂 Показать чтение</button>
<p id="reading"></p>

<div class="stats">
  ✅ <span id="correct">0</span> |
  ❌ <span id="wrong">0</span>
</div>

<script>
let words = {
  "I": { ru: "я", read: "ай" },
  "you": { ru: "ты / вы", read: "ю" },
  "we": { ru: "мы", read: "ви" },
  "they": { ru: "они", read: "зэй" },
  "he": { ru: "он", read: "хи" },
  "she": { ru: "она", read: "ши" },
  "it": { ru: "это", read: "ит" },

  "here": { ru: "здесь", read: "хиэ" },
  "there": { ru: "там", read: "зэа" },
  "at school": { ru: "в школе", read: "эт скул" },

  "understand": { ru: "понимать", read: "андэстэнд" },
  "know": { ru: "знать", read: "ноу" },
  "eat": { ru: "есть", read: "ит" },
  "drink": { ru: "пить", read: "дринк" },
  "sleep": { ru: "спать", read: "слип" },
  "ask": { ru: "спрашивать", read: "аск" },
  "read": { ru: "читать", read: "рид" },
  "write": { ru: "писать", read: "райт" },
  "think": { ru: "думать", read: "синк" },
  "wait": { ru: "ждать", read: "вэйт" },
  "buy": { ru: "покупать", read: "бай" },
  "play": { ru: "играть", read: "плэй" },
  "want": { ru: "хотеть", read: "вонт" },

  "I'm busy": { ru: "я занят", read: "айм бизи" },
  "you're right": { ru: "ты прав", read: "йо райт" },

  "why": { ru: "почему", read: "уай" },
  "where": { ru: "где", read: "уэа" },
  "what": { ru: "что", read: "уот" }
};

let stats = { correct: 0, wrong: 0 };
let currentWord = "";
let correctAnswer = "";
let locked = false;

function nextQuestion() {
  locked = false;
  document.getElementById("reading").innerText = "";

  const keys = Object.keys(words);
  currentWord = keys[Math.floor(Math.random() * keys.length)];
  const mode = document.getElementById("mode").value;

  let answersPool;

  if (mode === "en-ru") {
    document.getElementById("question").innerText =
      `Переведи: ${currentWord}`;
    correctAnswer = words[currentWord].ru;
    answersPool = keys.map(k => words[k].ru);
  } else {
    document.getElementById("question").innerText =
      `Переведи: ${words[currentWord].ru}`;
    correctAnswer = currentWord;
    answersPool = keys;
  }

  let variants = answersPool
    .filter(a => a !== correctAnswer)
    .sort(() => Math.random() - 0.5)
    .slice(0, 3);

  variants.push(correctAnswer);
  variants.sort(() => Math.random() - 0.5);

  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  variants.forEach(v => {
    const btn = document.createElement("button");
    btn.innerText = v;
    btn.onclick = () => checkAnswer(btn, v);
    answersDiv.appendChild(btn);
  });
}

function checkAnswer(button, answer) {
  if (locked) return;
  locked = true;

  if (answer === correctAnswer) {
    button.classList.add("correct");
    stats.correct++;
  } else {
    button.classList.add("wrong");
    stats.wrong++;

    [...document.querySelectorAll(".answers button")].forEach(b => {
      if (b.innerText === correctAnswer) {
        b.classList.add("correct");
      }
    });
  }

  document.getElementById("correct").innerText = stats.correct;
  document.getElementById("wrong").innerText = stats.wrong;

  setTimeout(nextQuestion, 1200);
}

function showReading() {
  if (!currentWord) return;
  document.getElementById("reading").innerText =
    "Чтение: " + words[currentWord].read;
}

nextQuestion();
</script>

</body>
</html>
