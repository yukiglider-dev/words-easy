<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
:root {
  --bg: #ffe6f0;
  --card: #ffffff;
  --accent: #ff9acb;
  --correct: #9dffb0;
  --wrong: #ff9a9a;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
  margin: 10px 0;
}

.progress {
  height: 12px;
  background: #ffd1e6;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
}
.progress div {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.5s;
}

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 15px;
  margin-top: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  animation: fade 0.4s;
}

@keyframes fade {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

button, input, select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
}

button {
  background: var(--accent);
  color: white;
  cursor: pointer;
}

.answers button {
  background: #fff;
  color: #000;
}

.correct { background: var(--correct) !important; }
.wrong { background: var(--wrong) !important; }

.hidden { display: none; }

.small {
  font-size: 14px;
  text-align: center;
  margin-top: 6px;
}

.dictionary-row {
  border-bottom: 1px solid #ddd;
  padding: 6px 0;
}

.badge {
  background: gold;
  padding: 4px 8px;
  border-radius: 10px;
  font-size: 12px;
}
</style>
</head>

<body>

<h1>🌸 Words Easy</h1>

<div class="progress"><div id="progressBar"></div></div>
<div class="small" id="streak"></div>

<select id="mode">
  <option value="test">🎯 Тест</option>
  <option value="cards">🃏 Карточки</option>
  <option value="input">⌨️ Ввод</option>
</select>

<div class="card" id="game">
  <h3 id="question"></h3>
  <div id="answers" class="answers"></div>
  <input id="textInput" class="hidden" placeholder="Введи ответ">
  <button onclick="speak()">🔊 Озвучить</button>
  <button onclick="showReading()">👂 Показать чтение</button>
  <div class="small" id="reading"></div>
</div>

<button onclick="toggleDict()">📖 Словарь</button>

<div id="dict" class="card hidden"></div>

<script>
const words = {

"here":["здесь","хиэ"],"there":["там","зэа"],"at school":["в школе","эт скул"],

"understand":["понимать","андэстэнд"],"know":["знать","ноу"],"eat":["есть","ит"],
"drink":["пить","дринк"],"sleep":["спать","слип"],"ask":["спрашивать","аск"],
"read":["читать","рид"],"write":["писать","райт"],"describe":["описывать","дискрáйб"],
"analyse":["анализировать","энэлайз"],"think":["думать","синк"],"wait":["ждать","вэйт"],
"buy":["покупать","бай"],"play":["играть","плэй"],"want":["хотеть","вонт"],
"explain":["объяснять","иксплэйн"],"study":["учиться","стади"],"work":["работать","вёрк"],
"take":["брать","тэйк"],"arrive":["прибывать","эрайв"],"interrupt":["перебивать","интэрапт"],

"I need":["мне нужно","ай нид"],"you need":["тебе нужно","ю нид"],
"we need":["нам нужно","ви нид"],"they need":["им нужно","зэй нид"],
"he needs":["ему нужно","хи нидз"],"she needs":["ей нужно","ши нидз"],

"I like":["мне нравится","ай лайк"],"you like":["тебе нравится","ю лайк"],
"we like":["нам нравится","ви лайк"],"they like":["им нравится","зэй лайк"],
"he likes":["ему нравится","хи лайкс"],"she likes":["ей нравится","ши лайкс"],

"use":["пользоваться","юз"],"collect":["коллекционировать","кэлэкт"],
"confuse":["путать","конфьюз"],"apologise":["извиняться","эполоджайз"],
"forgive":["прощать","фогив"],"forget":["забывать","фогэт"],

"start":["начинать","старт"],"begin":["начинать","бигин"],
"continue":["продолжать","континью"],"finish":["заканчивать","финиш"],

"busy":["занятый","бизи"],"cosy":["уютный","коузи"],"enough":["достаточно","инаф"],
"rich":["богатый","рич"],"poor":["бедный","пуа"],
"possible":["возможно","поссибл"],"impossible":["невозможно","импоссибл"],

"I'm busy":["я занят","айм бизи"],"it's cosy":["это уютно","итс коузи"],
"it's enough":["этого достаточно","итс инаф"],
"he's rich":["он богат","хиз рич"],"she's poor":["она бедная","шиз пуа"],
"it's possible":["это возможно","итс поссибл"],
"it's impossible":["это невозможно","итс импоссибл"],

"you're right":["ты прав","йо райт"],"we're right":["мы правы","вир райт"],
"they're right":["они правы","зэйр райт"],

"why":["почему","уай"],"who":["кто","ху"],"where":["где","уэа"],
"what":["что","уот"],"when":["когда","уэн"],
"how often":["как часто","хау офэн"],"how regularly":["как регулярно","хау рэгьюлэли"],
"how many":["сколько","хау мэни"],"how much":["сколько","хау мач"],

"get to":["добираться","гет ту"],"get home":["домой","гет хоум"],
"get there":["туда","гет зэа"],"get here":["сюда","гет хиэ"],
"get back":["обратно","гет бэк"],

"expensive":["дорого","икспэнсив"],"cheap":["дёшево","чип"],
"strong":["сильный","стронг"],"weak":["слабый","уик"],
"creative":["творческий","криэйтив"],"hardworking":["трудолюбивый","хардвёркинг"],
"patient":["терпеливый","пэйшент"],"punctual":["пунктуальный","панкчуал"]
};

let stats = JSON.parse(localStorage.getItem("stats")) || {};
let errors = JSON.parse(localStorage.getItem("errors")) || [];
let learned = JSON.parse(localStorage.getItem("learned")) || [];
let streak = JSON.parse(localStorage.getItem("streak")) || {day:null,count:0};

Object.keys(words).forEach(w=>{
  if(!stats[w]) stats[w]={ok:0,bad:0};
});

let current = "";

function save() {
  localStorage.setItem("stats",JSON.stringify(stats));
  localStorage.setItem("errors",JSON.stringify(errors));
  localStorage.setItem("learned",JSON.stringify(learned));
  localStorage.setItem("streak",JSON.stringify(streak));
}

function updateStreak() {
  const today = new Date().toDateString();
  if(streak.day!==today){
    if(streak.day && (new Date(today)-new Date(streak.day))===86400000){
      streak.count++;
    } else streak.count=1;
    streak.day=today;
  }
  streakEl.innerText = "🔥 Серия: "+streak.count+" дней";
  save();
}

function next() {
  reading.innerText="";
  answers.innerHTML="";
  textInput.classList.add("hidden");

  const pool = errors.length?errors:Object.keys(words);
  current = pool[Math.floor(Math.random()*pool.length)];

  question.innerText = current;
  if(mode.value==="test"){
    let opts = Object.values(words).map(v=>v[0]).filter(v=>v!==words[current][0]);
    opts = opts.sort(()=>Math.random()-0.5).slice(0,3);
    opts.push(words[current][0]);
    opts.sort(()=>Math.random()-0.5);
    opts.forEach(o=>{
      const b=document.createElement("button");
      b.innerText=o;
      b.onclick=()=>check(o,b);
      answers.appendChild(b);
    });
  }
  if(mode.value==="cards"){
    answers.innerHTML="<button onclick='flip()'>Показать</button>";
  }
  if(mode.value==="input"){
    textInput.classList.remove("hidden");
    textInput.value="";
    textInput.onkeydown=e=>{if(e.key==="Enter")check(textInput.value)};
  }
  updateProgress();
}

function check(ans,btn){
  if(ans===words[current][0]){
    stats[current].ok++;
    if(stats[current].ok>=3 && !learned.includes(current)) learned.push(current);
    errors=errors.filter(e=>e!==current);
    if(btn) btn.classList.add("correct");
  } else {
    stats[current].bad++;
    if(!errors.includes(current)) errors.push(current);
    if(btn) btn.classList.add("wrong");
  }
  save();
  setTimeout(next,900);
}

function flip(){
  answers.innerHTML="<div>"+words[current][0]+"</div>";
}

function speak(){
  speechSynthesis.speak(new SpeechSynthesisUtterance(current));
}

function showReading(){
  reading.innerText="Чтение: "+words[current][1];
}

function toggleDict(){
  dict.classList.toggle("hidden");
  dict.innerHTML=Object.keys(words).map(w=>`
    <div class="dictionary-row">
      <b>${w}</b> — ${words[w][0]} (${words[w][1]})
      ${learned.includes(w)?"<span class='badge'>⭐</span>":""}
      ✅${stats[w].ok} ❌${stats[w].bad}
    </div>
  `).join("");
}

function updateProgress(){
  const total=Object.keys(words).length;
  progressBar.style.width=(learned.length/total*100)+"%";
}

const question=document.getElementById("question");
const answers=document.getElementById("answers");
const reading=document.getElementById("reading");
const dict=document.getElementById("dict");
const mode=document.getElementById("mode");
const progressBar=document.getElementById("progressBar");
const textInput=document.getElementById("textInput");
const streakEl=document.getElementById("streak");

updateStreak();
next();
</script>

</body>
</html>
