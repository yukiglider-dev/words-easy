<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Words Easy</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f9fbfd;
      color: #1f3042;
    }
    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }
    .header {
      text-align: center; /* название по центру */
      margin-bottom: 16px;
    }
    .brand-title {
      font-size: 24px;
      font-weight: bold;
    }
    .progress {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
    }
    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 10px 16px;
      border: 1px solid #dde6ef;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #58a6ff;
      color: white;
    }
    .panel {
      background: white;
      border: 1px solid #dde6ef;
      border-radius: 12px;
      padding: 16px;
      min-height: 200px;
    }
    .option {
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #dde6ef;
      border-radius: 8px;
      cursor: pointer;
    }
    .option.correct {
      background: #e9ffe6;
      border-color: #34c759;
    }
    .option.wrong {
      background: #ffe9e9;
      border-color: #ff3b30;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }
    .btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #dde6ef;
      background: white;
      cursor: pointer;
    }
    .btn.primary {
      background: #58a6ff;
      color: white;
    }
    .btn.error {
      background: #ff3b30;
      color: white;
    }
    .btn.success {
      background: #34c759;
      color: white;
    }
    .muted {
      color: #5c6b7a;
    }
    .options {
      display: flex;
      flex-direction: column; /* теперь 4 строки */
      gap: 8px;
      margin-top: 12px;
    }
    .grid {
      display: flex;
      flex-direction: column; /* две колонки */
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand-title">Words Easy</div>
      <div class="progress">
        <div>Осталось к изучению: <span id="remainingCount">—</span></div>
        <div>Всего слов: <span id="totalCount">—</span></div>
      </div>
      <div class="controls">
        <button class="btn" id="toggleTranscription" style="display:none">Показать транскрипцию</button>
        <button class="btn" id="themeSwitch">Переключить тему</button>
        <button class="btn error" id="resetAll">Полный сброс</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel">Загрузка...</div>
  </div>
  <script>
    const tabs = [
      { id: 'test', label: 'Тест' },
      { id: 'cards', label: 'Карточки' },
      { id: 'repeat', label: 'Повтор' },
      { id: 'input', label: 'Ввод' },
      { id: 'dict', label: 'Словарь' },
      { id: 'match', label: 'Сопоставление' },
    ];
    let activeTab = 'test';
    let showTr = false;
    let currentTestWord = null;

    const words = [
      { en: 'here', ru: 'здесь', tr: 'хиа' },
      { en: 'there', ru: 'там', tr: 'зэа' },
      { en: 'at school', ru: 'в школе', tr: 'эт скул' },
      { en: 'understand', ru: 'понимать', tr: 'андэстэнд' },
      { en: 'know', ru: 'знать', tr: 'ноу' },
      { en: 'eat', ru: 'есть', tr: 'ит' },
      { en: 'drink', ru: 'пить', tr: 'дринк' },
      { en: 'sleep', ru: 'спать', tr: 'слип' },
      { en: 'ask', ru: 'спрашивать', tr: 'аск' },
      { en: 'read', ru: 'читать', tr: 'рид' },
      { en: 'write', ru: 'писать', tr: 'райт' },
      { en: 'think', ru: 'думать', tr: 'синк' }
    ];
    document.getElementById("totalCount").textContent = words.length;
    document.getElementById("remainingCount").textContent = words.length;
    document.getElementById("tabs").innerHTML = tabs.map(t =>
      `<button class="tab-btn${t.id === activeTab ? ' active' : ''}" data-tab="${t.id}">${t.label}</button>`
    ).join('');
  </script>
</body>
</html>
