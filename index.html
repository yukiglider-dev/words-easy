<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Words Easy</title>
  <style>
    :root {
      --bg: #f9fbfd;
      --surface: #ffffff;
      --text: #1f3042;
      --muted: #5c6b7a;
      --primary: #58a6ff;
      --success: #34c759;
      --error: #ff3b30;
      --accent-1: #e6f2ff;
      --accent-2: #e9ffe6;
      --accent-3: #ffe9e9;
      --border: #dde6ef;
      --card-radius: 14px;
      --btn-radius: 12px;
      --shadow: 0 8px 24px rgba(31,48,66,0.08);
    }
    [data-theme="dark"] {
      --bg: #0f1722;
      --surface: #152233;
      --text: #eaf1f9;
      --muted: #b3c0cc;
      --success: #35d27f;
      --error: #ff6b5e;
      --accent-1: #152a40;
      --accent-2: #163024;
      --accent-3: #3a1f1f;
      --border: #233244;
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
      margin: 0;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .brand-title {
      font-weight: 800;
      letter-spacing: 0.3px;
      font-size: 26px;
    }

    .progress {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      padding: 12px 16px;
      margin: 10px auto;
      max-width: 900px;
    }

    .progress-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-label { color: var(--muted); font-size: 13px; }
    .progress-value { font-weight: 700; font-size: 16px; }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }
    button, .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--btn-radius);
      cursor: pointer;
      transition: transform 0.05s ease, background 0.2s ease, border-color 0.2s ease;
      box-shadow: var(--shadow);
      font-weight: 600;
    }
    button:hover, .btn:hover { transform: translateY(-1px); }
    button.primary { background: var(--primary); color: #fff; border-color: transparent; }
    button.success { background: var(--success); color: #fff; border-color: transparent; }
    button.error { background: var(--error); color: #fff; border-color: transparent; }

    .tabs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0;
    }

    .tabs {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      padding: 16px;
      min-height: 220px;
    }

    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .muted { color: var(--muted); }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }

    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      min-width: 260px;
      min-height: 120px;
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }

    .card .empty {
      align-content: center;
    }

    .test-transcription {
      margin-top: 6px;
      margin-bottom: 10px;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .test-transcription.show {
      opacity: 1;
      pointer-events: auto;
    }

    .test-word {
      cursor: pointer;
      padding: 40px 0px 20px 0px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .option {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      text-align: center;
      box-shadow: var(--shadow);
      user-select: none;
    }
    .option.correct { background: var(--accent-2); border-color: var(--success); }
    .option.wrong { background: var(--accent-3); border-color: var(--error); }
    .option.selected { outline: 2px solid var(--primary); }

    .flip {
      perspective: 800px;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }
    .flip-inner {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }
    .flipped .flip-inner { transform: rotateY(180deg); }
    .flip-face {
      position: absolute;
      width: 100%;
      backface-visibility: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: var(--shadow);
      min-height: 140px;
      display: grid;
      place-items: center;
    }
    .flip-back { transform: rotateY(180deg); background: var(--accent-1); }

    .match-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field { display: flex; gap: 8px; align-items: center; }
    input[type="text"], select, textarea {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      width: 100%;
    }
    
    textarea {
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }

    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px; text-align: left; }
    th.center, td.center { text-align: center; }
    tr.learned-row { background: rgba(52,199,89,0.10); }

    .pill {
      font-size: 12px;
      color: var(--muted);
      background: var(--accent-1);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
    }
    .empty { text-align: center; color: var(--muted); padding: 20px; }
    
    .mini-ui.inline {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    .mini-counter {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-weight: 700;
      color: var(--muted);
    }

    .mini-theme {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      box-shadow: var(--shadow);
    }

    .tabs {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      padding: 16px;
      min-height: 220px;
    }

    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .muted { color: var(--muted); }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }

    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      min-width: 260px;
      min-height: 120px;
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }

    .card .empty {
      align-content: center;
    }

    .test-transcription {
      margin-top: 6px;
      margin-bottom: 10px;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .test-transcription.show {
      opacity: 1;
      pointer-events: auto;
    }

    .test-word {
      cursor: pointer;
      padding: 40px 0px 20px 0px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .option {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      text-align: center;
      box-shadow: var(--shadow);
      user-select: none;
    }
    .option.correct { background: var(--accent-2); border-color: var(--success); }
    .option.wrong { background: var(--accent-3); border-color: var(--error); }
    .option.selected { outline: 2px solid var(--primary); }
    
    .import-section {
      background: var(--accent-1);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .import-section h3 {
      margin: 0 0 12px 0;
      font-size: 18px;
    }
    
    .import-section p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 12px 0;
    }
    
    .file-input-wrapper {
      position: relative;
      display: inline-block;
    }
    
    input[type="file"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .file-input-label {
      display: inline-block;
      padding: 10px 14px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--btn-radius);
      cursor: pointer;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: transform 0.05s ease;
    }
    
    .file-input-label:hover {
      transform: translateY(-1px);
    }
    
    @media (max-width: 640px) {
      .match-columns { grid-template-columns: 1fr; }
      .progress { flex-direction: column; align-items: center; }
      .tabs-bar {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand-title">Words Easy</div>
    </div>

    <div class="tabs-bar">
      <div class="tabs" id="tabs"></div>

      <div class="mini-ui inline">
        <div class="mini-counter" id="miniCounter">— / —</div>
        <button class="mini-theme" id="miniTheme" title="Сменить тему">🌙</button>
      </div>
    </div>
    <div class="panel" id="panel"></div>
  </div>

  <script>
    // ---------- Data & Storage ----------
    const STORAGE_KEY = 'words_easy_final_v1';
    const SETTINGS_KEY = 'words_easy_settings_final_v1';

    const initialWords = [
      { en: 'here', ru: 'здесь', tr: 'хиа' },
      { en: 'there', ru: 'там', tr: 'зэа' },
      { en: 'at school', ru: 'в школе', tr: 'эт скул' },

      { en: 'understand', ru: 'понимать', tr: 'андэстэнд' },
      { en: 'know', ru: 'знать', tr: 'ноу' },
      { en: 'eat', ru: 'есть', tr: 'ит' },
      { en: 'drink', ru: 'пить', tr: 'дринк' },
      { en: 'sleep', ru: 'спать', tr: 'слип' },
      { en: 'ask', ru: 'спрашивать', tr: 'аск' },
      { en: 'read', ru: 'читать', tr: 'рид' },
      { en: 'write', ru: 'писать', tr: 'райт' },
      { en: 'describe', ru: 'описывать', tr: 'дискрайб' },
      { en: 'analyse', ru: 'анализировать', tr: 'эналайз' },
      { en: 'think', ru: 'думать', tr: 'синк' },
      { en: 'wait', ru: 'ждать', tr: 'вэйт' },
      { en: 'buy', ru: 'покупать', tr: 'бай' },
      { en: 'play', ru: 'играть', tr: 'плей' },
      { en: 'want', ru: 'хотеть', tr: 'вонт' },
      { en: 'explain', ru: 'объяснять', tr: 'иксплейн' },
      { en: 'study', ru: 'учиться', tr: 'стади' },
      { en: 'work', ru: 'работать', tr: 'вёк' },
      { en: 'take', ru: 'брать', tr: 'тэйк' },
      { en: 'arrive', ru: 'прибывать', tr: 'эрайв' },
      { en: 'interrupt', ru: 'перебивать', tr: 'интерапт' },

      { en: 'I need', ru: 'мне нужно', tr: 'ай нид' },
      { en: 'you need', ru: 'тебе / вам нужно', tr: 'ю нид' },
      { en: 'we need', ru: 'нам нужно', tr: 'ви нид' },
      { en: 'they need', ru: 'им нужно', tr: 'зэй нид' },
      { en: 'he needs', ru: 'ему нужно', tr: 'хи нидз' },
      { en: 'she needs', ru: 'ей нужно', tr: 'ши нидз' },

      { en: 'I like', ru: 'мне нравится', tr: 'ай лайк' },
      { en: 'you like', ru: 'тебе / вам нравится', tr: 'ю лайк' },
      { en: 'we like', ru: 'нам нравится', tr: 'ви лайк' },
      { en: 'they like', ru: 'им нравится', tr: 'зэй лайк' },
      { en: 'he likes', ru: 'ему нравится', tr: 'хи лайкс' },
      { en: 'she likes', ru: 'ей нравится', tr: 'ши лайкс' },

      { en: 'use', ru: 'пользоваться', tr: 'юз' },
      { en: 'collect', ru: 'коллекционировать', tr: 'колэкт' },
      { en: 'confuse', ru: 'путать', tr: 'конфьюз' },
      { en: 'apologise', ru: 'извиняться', tr: 'аполоджайз' },
      { en: 'forgive', ru: 'прощать', tr: 'фогив' },
      { en: 'forget', ru: 'забывать', tr: 'фогет' },

      { en: 'start', ru: 'начинать', tr: 'старт' },
      { en: 'begin', ru: 'начинать', tr: 'бигин' },
      { en: 'continue', ru: 'продолжать', tr: 'континью' },
      { en: 'finish', ru: 'заканчивать', tr: 'финиш' },

      { en: 'busy', ru: 'занятый', tr: 'бизи' },
      { en: 'cosy', ru: 'уютный', tr: 'кози' },
      { en: 'enough', ru: 'достаточно', tr: 'инаф' },
      { en: 'rich', ru: 'богатый', tr: 'рич' },
      { en: 'poor', ru: 'бедный', tr: 'пур' },
      { en: 'possible', ru: 'возможно', tr: 'поссибл' },
      { en: 'impossible', ru: 'невозможно', tr: 'импоссибл' },

      { en: 'I'm busy', ru: 'я занят', tr: 'айм бизи' },
      { en: 'it's cosy', ru: 'это уютно', tr: 'итс кози' },
      { en: 'it's enough', ru: 'этого достаточно', tr: 'итс инаф' },
      { en: 'he's rich', ru: 'он богатый', tr: 'хиз рич' },
      { en: 'she's poor', ru: 'она бедная', tr: 'шиз пур' },
      { en: 'it's possible', ru: 'это возможно', tr: 'итс поссибл' },
      { en: 'it's impossible', ru: 'это невозможно', tr: 'итс импоссибл' },

      { en: 'you're right', ru: 'ты / вы правы', tr: 'юр райт' },
      { en: 'we're right', ru: 'мы правы', tr: 'вир райт' },
      { en: 'they're right', ru: 'они правы', tr: 'зэйр райт' },

      { en: 'why', ru: 'почему', tr: 'уай' },
      { en: 'who', ru: 'кто / кого', tr: 'ху' },
      { en: 'where', ru: 'где / куда', tr: 'вэа' },
      { en: 'what', ru: 'что', tr: 'вот' },
      { en: 'when', ru: 'когда', tr: 'вэн' },
      { en: 'how often', ru: 'как часто', tr: 'хау офн' },
      { en: 'how regularly', ru: 'как регулярно', tr: 'хау рэгьюлэли' },
      { en: 'how many', ru: 'сколько', tr: 'хау мэни' },
      { en: 'how much', ru: 'сколько', tr: 'хау мач' },

      { en: 'get to', ru: 'добираться до', tr: 'гет ту' },
      { en: 'get home', ru: 'добираться домой', tr: 'гет хоум' },
      { en: 'get there', ru: 'добираться туда', tr: 'гет зэа' },
      { en: 'get here', ru: 'добираться сюда', tr: 'гет хиа' },
      { en: 'get back', ru: 'добираться обратно', tr: 'гет бэк' },

      { en: 'expensive', ru: 'дорого', tr: 'экспенсив' },
      { en: 'cheap', ru: 'дёшево', tr: 'чип' },
      { en: 'strong', ru: 'сильный', tr: 'стронг' },
      { en: 'weak', ru: 'слабый', tr: 'уик' },
      { en: 'creative', ru: 'творческий', tr: 'криэйтив' },
      { en: 'hardworking', ru: 'трудолюбивый', tr: 'хардворкинг' },
      { en: 'patient', ru: 'терпеливый', tr: 'пэйшент' },
      { en: 'punctual', ru: 'пунктуальный', tr: 'панкчюал' },
    ].map((w, i) => ({
      id: i+1,
      en: w.en,
      ru: w.ru,
      tr: w.tr || '',
      streak: 0,
      errors: 0,
      manual: false
    }));

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const data = JSON.parse(raw);
          const byKey = new Map(data.map(d => [d.en + '|' + d.ru, d]));
          return initialWords.map(w => {
            const k = w.en + '|' + w.ru;
            return byKey.has(k) ? Object.assign({}, w, byKey.get(k)) : w;
          });
        } catch { return initialWords.slice(); }
      }
      return initialWords.slice();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
      updateProgress();
    }

    function loadSettings() {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) { try { return JSON.parse(raw); } catch { return { showTr: false, theme: 'light' }; } }
      return { showTr: false, theme: 'light' };
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      document.documentElement.setAttribute('data-theme', settings.theme);
      updateProgress();
    }

    let words = loadState();
    let settings = loadSettings();
    document.documentElement.setAttribute('data-theme', settings.theme);

    // ---------- Helpers ----------
    let activeTab = 'test';

    function isLearned(w) { return w.streak >= 3 || w.manual; }
    function getUnlearned() { return words.filter(w => !isLearned(w)); }

    function updateProgress() {
      const total = words.length;
      const remaining = words.filter(w => !isLearned(w)).length;

      const mini = document.getElementById('miniCounter');
      if (mini) mini.textContent = `${total - remaining} / ${total}`;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRandom(arr, n, excludeItem) {
      const filtered = excludeItem !== undefined ? arr.filter(x => x !== excludeItem) : arr.slice();
      return shuffle(filtered).slice(0, n);
    }

    function nextOf(list, indexRef) {
      if (!list.length) return null;
      indexRef.value = (indexRef.value + 1) % list.length;
      return list[indexRef.value];
    }

    // ---------- UI Mount ----------
    const tabsEl = document.getElementById('tabs');
    const panelEl = document.getElementById('panel');

    function renderTabs() {
      const tabs = [
        { id: 'test', label: 'Тест' },
        { id: 'cards', label: 'Карточки' },
        { id: 'repeat', label: 'Повтор' },
        { id: 'input', label: 'Ввод' },
        { id: 'match', label: 'Сопоставление' },
        { id: 'dict', label: 'Словарь' },
        { id: 'manage', label: 'Управление' }
      ];

      tabsEl.innerHTML = tabs.map(tab => `
        <button
          class="tab-btn ${activeTab === tab.id ? 'active' : ''}"
          onclick="switchTab('${tab.id}')"
        >
          ${tab.label}
        </button>
      `).join('');
    }

    function switchTab(tabId) {
      activeTab = tabId;
      renderTabs();
      renderPanel();
    }

    // ---------- Tab: Test ----------
    let testIdx = { value: -1 };
    let currentTestWord = null;

    function renderTest(pickNew = true) {
      const pool = getUnlearned();
      if (!pool.length) { panelEl.innerHTML = `<div class="empty">Все слова выучены. Отличная работа!</div>`; return; }
      if (pickNew || !currentTestWord) currentTestWord = nextOf(pool, testIdx) || pool[0];

      const current = currentTestWord;
      const correctRu = current.ru;
      const distractors = pickRandom(words.map(w => w.ru), 3, correctRu);
      const options = shuffle([correctRu, ...distractors]);

      panelEl.innerHTML = `
        <div class="card">
          <div class="test-word" id="testWord" style="font-size:22px; font-weight:700">
            ${current.en}
          </div>
          <div class="test-transcription" id="testTranscription">
            ${current.tr ? `/${current.tr}/` : ''}
          </div>
        </div>
        <div class="options">
          ${options.map(o => `<div class="option" data-val="${o}">${o}</div>`).join('')}
        </div>
      `;

      const wordEl = document.getElementById('testWord');
      const trEl = document.getElementById('testTranscription');

      if (wordEl && trEl) {
        trEl.classList.remove('show');
        wordEl.onclick = () => {
          trEl.classList.toggle('show');
        };
      }

      let answered = false;
      panelEl.querySelectorAll('.option').forEach(opt => {
        opt.onclick = () => {
          if (answered) return;
          answered = true;
          const val = opt.dataset.val;
          const isCorrect = val === correctRu;
          if (isCorrect) {
            opt.classList.add('correct', 'selected');
            current.streak = (current.streak || 0) + 1;
          } else {
            opt.classList.add('wrong', 'selected');
            current.errors = (current.errors || 0) + 1;
            current.streak = 0;
            panelEl.querySelectorAll('.option').forEach(o => {
              if (o.dataset.val === correctRu) o.classList.add('correct');
            });
          }
          saveState();
          setTimeout(() => { currentTestWord = null; renderTest(true); }, 700);
        };
      });
    }

    // ---------- Tab: Cards ----------
    let cardsIdx = { value: -1 };
    let flipped = false;
    function renderCards() {
      const pool = getUnlearned();
      if (!pool.length) { panelEl.innerHTML = `<div class="empty">Все слова выучены — можно перейти к повторам или словарю.</div>`; return; }
      const current = nextOf(pool, cardsIdx) || pool[0];

      panelEl.innerHTML = `
        <div class="flip ${flipped ? 'flipped' : ''}" id="flip">
          <div class="flip-inner">
            <div class="flip-face">
              <div style="font-size:22px; font-weight:700">${current.en}</div>
              <div class="pill" style="margin-top:10px">Кликните для переворота</div>
            </div>
            <div class="flip-face flip-back">
              <div style="font-size:22px; font-weight:700">${current.ru}</div>
              <div class="row" style="margin-top:16px; justify-content:center">
                <button class="btn success" id="cardKnow">Знаю</button>
                <button class="btn" id="cardDontKnow">Не знаю</button>
              </div>
            </div>
          </div>
        </div>
      `;
      const flipEl = document.getElementById('flip');
      flipEl.onclick = (e) => {
        if (e.target.id === 'cardKnow' || e.target.id === 'cardDontKnow') return;
        flipped = !flipped;
        flipEl.classList.toggle('flipped', flipped);
      };
      document.getElementById('cardKnow').onclick = () => {
        current.streak += 1;
        saveState();
        flipped = false;
        setTimeout(renderCards, 400);
      };
      document.getElementById('cardDontKnow').onclick = () => {
        current.errors += 1;
        current.streak = 0;
        saveState();
        flipped = false;
        setTimeout(renderCards, 400);
      };
    }

    // ---------- Tab: Repeat ----------
    let repeatIdx = { value: -1 };
    function renderRepeat() {
      const pool = words.filter(w => w.errors > 0 && !isLearned(w) && !w.manual);
      if (!pool.length) {
        panelEl.innerHTML = `
          <div style="
            height: 100%;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
          ">
            <div class="empty">
              Пока нет слов для повтора. Ошибок нет — супер!
            </div>
          </div>
        `;
        return;
      }
      const current = nextOf(pool, repeatIdx) || pool[0];

      panelEl.innerHTML = `
        <div class="card">
          <div style="font-size:22px; font-weight:700">${current.en}</div>
          <div class="row" style="margin-top:16px; justify-content:center">
            <button class="btn success" id="repKnow">Знаю</button>
            <button class="btn" id="repDontKnow">Не знаю</button>
          </div>
          <div class="muted" style="margin-top:12px">Ошибок: ${current.errors}, Серия: ${current.streak}</div>
        </div>
      `;
      document.getElementById('repKnow').onclick = () => {
        current.errors = Math.max(0, current.errors - 1);
        current.streak += 1;
        saveState();
        setTimeout(renderRepeat, 400);
      };
      document.getElementById('repDontKnow').onclick = () => {
        current.errors += 1;
        current.streak = 0;
        saveState();
        setTimeout(renderRepeat, 400);
      };
    }

    // ---------- Tab: Input ----------
    let inputIdx = { value: -1 };
    function renderInput() {
      const pool = getUnlearned();
      if (!pool.length) { panelEl.innerHTML = `<div class="empty">Все слова выучены. Можете тренироваться в других режимах.</div>`; return; }
      const current = nextOf(pool, inputIdx) || pool[0];

      panelEl.innerHTML = `
        <div class="card" style="max-width:680px; margin:0 auto">
          <div style="font-size:22px; font-weight:700">${current.ru}</div>
        </div>
        <div class="field" style="max-width:680px; margin:12px auto 0">
          <input type="text" id="inputAnswer" placeholder="Введите английское слово..." autocomplete="off" />
          <button class="btn primary" id="inputCheck">Проверить</button>
        </div>
        <div id="inputFeedback" class="muted" style="max-width:680px; margin:10px auto 0; text-align:center"></div>
      `;
      const inEl = document.getElementById('inputAnswer');
      const fbEl = document.getElementById('inputFeedback');
      inEl.focus();

      function check() {
        const val = (inEl.value || '').trim();
        const target = current.en.trim();
        const ok = val.toLowerCase() === target.toLowerCase();
        if (ok) {
          fbEl.innerHTML = `<span style="color: var(--success)">Верно!</span>`;
          current.streak += 1;
        } else {
          fbEl.innerHTML = `<span style="color: var(--error)">Неверно. Правильно: ${current.en}</span>`;
          current.errors += 1;
          current.streak = 0;
        }
        saveState();
        setTimeout(renderInput, 2000);
      }

      document.getElementById('inputCheck').onclick = check;
      inEl.onkeydown = (e) => { if (e.key === 'Enter') check(); };
    }

    // ---------- Tab: Dictionary ----------
    let dictFilter = 'all';
    let dictQuery = '';
    function renderDict() {
      const header = `
        <div class="row" style="justify-content:space-between; gap:12px; flex-wrap:wrap">
          <div class="field" style="flex:2; min-width:240px">
            <input type="text" id="dictSearch"
              placeholder="Поиск по слову, переводу или транскрипции..."
              value="${dictQuery}">
          </div>

          <div class="field" style="flex:1; min-width:200px">
            <select id="dictFilter">
              <option value="all" ${dictFilter==='all'?'selected':''}>Все слова</option>
              <option value="learned" ${dictFilter==='learned'?'selected':''}>Только выученные</option>
              <option value="unlearned" ${dictFilter==='unlearned'?'selected':''}>Только невыученные</option>
            </select>
          </div>

          <div class="field" style="display:flex; gap:8px">
            <button class="btn success" id="markAll">Отметить всё выученным</button>
            <button class="btn error" id="resetAll">Полный сброс</button>
          </div>
        </div>
        <div class="divider"></div>
      `;

      let list = words.slice();
      list.sort((a, b) => a.en.localeCompare(b.en, 'en'));
      if (dictQuery.trim()) {
        const q = dictQuery.toLowerCase();
        list = list.filter(w =>
          w.en.toLowerCase().includes(q) ||
          w.ru.toLowerCase().includes(q) ||
          (w.tr || '').toLowerCase().includes(q)
        );
      }
      if (dictFilter === 'learned') list = list.filter(isLearned);
      if (dictFilter === 'unlearned') list = list.filter(w => !isLearned(w));

      const rows = list.map((w, idx) => `
        <tr class="${isLearned(w)?'learned-row':''}">
          <td class="center">${idx+1}</td>
          <td>${w.en}</td>
          <td>${w.ru}</td>
          <td class="center">${w.tr ? `/${w.tr}/` : ''}</td>
          <td class="center" style="width:100px">${w.streak}</td>
          <td class="center" style="width:100px">${w.errors}</td>
          <td class="center" style="width:100px">
            <input type="checkbox" ${w.manual?'checked':''} data-id="${w.id}" class="dictManual">
          </td>
        </tr>
      `).join('');

      panelEl.innerHTML = header + `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="center" style="width:70px">№</th>
                <th>Английское</th>
                <th>Перевод</th>
                <th class="center" style="width:160px">Транскрипция</th>
                <th class="center" style="width:120px">Правильно подряд</th>
                <th class="center" style="width:120px">Ошибки</th>
                <th class="center" style="width:140px">Выучено</th>
              </tr>
            </thead>
            <tbody>
              ${rows || `<tr><td colspan="7" class="center muted">Ничего не найдено</td></tr>`}
            </tbody>
          </table>
        </div>
      `;

      document.getElementById('resetAll').onclick = () => {
        if (!confirm('Точно сбросить весь прогресс?')) return;

        words.forEach(w => {
          w.streak = 0;
          w.errors = 0;
          w.manual = false;
        });

        saveState();
        renderDict();
      };

      document.getElementById('dictSearch').oninput = (e) => { dictQuery = e.target.value; renderDict(); };
      document.getElementById('dictFilter').onchange = (e) => { dictFilter = e.target.value; renderDict(); };
      panelEl.querySelectorAll('.dictManual').forEach(ch => {
        ch.onchange = () => {
          const id = Number(ch.dataset.id);
          const w = words.find(x => x.id === id);
          w.manual = ch.checked;
          saveState();
          renderDict();
        };
      });
      document.getElementById('markAll').onclick = () => {
        words.forEach(w => { w.manual = true; });
        saveState();
        renderDict();
      };
    }

    // ---------- Tab: Match ----------
    let matchSet = [];
    let matchPicked = null;

    function makeMatchSet(size = 4) {
      const pool = getUnlearned();
      const base = (pool.length ? pool : words);
      const chosen = pickRandom(base, Math.min(size, base.length));
      matchSet = chosen.map(w => ({ id: w.id, en: w.en, ru: w.ru }));
    }

    function renderMatch() {
      if (!matchSet.length) makeMatchSet(4);
      if (!matchSet.length) { panelEl.innerHTML = `<div class="empty">Слова недоступны для сопоставления.</div>`; return; }

      const ens = shuffle(matchSet.map(m => ({ type: 'en', id: m.id, text: m.en })));
      const rus = shuffle(matchSet.map(m => ({ type: 'ru', id: m.id, text: m.ru })));

      panelEl.innerHTML = `
        <div class="match-columns">
          <div>
            <div class="muted" style="margin-bottom:8px; text-align:center">Английские</div>
            <div class="grid" id="matchEn">
              ${ens.map(e => `<div class="option" data-id="${e.id}" data-type="en">${e.text}</div>`).join('')}
            </div>
          </div>
          <div>
            <div class="muted" style="margin-bottom:8px; text-align:center">Русские</div>
            <div class="grid" id="matchRu">
              ${rus.map(r => `<div class="option" data-id="${r.id}" data-type="ru">${r.text}</div>`).join('')}
            </div>
          </div>
        </div>
      `;

      const all = panelEl.querySelectorAll('.option');
      all.forEach(el => {
        el.onclick = () => {
          const id = Number(el.dataset.id);
          const type = el.dataset.type;
          if (!matchPicked) {
            if (type !== 'en') return;
            matchPicked = id;
            el.classList.add('selected');
          } else {
            if (type !== 'ru') return;
            const pairId = id;
            const correct = pairId === matchPicked;
            const enEl = panelEl.querySelector(`.option[data-type="en"][data-id="${matchPicked}"]`);
            const ruEl = el;
            if (correct) {
              enEl.classList.add('correct');
              ruEl.classList.add('correct');
              const w = words.find(x => x.id === matchPicked);
              if (w) w.streak += 1;
              matchSet = matchSet.filter(m => m.id !== matchPicked);
              saveState();
            } else {
              enEl.classList.add('wrong');
              ruEl.classList.add('wrong');
              const w = words.find(x => x.id === matchPicked);
              if (w) { w.errors += 1; w.streak = 0; }
              saveState();
            }
            matchPicked = null;
            setTimeout(() => {
              if (!matchSet.length) { makeMatchSet(4); }
              renderMatch();
            }, 500);
          }
        };
      });
    }

    // ---------- Tab: Manage (Import/Export) ----------
    function renderManage() {
      panelEl.innerHTML = `
        <!-- Экспорт -->
        <div class="import-section">
          <h3>📤 Экспорт словаря</h3>
          <p>Сохраните текущий словарь в JSON файл</p>
          <button class="btn primary" id="exportBtn">Скачать словарь (JSON)</button>
        </div>

        <!-- Импорт -->
        <div class="import-section">
          <h3>📥 Импорт словаря</h3>
          <p>Загрузите JSON файл со словами (заменит текущий словарь)</p>
          <div class="file-input-wrapper">
            <input type="file" id="importFile" accept=".json">
            <label for="importFile" class="file-input-label">Выбрать файл</label>
          </div>
          <div id="importStatus" style="margin-top:10px; color: var(--muted); font-size: 14px;"></div>
        </div>

        <!-- Добавление слова -->
        <div class="import-section">
          <h3>➕ Добавить слово вручную</h3>
          <div class="field">
            <input type="text" id="addEn" placeholder="Английское слово">
          </div>
          <div class="field" style="margin-top:8px">
            <input type="text" id="addRu" placeholder="Русский перевод">
          </div>
          <div class="field" style="margin-top:8px">
            <input type="text" id="addTr" placeholder="Транскрипция (опционально)">
          </div>
          <button class="btn success" id="addWordBtn" style="margin-top:12px">Добавить слово</button>
        </div>

        <!-- Очистка -->
        <div class="import-section">
          <h3>🗑️ Удалить все слова</h3>
          <p style="color: var(--error)">Внимание! Это действие удалит все слова без возможности восстановления</p>
          <button class="btn error" id="clearAllBtn">Удалить весь словарь</button>
        </div>

        <!-- Формат файла -->
        <div class="import-section">
          <h3>ℹ️ Формат JSON файла</h3>
          <p>Файл должен содержать массив объектов:</p>
          <textarea readonly>[
  {
    "en": "hello",
    "ru": "привет",
    "tr": "хэлоу"
  },
  {
    "en": "world",
    "ru": "мир",
    "tr": "ворлд"
  }
]</textarea>
        </div>
      `;

      // Экспорт
      document.getElementById('exportBtn').onclick = () => {
        const exportData = words.map(w => ({
          en: w.en,
          ru: w.ru,
          tr: w.tr || ''
        }));
        
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `words-easy-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // Импорт
      document.getElementById('importFile').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const status = document.getElementById('importStatus');
        
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            
            if (!Array.isArray(imported)) {
              status.innerHTML = '<span style="color: var(--error)">❌ Ошибка: файл должен содержать массив</span>';
              return;
            }

            const newWords = imported.map((w, i) => ({
              id: Date.now() + i,
              en: w.en || '',
              ru: w.ru || '',
              tr: w.tr || '',
              streak: 0,
              errors: 0,
              manual: false
            }));

            if (confirm(`Импортировать ${newWords.length} слов? Текущий словарь будет заменён.`)) {
              words = newWords;
              saveState();
              status.innerHTML = `<span style="color: var(--success)">✅ Импортировано ${newWords.length} слов</span>`;
              setTimeout(() => {
                switchTab('dict');
              }, 1500);
            }
          } catch (error) {
            status.innerHTML = `<span style="color: var(--error)">❌ Ошибка: неверный формат JSON</span>`;
          }
        };
        
        reader.readAsText(file);
      };

      // Добавление слова
      document.getElementById('addWordBtn').onclick = () => {
        const en = document.getElementById('addEn').value.trim();
        const ru = document.getElementById('addRu').value.trim();
        const tr = document.getElementById('addTr').value.trim();

        if (!en || !ru) {
          alert('Заполните английское слово и перевод');
          return;
        }

        const newWord = {
          id: Date.now(),
          en: en,
          ru: ru,
          tr: tr,
          streak: 0,
          errors: 0,
          manual: false
        };

        words.push(newWord);
        saveState();
        
        document.getElementById('addEn').value = '';
        document.getElementById('addRu').value = '';
        document.getElementById('addTr').value = '';
        
        alert(`Слово "${en}" добавлено!`);
      };

      // Очистка всех слов
      document.getElementById('clearAllBtn').onclick = () => {
        if (!confirm('Вы уверены? Все слова будут удалены без возможности восстановления!')) return;
        if (!confirm('Это последнее предупреждение. Удалить ВСЕ слова?')) return;
        
        words = [];
        saveState();
        alert('Все слова удалены');
        renderManage();
      };
    }

    // ---------- Mount ----------
    function renderPanel() {
      updateProgress();
      switch (activeTab) {
        case 'test': renderTest(); break;
        case 'cards': renderCards(); break;
        case 'repeat': renderRepeat(); break;
        case 'input': renderInput(); break;
        case 'dict': renderDict(); break;
        case 'match': renderMatch(); break;
        case 'manage': renderManage(); break;
      }
    }

    const miniThemeBtn = document.getElementById('miniTheme');

    function updateThemeIcon() {
      miniThemeBtn.textContent = settings.theme === 'dark' ? '🌙' : '☀️';
    }

    miniThemeBtn.onclick = () => {
      settings.theme = settings.theme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', settings.theme);
      saveSettings();
      updateThemeIcon();
    };

    updateThemeIcon();
    renderTabs();
    renderPanel();
  </script>
</body>
</html>
