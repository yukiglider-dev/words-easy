<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Words Easy</title>
  <style>
    :root {
      --bg: #fbe7ef;
      --card: #ffffff;
      --primary: #ff8fb1;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
    }
    .app {
      width: 420px;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 auto;
      font-size: 24px;
    }
    .lang-toggle {
      font-size: 12px;
    }
    nav {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    nav button {
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
    }
    .view { display: none; }
    .view.active { display: block; }

    /* CARD */
    .card-container {
      perspective: 1000px;
      margin: 0 auto 15px;
    }
    .card {
      width: 100%;
      height: 140px;
      background: var(--card);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }
    .card.flipped { transform: rotateY(180deg); }
    .side {
      position: absolute;
      backface-visibility: hidden;
    }
    .back { transform: rotateY(180deg); }

    .answer-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .answer-buttons button {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    td, th {
      border-bottom: 1px solid #ddd;
      padding: 6px;
      text-align: left;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div></div>
    <h1>Words Easy</h1>
    <select class="lang-toggle" id="langToggle">
      <option value="en">EN</option>
      <option value="ru">RU</option>
    </select>
  </header>

  <nav>
    <button onclick="showView('cards')">Карточки</button>
    <button onclick="showView('repeat')">Повтор</button>
    <button onclick="showView('dict')">Словарь</button>
  </nav>

  <!-- CARDS -->
  <div id="cards" class="view active">
    <div class="card-container">
      <div class="card" id="card">
        <div class="side front" id="cardFront"></div>
        <div class="side back" id="cardBack"></div>
      </div>
    </div>
    <div class="answer-buttons">
      <button onclick="markWord(true)">Да</button>
      <button onclick="markWord(false)">Нет</button>
    </div>
    <p id="context" style="text-align:center;margin-top:10px;"></p>
  </div>

  <!-- REPEAT -->
  <div id="repeat" class="view">
    <p style="text-align:center;">Здесь повторяются сложные слова</p>
  </div>

  <!-- DICTIONARY -->
  <div id="dict" class="view">
    <table>
      <thead>
        <tr><th>#</th><th>EN</th><th>RU</th><th>Чтение</th></tr>
      </thead>
      <tbody id="dictionary"></tbody>
    </table>
  </div>
</div>

<script>
let words = [
  {en:'here',ru:'здесь',tr:'хиэ',example:'I am here',correct:0,errors:0,learned:false},
  {en:'there',ru:'там',tr:'зеа',example:'She is there',correct:0,errors:0,learned:false},
  {en:'understand',ru:'понимать',tr:'андерстэнд',example:'I understand you',correct:0,errors:0,learned:false}
];

const card = document.getElementById('card');
const front = document.getElementById('cardFront');
const back = document.getElementById('cardBack');
const context = document.getElementById('context');
const dictBody = document.getElementById('dictionary');
const langToggle = document.getElementById('langToggle');

let current = null;
let showLang = 'en';

langToggle.onchange = () => showLang = langToggle.value;

function save() {
  localStorage.setItem('wordsEasy', JSON.stringify(words));
}
function load() {
  const s = localStorage.getItem('wordsEasy');
  if (s) words = JSON.parse(s);
}

function nextWord(pool = words.filter(w=>!w.learned)) {
  current = pool[Math.floor(Math.random()*pool.length)];
  card.classList.remove('flipped');
  front.textContent = showLang==='en'?current.en:current.ru;
  back.textContent = showLang==='en'?current.ru:current.en;
  context.textContent = current.example || '';
}

card.onclick = ()=> card.classList.toggle('flipped');

function markWord(ok) {
  if (!current) return;
  if (ok) {
    current.correct++;
    if (current.correct >= 3) current.learned = true;
  } else {
    current.errors++;
  }
  save();
  nextWord();
  renderDict();
}

function renderDict() {
  dictBody.innerHTML='';
  [...words].sort((a,b)=>a.en.localeCompare(b.en))
    .forEach((w,i)=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${i+1}</td><td>${w.en}</td><td>${w.ru}</td><td>${w.tr}</td>`;
      dictBody.appendChild(tr);
    });
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

load();
renderDict();
nextWord();
</script>
</body>
</html>
