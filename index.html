<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>

  <style>
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --card: #ffffff;
  --text: #0b1220;
  --muted: #5f6b7a;

  --primary: #5da9ff;
  --success: #22c55e;
  --error: #ef4444;

  --border: rgba(0,0,0,0.08);
  --shadow: 0 12px 30px rgba(0,0,0,0.08);

  --card-radius: 18px;
  --btn-radius: 14px;
  --input-radius: 14px;
}

[data-theme="dark"] {
  --bg: radial-gradient(
    1200px 600px at top,
    #16243a 0%,
    #0f1722 55%,
    #0b1220 100%
  );

  --surface: #152233;
  --card: #14243c;

  --text: #eaf1f9;
  --muted: #b3c0cc;

  --primary: #5da9ff;
  --success: #35d27f;
  --error: #ff6b5e;

  --accent-1: #1b2f4a;
  --accent-2: #183a2a;
  --accent-3: #3a1f1f;

  --border: #233244;
  --shadow: 0 12px 36px rgba(0,0,0,0.45);
}



html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell,
    "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji",
    "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
  margin: 0;
}

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      text-align: center; /* название по центру */
      margin-bottom: 12px;
    }
    .brand-title {
      font-weight: 800;
      letter-spacing: 0.3px;
      font-size: 26px;
    }

    .progress {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      padding: 12px 16px;
      margin: 10px auto;
      max-width: 900px;
    }

    .progress-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-label { color: var(--muted); font-size: 13px; }
    .progress-value { font-weight: 700; font-size: 16px; }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }
    button, .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--btn-radius);
      cursor: pointer;
      transition: transform 0.05s ease, background 0.2s ease, border-color 0.2s ease;
      box-shadow: var(--shadow);
      font-weight: 600;
    }
    button:hover, .btn:hover { transform: translateY(-1px); }
    button.primary { background: var(--primary); color: #fff; border-color: transparent; }
    button.success { background: var(--success); color: #fff; border-color: transparent; }
    button.error { background: var(--error); color: #fff; border-color: transparent; }
.container {
  background: var(--surface);
  border-radius: var(--card-radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

    .tabs {
      display: flex;
      justify-content: center; /* вкладки по центру */
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      padding: 16px;
      min-height: 220px;
    }

    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .muted { color: var(--muted); }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }

   .card {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow);
  min-width: 260px;
  min-height: 120px;
  display: grid;
  place-items: center;
  text-align: center;
  position: relative;
  width: 100%;
  box-sizing: border-box;
}

.card .empty {
  align-content: center;
}

   .test-transcription {
  margin-top: 6px; /* было 10 — уменьшили */
}

    /* Тест: одна колонка — 4 строки */
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .option {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      text-align: center;
      box-shadow: var(--shadow);
      user-select: none;
    }
    .option.correct { background: var(--accent-2); border-color: var(--success); }
    .option.wrong { background: var(--accent-3); border-color: var(--error); }
    .option.selected { outline: 2px solid var(--primary); }

    /* Карточки: flip */
    .flip {
      perspective: 800px;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }
    .flip-inner {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }
    .flipped .flip-inner { transform: rotateY(180deg); }
    .flip-face {
      position: absolute;
      width: 100%;
      backface-visibility: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: var(--shadow);
      min-height: 140px;
      display: grid;
      place-items: center;
    }
    .flip-back { transform: rotateY(180deg); background: var(--accent-1); }

    /* Сопоставление: две колонки списков */
    .match-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field { display: flex; gap: 8px; align-items: center; }
    input[type="text"], select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      width: 100%;
    }

    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px; text-align: left; }
    th.center, td.center { text-align: center; }
    tr.learned-row { background: rgba(52,199,89,0.10); }

    .pill {
      font-size: 12px;
      color: var(--muted);
      background: var(--accent-1);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
    }
    .empty { text-align: center; color: var(--muted); padding: 20px; }
    
    @media (max-width: 640px) {
      .match-columns { grid-template-columns: 1fr; }
      .progress { flex-direction: column; align-items: center; }
    }
    /* ===== MINI UI ===== */


.mini-counter {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  font-weight: 700;
  color: var(--muted);
}

.mini-theme {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  box-shadow: var(--shadow);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
  font-size: 14px;
  line-height: 1;
}
.mini-theme {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.test-transcription {
  margin-bottom: 10px;
  font-size: 18px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.test-transcription.show {
  opacity: 1;
  pointer-events: auto;
}

.test-word {
  cursor: pointer;
  padding: 40px 0px 20px 0px;
}

.card {
  box-sizing: border-box;
}
.tabs-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 12px 0;
}

/* вкладки по центру */
.tabs {
  flex: 1;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* mini ui теперь не fixed */

@media (max-width: 640px) {
  .tabs-bar {
    flex-direction: column;
    align-items: center;
  }
}
.mini-ui.inline {
  display: flex;
  flex-direction: row;      /* ВАЖНО */
  align-items: center;      /* выравнивание по вертикали */
  gap: 8px;
}
/* ===== MODAL ===== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 520px;
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 24px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 22px;
  font-weight: 800;
}

.modal-close {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--muted);
}

.modal-desc {
  margin: 6px 0 16px;
  color: var(--muted);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
}
.panel-center {
  min-height: 220px;

  align-items: center;
  justify-content: center;
  text-align: center;

.empty-center {

  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--muted);
}
.btn-del {

  font-size: 14px;
  border-radius: 10px;
  line-height: 1;
}

  display: flex;
  align-items: center;      /* вертикаль */

.assembly-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.options.vertical {
  display: flex;

  gap: 8px;

.option.active {

/* ===== INPUT (поиск неправильных глаголов) ===== */
input,

input::-webkit-input-placeholder {

input::placeholder {

.repeat-center {

  display: flex;
  align-items: center;

.repeat-empty-card {

/* ===== LIGHT THEME INPUT FIX ===== */
html[data-theme="light"] input,

function normalizeIrregulars() {

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);

  // если localStorage пуст — просто берём initialWords
  if (!raw) return initialWords.slice();

  try {
    const saved = JSON.parse(raw);

    // карта сохранённых слов
    const savedMap = new Map(
      saved.map(w => [w.en + '|' + w.ru, w])
    );

    // 1. обновляем initialWords сохранёнными данными
    const merged = initialWords.map(w => {
      const key = w.en + '|' + w.ru;
      return savedMap.has(key)
        ? { ...w, ...savedMap.get(key) }
        : w;
    });

    // 2. добавляем слова, которых НЕТ в initialWords (ручной ввод)
    saved.forEach(w => {
      const key = w.en + '|' + w.ru;
      if (!merged.some(x => x.en + '|' + x.ru === key)) {
        merged.push(w);
      }
    });

    return merged;
  } catch (e) {
    console.error('Ошибка загрузки слов:', e);
    return initialWords.slice();
  }
}

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRandom(arr, n, excludeItem) {
      const filtered = excludeItem !== undefined ? arr.filter(x => x !== excludeItem) : arr.slice();
      return shuffle(filtered).slice(0, n);
    }

    function nextOf(list, indexRef) {
      if (!list.length) return null;
      indexRef.value = (indexRef.value + 1) % list.length;
      return list[indexRef.value];
    }

  });

  }

  updateProgress();
}

    let matchSet = [];
    let matchPicked = null;

    function makeMatchSet(size = 4) {
      const pool = getUnlearned();
      const base = (pool.length ? pool : words);
      const chosen = pickRandom(base, Math.min(size, base.length));
      matchSet = chosen.map(w => ({ id: w.id, en: w.en, ru: w.ru }));
    }

    function renderMatch() {
      if (!matchSet.length) makeMatchSet(4);
      if (!matchSet.length) { panelEl.innerHTML = `<div class="empty">Слова недоступны для сопоставления.</div>`; return; }

      const ens = shuffle(matchSet.map(m => ({ type: 'en', id: m.id, text: m.en })));
      const rus = shuffle(matchSet.map(m => ({ type: 'ru', id: m.id, text: m.ru })));

      panelEl.innerHTML = `
        <div class="match-columns">
          <div>
            <div class="muted" style="margin-bottom:8px; text-align:center">Английские</div>
            <div class="grid" id="matchEn">
              ${ens.map(e => `<div class="option" data-id="${e.id}" data-type="en">${e.text}</div>`).join('')}
            </div>
          </div>
          <div>
            <div class="muted" style="margin-bottom:8px; text-align:center">Русские</div>
            <div class="grid" id="matchRu">
              ${rus.map(r => `<div class="option" data-id="${r.id}" data-type="ru">${r.text}</div>`).join('')}
            </div>
          </div>
        </div>
      `;

      const all = panelEl.querySelectorAll('.option');
      all.forEach(el => {
        el.onclick = () => {
          const id = Number(el.dataset.id);
          const type = el.dataset.type;
          if (!matchPicked) {
            if (type !== 'en') return; // сначала выбираем английское слово
            matchPicked = id;
            el.classList.add('selected');
          } else {
            if (type !== 'ru') return;
            const pairId = id;
            const correct = pairId === matchPicked;
            const enEl = panelEl.querySelector(`.option[data-type="en"][data-id="${matchPicked}"]`);
            const ruEl = el;
            if (correct) {
              enEl.classList.add('correct');
              ruEl.classList.add('correct');
              const w = words.find(x => x.id === matchPicked);
              if (w) w.streak += 1;
              // удалить пару сразу
              matchSet = matchSet.filter(m => m.id !== matchPicked);
              saveState();
            } else {
              enEl.classList.add('wrong');
              ruEl.classList.add('wrong');
              const w = words.find(x => x.id === matchPicked);
              if (w) { w.errors += 1; w.streak = 0; }
              saveState();
            }
            matchPicked = null;
            setTimeout(() => {
              if (!matchSet.length) { makeMatchSet(4); }
              renderMatch();
            }, 500);
          }
        };
      });
    }

      streak: 0,
      errors: 0,
      learned: false
    });

    saveIrregulars();
    updateTable();
  };

  // первый рендер
  updateTable();
}

function renderIrAssembly() {
  const pool = irregulars.filter(v => !v.learned);

  if (!pool.length) {
    panelEl.innerHTML = `
      <div class="card center">
        <h3>🎉 Все неправильные глаголы выучены!</h3>
      </div>
    `;
    return;
  }

  const current = pool[Math.floor(Math.random() * pool.length)];

  function getOptions(correct, field) {
    const others = irregulars
      .filter(v => v !== current)
      .map(v => v[field])
      .filter(v => v && v !== correct);

    return [...others.sort(() => Math.random() - 0.5).slice(0, 3), correct]
      .sort(() => Math.random() - 0.5);
  }

  const pastOptions = getOptions(current.past, 'past');
  const ppOptions = getOptions(current.pp, 'pp');

  panelEl.innerHTML = `
    <div class="card">
      <div class="center" style="font-size:26px; font-weight:700">
        ${current.base}
      </div>

      <div class="center muted" style="margin-bottom:14px">
        ${current.ru}
      </div>

      <div class="assembly-grid">
        <div>
          <div class="muted center">Past</div>
          <div class="options vertical">
            ${pastOptions.map(v =>
              `<div class="option" data-type="past" data-val="${v}">${v}</div>`
            ).join('')}
          </div>
        </div>

        <div>
          <div class="muted center">PP</div>
          <div class="options vertical">
            ${ppOptions.map(v =>
              `<div class="option" data-type="pp" data-val="${v}">${v}</div>`
            ).join('')}
          </div>
        </div>
      </div>

      <div id="assemblyResult" class="center muted" style="margin-top:12px"></div>
    </div>
  `;

  let selected = { past: null, pp: null };

  document.querySelectorAll('.option').forEach(opt => {
    opt.onclick = () => {
      const type = opt.dataset.type;
      selected[type] = opt.dataset.val;

      document
        .querySelectorAll(`.option[data-type="${type}"]`)
        .forEach(o => o.classList.remove('active'));

      opt.classList.add('active');

      if (selected.past && selected.pp) {
        check();
      }
    };
  });

  function check() {
    const resultEl = document.getElementById('assemblyResult');

    const ok =
      selected.past === current.past &&
      selected.pp === current.pp;

    let timeDurtion = 1500;
    
    if (ok) {
      current.streak = (current.streak || 0) + 1;

      if (current.streak >= 3) {
        current.learned = true;
        current.needRepeat = false; // ✅ УБРАЛИ ИЗ ПОВТОРА
        resultEl.innerHTML = '🎉 Выучено!';
      } else {
              resultEl.innerHTML = `✅ Верно (${current.streak}/3)`;
            }
  } else {
    current.errors = (current.errors || 0) + 1;
    current.streak = 0;
  
    // 🚨 ОТПРАВЛЯЕМ В ПОВТОР
    current.needRepeat = true;
    current.learned = false;
  
    resultEl.innerHTML = `
      ❌ Ошибка<br>
      <span class="muted">Past:</span> <b>${current.past}</b>,
      <span class="muted">PP:</span> <b>${current.pp}</b>
    `;
      timeDurtion = 3000;
}


    saveIrregulars();
    setTimeout(renderIrAssembly, timeDurtion);
  }
}


    renderTabs();
    renderPanel();
  </script>
</body>
