<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>
<style>
:root{
  --pink:#fbe7ef;
  --blue:#e6f4ff;
  --card:#fff;
  --accent:#ff8fb1;
}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--pink);
  display:flex;
  justify-content:center;
}
.app{width:420px;padding:16px}
header{position:relative;text-align:center}
.lang-toggle{position:absolute;right:0;top:0;font-size:12px}
h1{margin:0 0 10px}
nav{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
nav button{border:none;border-radius:10px;padding:6px 10px;background:var(--accent);color:#fff;cursor:pointer}
.view{display:none}
.view.active{display:block}

/* CARD */
.card-wrap{perspective:1000px;margin-bottom:10px}
.card{height:140px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:transform .6s;transform-style:preserve-3d;position:relative}
.card.flipped{transform:rotateY(180deg)}
.side{position:absolute;backface-visibility:hidden;padding:10px;text-align:center}
.back{transform:rotateY(180deg)}

.answer{display:flex;gap:10px}
.answer button{flex:1;border:none;border-radius:10px;padding:8px;cursor:pointer}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #ddd;padding:6px}

.filters{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>Words Easy</h1>
<select id="langToggle" class="lang-toggle">
<option value="en">EN</option>
<option value="ru">RU</option>
</select>
</header>

<nav>
<button onclick="showView('cards')">Карточки</button>
<button onclick="showView('test')">Тест</button>
<button onclick="showView('repeat')">Повтор</button>
<button onclick="showView('dict')">Словарь</button>
</nav>

<!-- CARDS -->
<div id="cards" class="view active">
<div class="filters">
<button onclick="setDifficulty('easy')">Легко</button>
<button onclick="setDifficulty('medium')">Средне</button>
<button onclick="setDifficulty('hard')">Сложно</button>
</div>
<div class="card-wrap">
<div id="card" class="card">
<div id="front" class="side"></div>
<div id="back" class="side back"></div>
</div>
</div>
<div class="answer">
<button onclick="mark(true)">Да</button>
<button onclick="mark(false)">Нет</button>
</div>
<p id="context" style="text-align:center"></p>
</div>

<!-- TEST -->
<div id="test" class="view">
<p id="testWord" style="text-align:center;font-size:22px"></p>
<div id="options"></div>
</div>

<!-- REPEAT -->
<div id="repeat" class="view">
<p style="text-align:center">Повтор сложных слов</p>
</div>

<!-- DICTIONARY -->
<div id="dict" class="view">
<table>
<thead><tr><th>#</th><th>EN</th><th>RU</th><th>Чтение</th></tr></thead>
<tbody id="dictionary"></tbody>
</table>
</div>
</div>

<script>
/* ================= DATA ================= */
let words = [
{en:'here',ru:'здесь',tr:'хиэ',ex:'Come here',c:0,e:0,l:false},
{en:'there',ru:'там',tr:'зеа',ex:'Over there',c:0,e:0,l:false},
{en:'at school',ru:'в школе',tr:'эт скул',ex:'She is at school',c:0,e:0,l:false},
{en:'understand',ru:'понимать',tr:'андерстэнд',ex:'I understand you',c:0,e:0,l:false},
{en:'know',ru:'знать',tr:'ноу',ex:'I know it',c:0,e:0,l:false},
{en:'eat',ru:'есть',tr:'ит',ex:'They eat lunch',c:0,e:0,l:false},
{en:'drink',ru:'пить',tr:'дринк',ex:'I drink water',c:0,e:0,l:false},
{en:'sleep',ru:'спать',tr:'слиип',ex:'I sleep well',c:0,e:0,l:false},
{en:'ask',ru:'спрашивать',tr:'аск',ex:'Ask him',c:0,e:0,l:false},
{en:'read',ru:'читать',tr:'рид',ex:'I read books',c:0,e:0,l:false},
{en:'write',ru:'писать',tr:'райт',ex:'Write it',c:0,e:0,l:false},
{en:'buy',ru:'покупать',tr:'бай',ex:'Buy food',c:0,e:0,l:false},
{en:'play',ru:'играть',tr:'плэй',ex:'Children play',c:0,e:0,l:false},
{en:'work',ru:'работать',tr:'вёрк',ex:'I work here',c:0,e:0,l:false},
{en:'study',ru:'учиться',tr:'стади',ex:'I study English',c:0,e:0,l:false},
{en:'busy',ru:'занятый',tr:'бизи',ex:'I am busy',c:0,e:0,l:false},
{en:'cosy',ru:'уютный',tr:'коузи',ex:'It is cosy',c:0,e:0,l:false},
{en:'rich',ru:'богатый',tr:'рич',ex:'He is rich',c:0,e:0,l:false},
{en:'poor',ru:'бедный',tr:'пуа',ex:'She is poor',c:0,e:0,l:false}
];

/* ================= STATE ================= */
let current=null;
let difficulty='easy';
let langMode='en';

/* ================= ELEMENTS ================= */
const card=document.getElementById('card');
const front=document.getElementById('front');
const back=document.getElementById('back');
const context=document.getElementById('context');
const dict=document.getElementById('dictionary');
const lang=document.getElementById('langToggle');

/* ================= STORAGE ================= */
function save(){localStorage.setItem('wordsEasy',JSON.stringify(words));}
function load(){const s=localStorage.getItem('wordsEasy');if(s)words=JSON.parse(s);}

/* ================= LOGIC ================= */
lang.onchange=()=>{langMode=lang.value;renderCard();}
function setDifficulty(d){difficulty=d;renderCard();}

function nextWord(pool=words.filter(w=>!w.l)){
  current=pool[Math.floor(Math.random()*pool.length)];
  card.classList.remove('flipped');
  renderCard();
}

function renderCard(){
  if(!current)return;
  let frontText=langMode==='en'?current.en:current.ru;
  let backText=langMode==='en'?current.ru:current.en;
  if(difficulty==='easy'){}
  if(difficulty==='medium'){}
  if(difficulty==='hard'){}
  front.textContent=frontText;
  back.textContent=backText;
  context.textContent=current.ex;
}

card.onclick=()=>card.classList.toggle('flipped');

function mark(ok){
  if(ok){current.c++;if(current.c>=3)current.l=true;} else current.e++;
  save();renderDict();nextWord();
}

function renderDict(){
  dict.innerHTML='';
  [...words].sort((a,b)=>a.en.localeCompare(b.en)).forEach((w,i)=>{
    dict.innerHTML+=`<tr><td>${i+1}</td><td>${w.en}</td><td>${w.ru}</td><td>${w.tr}</td></tr>`;
  });
}

function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}

/* ================= INIT ================= */
load();renderDict();nextWord();
</script>
</body>
</html>
