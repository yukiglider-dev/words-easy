<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Words Easy</title>

<style>
body{
  font-family:Arial;
  background:#f2f2f2;
  margin:0;
  padding:20px;
}
.app{
  max-width:520px;
  margin:auto;
  background:#fff;
  border-radius:16px;
  padding:20px;
}
button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.correct{background:#4caf50;color:#fff}
.wrong{background:#f44336;color:#fff}
.hidden{display:none}
.center{text-align:center}
.reading{opacity:.7;font-style:italic}
.example{
  margin:8px 0;
  font-size:15px;
  color:#333;
}
</style>
</head>

<body>
<div class="app">

<h2 class="center">Words Easy</h2>

<button onclick="mode='test';render()">Тест</button>
<button onclick="mode='cards';render()">Карточки</button>

<hr>

<!-- TEST -->
<div id="test" class="center hidden">
  <h2 id="word"></h2>
  <div id="reading" class="reading"></div>
  <div id="example" class="example"></div>
  <div id="answers"></div>
</div>

<!-- CARDS -->
<div id="cards" class="center hidden">
  <div style="font-size:26px;margin:20px" id="card"></div>
  <button onclick="flip()">Перевернуть</button>
  <button onclick="nextCard()">Дальше</button>
</div>

</div>

<script>
/* ===== СЛОВА ===== */
const raw = [
"work|работать|вёрк|I work every day.",
"study|учиться|стади|I study English.",
"eat|есть|ит|I eat breakfast.",
"drink|пить|дринк|I drink water.",
"sleep|спать|слиип|I want to sleep.",
"read|читать|рид|I read books.",
"write|писать|райт|I write messages.",
"play|играть|плэй|I play football.",
"buy|покупать|бай|I buy food.",
"think|думать|синк|I think about it.",
"understand|понимать|андэстэнд|I understand you.",
"know|знать|ноу|I know the answer.",
"arrive|прибывать|эрайв|We arrive early.",
"wait|ждать|вэйт|Please wait here.",
"ask|спрашивать|аск|I ask a question.",
"explain|объяснять|иксплэйн|Explain this rule.",
"take|брать|тэйк|Take this book.",
"want|хотеть|вонт|I want coffee.",
"work hard|много работать|вёрк хард|I work hard every day."
];

const saved = JSON.parse(localStorage.getItem('progress')||'[]');

let words = raw.map((s,i)=>{
  const [en,ru,read,ex]=s.split('|');
  return saved[i] || {en,ru,read,ex,streak:0};
});

let mode='test';
let index=0;
let flipped=false;

const wEl=document.getElementById('word');
const rEl=document.getElementById('reading');
const eEl=document.getElementById('example');
const aEl=document.getElementById('answers');
const cEl=document.getElementById('card');

function save(){
  localStorage.setItem('progress',JSON.stringify(words));
}

function pick(){
  const pool=words.filter(w=>w.streak<3);
  if(!pool.length){
    alert('🎉 Все слова выучены');
    return null;
  }
  return words.indexOf(pool[Math.floor(Math.random()*pool.length)]);
}

/* ===== TEST ===== */
function renderTest(){
  index=pick();
  if(index===null) return;

  const w=words[index];
  wEl.textContent=w.en;
  rEl.textContent=w.read;
  eEl.textContent=w.ex;

  aEl.innerHTML='';
  let opts=[w.ru];
  while(opts.length<4){
    let r=words[Math.floor(Math.random()*words.length)].ru;
    if(!opts.includes(r)) opts.push(r);
  }
  opts.sort(()=>Math.random()-0.5);

  opts.forEach(t=>{
    const b=document.createElement('button');
    b.textContent=t;
    b.onclick=()=>{
      if(t===w.ru){
        b.classList.add('correct');
        w.streak++;
      }else{
        b.classList.add('wrong');
        w.streak=0;
      }
      save();
      setTimeout(renderTest,600);
    };
    aEl.appendChild(b);
  });
}

/* ===== CARDS ===== */
function renderCard(){
  const w=words[index];
  cEl.textContent=flipped ? `${w.ru}\n${w.ex}` : w.en;
}
function flip(){flipped=!flipped;renderCard()}
function nextCard(){
  index=pick();
  flipped=false;
  renderCard();
}

/* ===== MAIN RENDER ===== */
function render(){
  document.getElementById('test').classList.toggle('hidden',mode!=='test');
  document.getElementById('cards').classList.toggle('hidden',mode!=='cards');

  if(mode==='test') renderTest();
  else{
    index=pick();
    renderCard();
  }
}

render();
</script>
</body>
</html>
